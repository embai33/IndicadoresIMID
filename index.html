                                            style={{
                                                padding: '8px',
                                                borderRadius: '5px',
                                                border: '1px solid #ddd',
                                                fontSize: '14px'
                                            }}
                                        />
                                    </div>

                                    <div className="filter-group">
                                        <label>Fecha hasta</label>
                                        <input 
                                            type="date"
                                            value={filters.dateTo} 
                                            onChange={(e) => setFilters({...filters, dateTo: e.target.value})}
                                            style={{
                                                padding: '8px',
                                                borderRadius: '5px',
                                                border: '1px solid #ddd',
                                                fontSize: '14px'
                                            }}
                                        />
                                    </div>
                                </div>
        
                                {(filters.year || filters.service || filters.pathology || filters.activeIngredient || filters.dateFrom || filters.dateTo) && (
                                    <div style={{marginTop: '15px', padding: '10px', background: '#fff3cd', borderRadius: '8px', color: '#856404'}}>
                                        ⚠️ Filtros activos: Se procesarán {applyFilters()?.length || 0} de {data.length} registros
                                        <button 
                                            style={{marginLeft: '15px', padding: '5px 15px', background: '#667eea', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
                                            onClick={() => setFilters({ year: '', service: '', pathology: '', activeIngredient: '', dateFrom: '', dateTo: '' })}
                                        >
                                            Limpiar filtros
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {/* === TOGGLE DE VISTA === */}
                        <div className="view-toggle">
                            <button 
                                className={`toggle-btn ${viewMode === 'dashboard' ? 'active' : ''}`}
                                onClick={() => setViewMode('dashboard')}
                            >
                                📊 Dashboard ejecutivo
                            </button>
                            <button 
                                className={`toggle-btn ${viewMode === 'analysis' ? 'active' : ''}`}
                                onClick={() => setViewMode('analysis')}
                            >
                                📋 Análisis detallado
                            </button>
                            <button 
                                className={`toggle-btn ${viewMode === 'reports' ? 'active' : ''}`}
                                onClick={() => setViewMode('reports')}
                            >
                                📄 Informes
                            </button>
                            <button 
                                className="toggle-btn"
                                onClick={() => window.open('https://embai33.github.io/Normalizador_medicamentos/', '_blank')}
                                style={{background: 'linear-gradient(135deg, #28a745 0%, #20c997 100%)'}}
                            >
                                💊 Normalizar medicamentos
                            </button>
                        </div>

                        {/* === VISTA DASHBOARD === */}
                        {viewMode === 'dashboard' && (
                            <>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                                    <div className="alert alert-info" style={{margin: 0, flex: 1}}>
                                        ℹ️ <strong>Dashboard ejecutivo:</strong> Vista general con indicadores clave y gráficos interactivos.
                                    </div>
                                    <button 
                                        onClick={() => generateReport(4)} 
                                        disabled={!data || loading}
                                        style={{
                                            marginLeft: '20px',
                                            padding: '12px 24px',
                                            background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '8px',
                                            fontSize: '14px',
                                            fontWeight: 'bold',
                                            cursor: 'pointer',
                                            boxShadow: '0 4px 15px rgba(102, 126, 234, 0.3)',
                                            transition: 'all 0.3s ease'
                                        }}
                                        onMouseOver={(e) => e.target.style.transform = 'translateY(-2px)'}
                                        onMouseOut={(e) => e.target.style.transform = 'translateY(0)'}
                                    >
                                        📄 Generar PDF
                                    </button>
                                </div>
                                
                                <div className="dashboard-kpis">
                                    {(() => {
                                        const totals = calculateGlobalTotals(applyFilters() || data);
                                        return (
                                            <>
                                                <div className="kpi-card primary">
                                                    <div className="kpi-label">Total Pacientes</div>
                                                    <div className="kpi-value">{totals.pacientes.toLocaleString('es-ES')}</div>
                                                    <div className="kpi-subtitle">Pacientes únicos</div>
                                                </div>
                                                <div className="kpi-card success">
                                                    <div className="kpi-label">Total Visitas</div>
                                                    <div className="kpi-value">{totals.visitas.toLocaleString('es-ES')}</div>
                                                    <div className="kpi-subtitle">Visitas registradas</div>
                                                </div>
                                                <div className="kpi-card warning">
                                                    <div className="kpi-label">Dispensaciones</div>
                                                    <div className="kpi-value">{totals.dispensaciones.toLocaleString('es-ES')}</div>
                                                    <div className="kpi-subtitle">Líneas dispensadas</div>
                                                </div>
                                                <div className="kpi-card info">
                                                    <div className="kpi-label">Coste Total</div>
                                                    <div className="kpi-value">€{(totals.coste / 1000).toFixed(0)}K</div>
                                                    <div className="kpi-subtitle">€{totals.coste.toLocaleString('es-ES', {minimumFractionDigits: 2})}</div>
                                                </div>
                                            </>
                                        );
                                    })()}
                                </div>
                                
                                <div className="dashboard-charts">
                                    <div className="chart-card full-width">
                                        <div className="chart-title">📈 Evolución temporal</div>
                                        <canvas id="evolutionChart"></canvas>
                                    </div>
                                    
                                    <div className="chart-card">
                                        <div className="chart-title">💊 Top principios activos</div>
                                        <canvas id="topPAChart"></canvas>
                                    </div>
                                    
                                    <div className="chart-card">
                                        <div className="chart-title">🏥 Distribución por servicio</div>
                                        <canvas id="serviceChart"></canvas>
                                    </div>
                                </div>
                                
                                <div className="dashboard-ranking">
                                    <div className="chart-title">🏆 Top 5 principios activos por pacientes</div>
                                    {calculateTopPrincipiosActivos(applyFilters() || data, 5).map((item, index) => (
                                        <div key={index} className="ranking-item">
                                            <div className="ranking-rank">{index + 1}</div>
                                            <div className="ranking-name">{item.name}</div>
                                            <div className="ranking-value">{item.pacientes} pacientes</div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="dashboard-charts">
                                    <div className="chart-card full-width">
                                        <div className="chart-title">🔄 Penetración de biosimilares (% pacientes)</div>
                                        <canvas id="biosimilarChart"></canvas>
                                    </div>
                                </div>
                            </>
                        )}

                        {/* === VISTA ANÁLISIS === */}
                        {viewMode === 'analysis' && (
                            <>
                        <h2 style={{marginBottom: '20px', color: '#667eea'}}>📊 Menú principal de indicadores</h2>
                        
                        <div className="menu-grid">
                            <button className="menu-button" onClick={() => processOption(1)} disabled={!data}>
                                <span className="number">1</span>
                                Totales globales
                            </button>
                            <button className="menu-button" onClick={() => processOption(2)} disabled={!data}>
                                <span className="number">2</span>
                                Indicadores por años
                            </button>
                            <button className="menu-button" onClick={() => processOption(3)} disabled={!data}>
                                <span className="number">3</span>
                                Indicadores por trimestres
                            </button>
                            <button className="menu-button" onClick={() => processOption(4)} disabled={!data}>
                                <span className="number">4</span>
                                Indicadores por meses
                            </button>
                            <button className="menu-button" onClick={() => processOption(5)} disabled={!data}>
                                <span className="number">5</span>
                                Pacientes por principio activo (años)
                            </button>
                            <button className="menu-button" onClick={() => processOption(6)} disabled={!data}>
                                <span className="number">6</span>
                                Pacientes por principio activo (trimestres)
                            </button>
                            <button className="menu-button" onClick={() => processOption(7)} disabled={!data}>
                                <span className="number">7</span>
                                Pacientes por principio activo (meses)
                            </button>
                            <button className="menu-button" onClick={() => processOption(8)} disabled={!data}>
                                <span className="number">8</span>
                                Biosimilares por años
                            </button>
                            <button className="menu-button" onClick={() => processOption(9)} disabled={!data}>
                                <span className="number">9</span>
                                Biosimilares por trimestres
                            </button>
                            <button className="menu-button" onClick={() => processOption(10)} disabled={!data}>
                                <span className="number">10</span>
                                Biosimilares por meses
                            </button>
                            <button className="menu-button" onClick={() => processOption(11)} disabled={!data}>
                                <span className="number">11</span>
                                Unidades y coste por medicamento (años)
                            </button>
                            <button className="menu-button" onClick={() => processOption(12)} disabled={!data}>
                                <span className="number">12</span>
                                Unidades y coste por medicamento (trimestres)
                            </button>
                            <button className="menu-button" onClick={() => processOption(13)} disabled={!data}>
                                <span className="number">13</span>
                                Unidades y coste por medicamento (meses)
                            </button>
                            <button className="menu-button" onClick={() => processOption(14)} disabled={!data}>
                                <span className="number">14</span>
                                Coste/Paciente por años
                            </button>
                            <button className="menu-button" onClick={() => processOption(15)} disabled={!data}>
                                <span className="number">15</span>
                                Coste/Paciente por trimestres
                            </button>
                            <button className="menu-button" onClick={() => processOption(16)} disabled={!data}>
                                <span className="number">16</span>
                                Coste/Paciente por meses
                            </button>
                            <button className="menu-button" onClick={() => processOption(17)} disabled={!data}>
                                <span className="number">17</span>
                                Tratamientos combinados
                            </button>
                            <button className="menu-button" onClick={() => processOption(18)} disabled={!data}>
                                <span className="number">18</span>
                                Nuevos vs recurrentes (años)
                            </button>
                            <button className="menu-button" onClick={() => processOption(19)} disabled={!data}>
                                <span className="number">19</span>
                                Comparativa interanual
                            </button>
                            <button className="menu-button" onClick={() => processOption(20)} disabled={!data}>
                                <span className="number">20</span>
                                Mapa de calor (actividad)
                            </button>
                        </div>

                        {loading && (
                            <div className="loading">
                                <div className="spinner"></div>
                                <p>Procesando datos...</p>
                            </div>
                        )}

                        {results && !loading && (
                            <div className="results-section">
                                <div className="results-header">
                                    <h2>{results.title}</h2>
                                    <div className="export-buttons">
                                        <button className="export-btn" onClick={exportToExcel}>
                                            📊 Exportar Excel
                                        </button>
                                        <button className="export-btn" onClick={exportToCSV}>
                                            📄 Exportar CSV
                                        </button>
                                    </div>
                                </div>
                                
                                {/* Gráfico del análisis */}
                                <div className="analysis-chart-container">
                                    <canvas id="analysisChart"></canvas>
                                </div>
                                
                                <div className="table-container">
                                    <table>
                                        <thead>
                                            <tr>
                                                {Object.keys(results.data[0] || {}).map(key => (
                                                    <th
                                                        key={key}
                                                        onClick={() => {
                                                            setSortConfig(prev => ({
                                                                key: key,
                                                                direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
                                                            }));
                                                        }}
                                                        style={{ cursor: 'pointer', userSelect: 'none' }}
                                                    >
                                                        {key}
                                                        {sortConfig.key === key && (
                                                            <span style={{ marginLeft: '5px' }}>
                                                                {sortConfig.direction === 'asc' ? '▲' : '▼'}
                                                            </span>
                                                        )}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {(() => {
                                                const sortedData = [...results.data].sort((a, b) => {
                                                    if (!sortConfig.key) return 0;
                                                    let aVal = a[sortConfig.key];
                                                    let bVal = b[sortConfig.key];

                                                    // Convertir a número si es posible
                                                    const aNum = typeof aVal === 'string' ? parseFloat(aVal.replace(/\./g, '').replace(',', '.')) : aVal;
                                                    const bNum = typeof bVal === 'string' ? parseFloat(bVal.replace(/\./g, '').replace(',', '.')) : bVal;

                                                    if (!isNaN(aNum) && !isNaN(bNum)) {
                                                        return sortConfig.direction === 'asc' ? aNum - bNum : bNum - aNum;
                                                    }

                                                    // Ordenar como texto
                                                    const aStr = String(aVal || '').toLowerCase();
                                                    const bStr = String(bVal || '').toLowerCase();
                                                    if (aStr < bStr) return sortConfig.direction === 'asc' ? -1 : 1;
                                                    if (aStr > bStr) return sortConfig.direction === 'asc' ? 1 : -1;
                                                    return 0;
                                                });

                                                return sortedData.map((row, idx) => (
                                                    <tr key={idx}>
                                                        {Object.entries(row).map(([key, value], i) => {
                                                            const isFirstColumn = i === 0;
                                                            const isPatientIdColumn = key === 'Id de los pacientes';
                                                            const isTrendColumn = key === 'Tendencia';
                                                            const isVarColumn = key === 'Var%';
                                                            const isHeatmap = results.type === 'heatmap';
                                                            const isNumber = typeof value === 'number' ||
                                                                            (!isNaN(parseFloat(value)) && isFinite(value) && key !== 'Periodo' && !isPatientIdColumn && !isTrendColumn);

                                                            // Color para tendencia
                                                            let trendColor = 'inherit';
                                                            if (isTrendColumn) {
                                                                if (value === '↑') trendColor = '#27ae60';
                                                                else if (value === '↓') trendColor = '#e74c3c';
                                                                else if (value === '→') trendColor = '#7f8c8d';
                                                            }

                                                            // Color para variación
                                                            let varColor = 'inherit';
                                                            if (isVarColumn && value !== '-') {
                                                                const varNum = parseFloat(value);
                                                                if (varNum > 2) varColor = '#27ae60';
                                                                else if (varNum < -2) varColor = '#e74c3c';
                                                                else varColor = '#7f8c8d';
                                                            }

                                                            // Color para heatmap
                                                            let heatmapStyle = {};
                                                            if (isHeatmap && !isFirstColumn && typeof value === 'number' && results.maxValue > 0) {
                                                                const intensity = value / results.maxValue;
                                                                const r = Math.round(255 - (intensity * 155));
                                                                const g = Math.round(255 - (intensity * 55));
                                                                const b = Math.round(255 - (intensity * 155));
                                                                heatmapStyle = {
                                                                    backgroundColor: `rgb(${r}, ${g}, ${b})`,
                                                                    color: intensity > 0.5 ? 'white' : 'inherit',
                                                                    fontWeight: 'bold'
                                                                };
                                                            }

                                                            return (
                                                                <td
                                                                    key={i}
                                                                    style={{
                                                                        textAlign: isTrendColumn ? 'center' : (isFirstColumn ? 'left' : 'right'),
                                                                        fontWeight: isNumber || isTrendColumn ? '600' : 'normal',
                                                                        color: isTrendColumn ? trendColor : (isVarColumn ? varColor : 'inherit'),
                                                                        fontSize: isTrendColumn ? '18px' : 'inherit',
                                                                        ...heatmapStyle
                                                                    }}
                                                                >
                                                                    {isNumber && !isFirstColumn
                                                                        ? parseFloat(value).toLocaleString('es-ES', {
                                                                            minimumFractionDigits: key.includes('Coste') ? 2 : 0,
                                                                            maximumFractionDigits: key.includes('Coste') ? 2 : 0
                                                                        })
                                                                        : value}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ));
                                            })()}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                            </>
                        )}

                        {/* === VISTA INFORMES === */}
                        {viewMode === 'reports' && (
                            <>
                                <div className="alert alert-info" style={{marginBottom: '20px'}}>
                                    ℹ️ <strong>Informes predefinidos:</strong> Genera informes completos en formato PDF para presentar y compartir.
                                </div>

                                <h2 style={{marginBottom: '20px', color: '#667eea'}}>📄 Informes predefinidos</h2>
                                
                                <div className="menu-grid">
                                    <button className="menu-button" onClick={() => generateReport(1)} disabled={!data}>
                                        <span className="number">1</span>
                                        Evolución anual
                                    </button>
                                    <button className="menu-button" onClick={() => generateReport(2)} disabled={!data}>
                                        <span className="number">2</span>
                                        Evolución trimestral
                                    </button>
                                    <button className="menu-button" onClick={() => generateReport(3)} disabled={!data}>
                                        <span className="number">3</span>
                                        Evolución mensual
                                    </button>
                                    <button className="menu-button" onClick={() => generateReport(5)} disabled={!data}>
                                        <span className="number">4</span>
                                        Seguimiento trimestral
                                    </button>
                                    <button className="menu-button" onClick={() => generateReport(6)} disabled={!data}>
                                        <span className="number">5</span>
                                        Seguimiento anual
                                    </button>
                                    <button className="menu-button" onClick={() => generateReport(7)} disabled={!data}>
                                        <span className="number">6</span>
                                        Seguimiento mensual
                                    </button>
                                </div>

                                {reportLoading && (
                                    <div className="loading" style={{marginTop: '30px'}}>
                                        <div className="spinner"></div>
                                        <p>Generando informe PDF...</p>
                                    </div>
                                )}

                                {reportGenerated && (
                                    <div className="alert alert-success" style={{marginTop: '20px'}}>
                                        ✅ <strong>Informe generado exitosamente</strong>
                                        <p style={{marginTop: '10px', fontSize: '0.9em'}}>
                                            El informe se ha descargado automáticamente. Si no se descargó, verifica la carpeta de descargas de tu navegador.
                                        </p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
