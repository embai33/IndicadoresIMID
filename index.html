<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de dispensaciones farmacéuticas en IMID - V12</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #585c70;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #2b2f49;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .upload-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 5px;
            text-align: center;
            margin-bottom: 10px;
            border: 3px dashed #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .upload-section.dragover {
            background: #667eea;
            color: white;
        }

        .upload-icon {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .file-loaded {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border-color: #28a745;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-button {
            background: linear-gradient(135deg, #3d4268 0%, #3d4268 100%);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 15px;
            font-size: 1em;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            text-align: left;
        }

        .menu-button:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .menu-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .menu-button .number {
            display: block;
            font-size: 2em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .results-section {
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            background: #2b2f49;
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h2 {
            font-size: 1.5em;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .export-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        th:first-child,
        td:first-child {
            text-align: left;
            min-width: 200px;
        }

        th:not(:first-child),
        td:not(:first-child) {
            text-align: right;
        }

        td.number-cell {
            text-align: right;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .chart-container {
            margin: 30px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        canvas {
            max-height: 400px;
        }

        .number-cell {
            text-align: right;
            font-weight: 600;
        }

        .total-row {
            background: #f8f9fa;
            font-weight: 700;
            border-top: 2px solid #667eea;
        }

        input[type="file"] {
            display: none;
        }

        .filters-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .filters-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }
    
        /* Dashboard Styles - AÑADIDO */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f0f2f5;
            border-radius: 12px;
        }
        
        .toggle-btn {
            padding: 12px 35px;
            font-size: 1.05em;
            font-weight: 600;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #495057;
        }
        
        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #667eea 100%);
            color: white;
            border-color: #667eea;
        }
        
        .toggle-btn:hover:not(.active) {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .dashboard-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .kpi-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
        }
        
        .kpi-card.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .kpi-card.success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
        }
        
        .kpi-card.warning {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #856404;
        }
        
        .kpi-card.info {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #004085;
        }
        
        .kpi-label {
            font-size: 0.85em;
            margin-bottom: 8px;
            opacity: 0.85;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .kpi-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .kpi-subtitle {
            font-size: 0.8em;
            opacity: 0.75;
        }
        
        .dashboard-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }
        
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 18px;
            color: #667eea;
        }
        
        .dashboard-ranking {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .ranking-item:last-child {
            border-bottom: none;
        }
        
        .ranking-item:hover {
            background: #f8f9fa;
        }
        
        .ranking-rank {
            font-size: 1.4em;
            font-weight: 700;
            color: #667eea;
            width: 35px;
        }
        
        .ranking-name {
            flex: 1;
            font-weight: 600;
            margin: 0 15px;
        }
        
        .ranking-value {
            font-size: 1.1em;
            font-weight: 700;
            color: #495057;
        }
        
        @media (max-width: 768px) {
            .dashboard-charts {
                grid-template-columns: 1fr;
            }
            .dashboard-kpis {
                grid-template-columns: 1fr;
            }
            .view-toggle {
                flex-direction: column;
            }
        }

    
        .analysis-chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .analysis-chart-container canvas {
            max-height: 450px;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BIOSIMILARES = [
            'HYRIMOZ', 'IMRALDI', 'IDACIO', 'YUFLIMA',
            'BENEPALI', 'ERELZI', 'REMSIMA', 'TYENNE',
            'AVTOZMA', 'UZPRUVO', 'STEQEYMA', 'PYZCHYVA', 'OMLYCLO'
        ];

        const AGRUPACIONES_PRODUCTOS = [
            'Hyrimoz 40', 'Idacio 50', 'Enbrel 50',
            'Enbrel 25', 'Benepali', 'Roactemra 162'
        ];

        function App() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [selectedOption, setSelectedOption] = useState(null);
            const [fileName, setFileName] = useState('');
            const [viewMode, setViewMode] = useState('analysis'); // 'dashboard', 'analysis' o 'reports'
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            const [dragOver, setDragOver] = useState(false);
            const [reportLoading, setReportLoading] = useState(false);
            const [reportGenerated, setReportGenerated] = useState(false);
            const [filters, setFilters] = useState({
                year: '',
                service: '',
                pathology: '',
                activeIngredient: '',
                dateFrom: '',
                dateTo: ''
            });
            const [filteredData, setFilteredData] = useState(null);
            const [filterOptions, setFilterOptions] = useState({
                years: [],
                services: [],
                pathologies: [],
                activeIngredients: []
            });
            const fileInputRef = useRef(null);
            const chartRef = useRef(null);

            // useEffect para crear gráficos del dashboard
            useEffect(() => {
                if (viewMode === 'dashboard' && data) {
                    const dataToProcess = applyFilters() || data;
                    
                    // Destruir gráficos anteriores
                    if (window.dashboardCharts) {
                        Object.values(window.dashboardCharts).forEach(chart => {
                            if (chart) chart.destroy();
                        });
                    }
                    window.dashboardCharts = {};
                    
                    // Gráfico de evolución temporal
                    const evolutionData = calculateEvolutionByYear(dataToProcess);
                    const evolutionCtx = document.getElementById('evolutionChart');
                    if (evolutionCtx) {
                        window.dashboardCharts.evolution = new Chart(evolutionCtx, {
                            type: 'line',
                            data: {
                                labels: evolutionData.years,
                                datasets: [
                                    {
                                        label: 'Pacientes',
                                        data: evolutionData.pacientes,
                                        borderColor: '#667eea',
                                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                        tension: 0.4,
                                        fill: true,
                                        borderWidth: 3
                                    },
                                    {
                                        label: 'Visitas',
                                        data: evolutionData.visitas,
                                        borderColor: '#84fab0',
                                        backgroundColor: 'rgba(132, 250, 176, 0.1)',
                                        tension: 0.4,
                                        fill: true,
                                        borderWidth: 3
                                    },
                                    {
                                        label: 'Dispensaciones',
                                        data: evolutionData.dispensaciones,
                                        borderColor: '#fcb69f',
                                        backgroundColor: 'rgba(252, 182, 159, 0.1)',
                                        tension: 0.4,
                                        fill: true,
                                        borderWidth: 3
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'top' } },
                                scales: { y: { beginAtZero: true } }
                            }
                        });
                    }
                    
                    // Gráfico top principios activos
                    const topPA = calculateTopPrincipiosActivos(dataToProcess);
                    const topPACtx = document.getElementById('topPAChart');
                    if (topPACtx) {
                        window.dashboardCharts.topPA = new Chart(topPACtx, {
                            type: 'bar',
                            data: {
                                labels: topPA.map(item => item.name),
                                datasets: [{
                                    label: 'Pacientes',
                                    data: topPA.map(item => item.pacientes),
                                    backgroundColor: 'rgba(102, 126, 234, 0.8)',
                                    borderColor: '#667eea',
                                    borderWidth: 2
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                indexAxis: 'y',
                                plugins: { legend: { display: false } },
                                scales: { x: { beginAtZero: true } }
                            }
                        });
                    }
                    
                    // Gráfico distribución por servicio
                    const serviceData = calculateServiceDist(dataToProcess);
                    const serviceCtx = document.getElementById('serviceChart');
                    if (serviceCtx) {
                        window.dashboardCharts.service = new Chart(serviceCtx, {
                            type: 'doughnut',
                            data: {
                                labels: serviceData.map(item => item.name),
                                datasets: [{
                                    data: serviceData.map(item => item.count),
                                    backgroundColor: [
                                        'rgba(102, 126, 234, 0.8)',
                                        'rgba(132, 250, 176, 0.8)',
                                        'rgba(252, 182, 159, 0.8)',
                                        'rgba(168, 237, 234, 0.8)',
                                        'rgba(118, 75, 162, 0.8)',
                                        'rgba(143, 211, 244, 0.8)'
                                    ],
                                    borderWidth: 2
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'bottom' } }
                            }
                        });
                    }
                    
                    // Gráfico biosimilares
                    const biosimData = calculateBiosimilarPenetration(dataToProcess);
                    const biosimCtx = document.getElementById('biosimilarChart');
                    if (biosimCtx) {
                        window.dashboardCharts.biosim = new Chart(biosimCtx, {
                            type: 'line',
                            data: {
                                labels: biosimData.years,
                                datasets: [{
                                    label: '% Pacientes con biosimilares',
                                    data: biosimData.percentages,
                                    borderColor: '#84fab0',
                                    backgroundColor: 'rgba(132, 250, 176, 0.3)',
                                    tension: 0.4,
                                    fill: true,
                                    borderWidth: 3
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { display: false } },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        max: 100,
                                        ticks: { callback: value => value + '%' }
                                    }
                                }
                            }
                        });
                    }
                }
                
                return () => {
                    if (window.dashboardCharts) {
                        Object.values(window.dashboardCharts).forEach(chart => {
                            if (chart) chart.destroy();
                        });
                    }
                };
            }, [viewMode, data, filters]);


            const handleFileUpload = (file) => {
                if (!file) return;
                
                setLoading(true);
                setFileName(file.name);
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const workbook = XLSX.read(e.target.result, { type: 'binary' });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);
                        
                        // Procesar fechas
                        jsonData.forEach(row => {
                            if (row['Fecha Dispensación']) {
                                const excelDate = row['Fecha Dispensación'];
                                if (typeof excelDate === 'number') {
                                    // Convertir fecha de Excel a JavaScript
                                    const date = new Date((excelDate - 25569) * 86400 * 1000);
                                    row['Fecha Dispensación'] = date;
                                } else if (typeof excelDate === 'string') {
                                    row['Fecha Dispensación'] = new Date(excelDate);
                                }
                            }
                        });
                        
                        // Extraer opciones únicas para los filtros
                        const years = [...new Set(jsonData.map(row => {
                            if (row['Fecha Dispensación']) {
                                return row['Fecha Dispensación'].getFullYear();
                            }
                            return null;
                        }).filter(Boolean))].sort();

                        const services = [...new Set(jsonData
                            .map(row => row['Servicio Prescriptor'])
                            .filter(Boolean)
                        )].sort();

                        const pathologies = [...new Set(jsonData
                            .map(row => row['Patología'])
                            .filter(Boolean)
                        )].sort();

                        const activeIngredients = [...new Set(jsonData
                            .map(row => row['Descripción Principio Activo'])
                            .filter(Boolean)
                        )].sort();

                        setFilterOptions({
                            years,
                            services,
                            pathologies,
                            activeIngredients
                        });

                        setFilters({ year: '', service: '', pathology: '', activeIngredient: '' });
                        setData(jsonData);
                        setLoading(false);
                    } catch (error) {
                        alert('Error al procesar el archivo: ' + error.message);
                        setLoading(false);
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
                    handleFileUpload(file);
                } else {
                    alert('Por favor, sube un archivo Excel (.xlsx o .xls)');
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = () => {
                setDragOver(false);
            };

            const applyFilters = () => {
                if (!data) return null;
    
                let filtered = [...data];
    
                if (filters.year) {
                    filtered = filtered.filter(row => 
                        row['Fecha Dispensación'] && 
                        row['Fecha Dispensación'].getFullYear() === parseInt(filters.year)
                    );
                }
    
                if (filters.service) {
                    filtered = filtered.filter(row => 
                        row['Servicio Prescriptor'] === filters.service
                    );
                }
    
                if (filters.pathology) {
                    filtered = filtered.filter(row => 
                        row['Patología'] === filters.pathology
                    );
                }
    
                if (filters.activeIngredient) {
                    filtered = filtered.filter(row => 
                        row['Descripción Principio Activo'] === filters.activeIngredient
                    );
                }
    
                if (filters.dateFrom) {
                    const fromDate = new Date(filters.dateFrom);
                    fromDate.setHours(0, 0, 0, 0);
                    filtered = filtered.filter(row => 
                        row['Fecha Dispensación'] && 
                        row['Fecha Dispensación'] >= fromDate
                    );
                }
    
                if (filters.dateTo) {
                    const toDate = new Date(filters.dateTo);
                    toDate.setHours(23, 59, 59, 999);
                    filtered = filtered.filter(row => 
                        row['Fecha Dispensación'] && 
                        row['Fecha Dispensación'] <= toDate
                    );
                }
    
                return filtered;
            };

            const calculateGlobalTotals = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>

                );

                const pacientes = new Set(validData.map(row => row['Id'])).size;
                const visitas = new Set(validData.map(row => 
                    `${row['Id']}_${row['Fecha Dispensación'].toISOString().split('T')[0]}`
                )).size;
                const dispensaciones = validData.length;
                const coste = validData.reduce((sum, row) => 
                    sum + (parseFloat(row['Coste Dispensación']) || 0), 0
                );

                return { pacientes, visitas, dispensaciones, coste };
            };
            
            const calculateEvolutionByYear = (dataToProcess) => {
                const validData = dataToProcess.filter(row => 
                    row['Fecha Dispensación'] && row['Id'] && !isNaN(row['Id'])
                );

                const yearData = {};
                validData.forEach(row => {
                    const year = row['Fecha Dispensación'].getFullYear();
                    if (!yearData[year]) {
                        yearData[year] = { ids: new Set(), visitas: new Set(), dispensaciones: 0 };
                    }
                    yearData[year].ids.add(row['Id']);
                    yearData[year].visitas.add(
                        `${row['Id']}_${row['Fecha Dispensación'].toISOString().split('T')[0]}`
                    );
                    yearData[year].dispensaciones++;
                });

                const years = Object.keys(yearData).sort();
                return {
                    years,
                    pacientes: years.map(y => yearData[y].ids.size),
                    visitas: years.map(y => yearData[y].visitas.size),
                    dispensaciones: years.map(y => yearData[y].dispensaciones)
                };
            };
            
            const calculateTopPrincipiosActivos = (dataToProcess, limit = 8) => {
                const validData = dataToProcess.filter(row => 
                    row['Descripción Principio Activo'] && row['Id']
                );

                const paData = {};
                validData.forEach(row => {
                    const pa = row['Descripción Principio Activo'];
                    if (!paData[pa]) {
                        paData[pa] = { ids: new Set(), coste: 0 };
                    }
                    paData[pa].ids.add(row['Id']);
                    paData[pa].coste += parseFloat(row['Coste Dispensación']) || 0;
                });

                return Object.keys(paData)
                    .map(pa => ({ name: pa, pacientes: paData[pa].ids.size, coste: paData[pa].coste }))
                    .sort((a, b) => b.pacientes - a.pacientes)
                    .slice(0, limit);
            };

            const calculateBiosimilarPenetration = (dataToProcess) => {
                // Mapeo de biosimilares a sus principios activos
                const BIOSIMILAR_TO_PA = {
                    'HYRIMOZ': 'ADALIMUMAB',
                    'IMRALDI': 'ADALIMUMAB',
                    'IDACIO': 'ADALIMUMAB',
                    'YUFLIMA': 'ADALIMUMAB',
                    'BENEPALI': 'ETANERCEPT',

                    'REMSIMA': 'INFLIXIMAB',

                    'STEQEYMA': 'USTEKINUMAB',
                    'PYZCHYVA': 'USTEKINUMAB',
                    'OMLYCLO': 'OMALIZUMAB'
                };

                // PA que tienen biosimilar disponible
                const PA_WITH_BIOSIMILAR = ['ADALIMUMAB', 'ETANERCEPT', 'INFLIXIMAB', 'TOCILIZUMAB', 'USTEKINUMAB', 'OMALIZUMAB'];

                const validData = dataToProcess.filter(row => 
                    row['Fecha Dispensación'] && 
                    row['Descripción Producto Dispensado'] && 
                    row['Id'] &&
                    row['Descripción Principio Activo']
                );

                const yearData = {};
                validData.forEach(row => {
                    const year = row['Fecha Dispensación'].getFullYear();
                    const producto = row['Descripción Producto Dispensado'].toUpperCase();
                    const pa = row['Descripción Principio Activo'].toUpperCase();
                    const pacienteId = row['Id'];
                    
                    // Verificar si el PA tiene biosimilar disponible
                    const paHasBiosimilar = PA_WITH_BIOSIMILAR.some(p => pa.includes(p));
                    
                    if (!paHasBiosimilar) return; // Solo considerar PA con biosimilar disponible
                    
                    if (!yearData[year]) {
                        yearData[year] = { 
                            pacientesTotal: new Set(), 
                            pacientesBiosimilar: new Set() 
                        };
                    }
                    
                    // Añadir al total de pacientes con PA que tiene biosimilar
                    yearData[year].pacientesTotal.add(pacienteId);
                    
                    // Verificar si el producto es biosimilar
                    const isBio = BIOSIMILARES.some(bio => producto.includes(bio));
                    if (isBio) {
                        yearData[year].pacientesBiosimilar.add(pacienteId);
                    }
                });

                const years = Object.keys(yearData).sort();
                return {
                    years,
                    percentages: years.map(y => {
                        const total = yearData[y].pacientesTotal.size;
                        const biosim = yearData[y].pacientesBiosimilar.size;
                        return total > 0 ? (biosim / total * 100).toFixed(1) : '0.0';
                    })
                };

            // Función para generar resumen ejecutivo
            const generateExecutiveSummary = (dataToProcess) => {
                const totals = calculateGlobalTotals(dataToProcess);
                const yearData = calculateByYears(dataToProcess);
                const paData = calculatePatientsByActiveIngredientByYear(dataToProcess);
                const bioData = calculateBiosimilarPenetration(dataToProcess);

                const insights = [];

                // Métricas principales
                insights.push(`Total de ${totals.pacientes.toLocaleString('es-ES')} pacientes atendidos con ${totals.dispensaciones.toLocaleString('es-ES')} dispensaciones.`);
                insights.push(`Coste total acumulado: €${totals.coste.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 0})}.`);

                // Tendencia de pacientes
                if (yearData.data && yearData.data.length >= 2) {
                    const lastYear = yearData.data[yearData.data.length - 1];
                    const prevYear = yearData.data[yearData.data.length - 2];
                    const change = ((lastYear.Pacientes - prevYear.Pacientes) / prevYear.Pacientes * 100).toFixed(1);
                    if (parseFloat(change) > 0) {
                        insights.push(`Incremento del ${change}% en pacientes respecto al período anterior.`);
                    } else if (parseFloat(change) < 0) {
                        insights.push(`Reducción del ${Math.abs(change)}% en pacientes respecto al período anterior.`);
                    }
                }

                // Top principio activo
                if (paData.data && paData.data.length > 0) {
                    const topPA = paData.data[0];
                    insights.push(`Principio activo más prescrito: ${topPA['Principio Activo']} (${topPA.TOTAL} pacientes).`);
                }

                // Penetración de biosimilares
                if (bioData.percentages && bioData.percentages.length > 0) {
                    const lastBioPercentage = bioData.percentages[bioData.percentages.length - 1];
                    insights.push(`Penetración actual de biosimilares: ${lastBioPercentage}%.`);
                }

                return insights;
            };

            const calculateTotals = (dataToProcess) => {
                const validData = dataToProcess.filter(row => 
                    row['Fecha Dispensación'] && row['Id'] && !isNaN(row['Id'])
                );

                const pacientes = new Set(validData.map(row => row['Id'])).size;
                
                const visitas = new Set(validData.map(row => 
                    `${row['Id']}_${row['Fecha Dispensación'].toISOString().split('T')[0]}`
                )).size;

                const dispensaciones = validData.length;
                
                const coste = validData.reduce((sum, row) => 
                    sum + (parseFloat(row['Coste Dispensación']) || 0), 0
                );

                return {
                    type: 'totals',
                    title: 'Totales Globales',
                    data: [{
                        Periodo: 'TOTAL',
                        Pacientes: pacientes,
                        Visitas: visitas,
                        Dispensaciones: dispensaciones,
                        Coste: coste.toFixed(2)
                    }]
                };
            };

            // Función auxiliar para calcular variación y tendencia
            const calculateVariation = (current, previous) => {
                if (previous === 0 || previous === null || previous === undefined) return null;
                return ((current - previous) / previous * 100).toFixed(1);
            };

            const getTrendIcon = (variation) => {
                if (variation === null) return '';
                const v = parseFloat(variation);
                if (v > 2) return '↑';
                if (v < -2) return '↓';
                return '→';
            };

            const calculateByYears = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>

                validData.forEach(row => {

                    if (!yearData[year]) {
                        yearData[year] = {
                            ids: new Set(),
                            visitas: new Set(),
                            dispensaciones: 0,
                            coste: 0
                        };
                    }

                    yearData[year].ids.add(row['Id']);
                    yearData[year].visitas.add(
                        `${row['Id']}_${row['Fecha Dispensación'].toISOString().split('T')[0]}`
                    );
                    yearData[year].dispensaciones++;
                    yearData[year].coste += parseFloat(row['Coste Dispensación']) || 0;
                });

                const sortedYears = Object.keys(yearData).sort();
                const results = sortedYears.map((year, idx) => {
                    const pacientes = yearData[year].ids.size;
                    const prevPacientes = idx > 0 ? yearData[sortedYears[idx-1]].ids.size : null;
                    const varPacientes = calculateVariation(pacientes, prevPacientes);
                    const trend = getTrendIcon(varPacientes);

            const calculateCombinedTreatments = (dataToProcess) => {
                // Filtrar datos válidos
                const validData = dataToProcess.filter(row => 
                    row['Fecha Dispensación'] && 
                    row['Id'] && 
                    !isNaN(row['Id']) &&
                    row['Descripción Principio Activo'] &&
                    row['Cantidad'] && 
                    parseFloat(row['Cantidad']) > 0
                );

                // Agrupar dispensaciones por paciente y fecha
                const dispensationsByPatientDate = {};
                
                validData.forEach(row => {
                    const patientId = row['Id'];
                    const dateStr = row['Fecha Dispensación'].toISOString().split('T')[0];
                    const key = `${patientId}_${dateStr}`;
                    const principioActivo = row['Descripción Principio Activo'];
                    
                    if (!dispensationsByPatientDate[key]) {
                        dispensationsByPatientDate[key] = {
                            patientId: patientId,
                            date: dateStr,
                            principiosActivos: new Set(),
                            rows: []
                        };
                    }
                    
                    dispensationsByPatientDate[key].principiosActivos.add(principioActivo);
                    dispensationsByPatientDate[key].rows.push(row);
                });

                // Identificar combinaciones (pacientes con más de 1 principio activo en la misma fecha)
                const combinationsMap = {};
                
                Object.values(dispensationsByPatientDate).forEach(group => {
                    if (group.principiosActivos.size > 1) {
                        // Crear clave de combinación ordenada alfabéticamente
                        const paArray = Array.from(group.principiosActivos).sort();
                        const combinationKey = paArray.join(' + ');
                        
                        if (!combinationsMap[combinationKey]) {
                            combinationsMap[combinationKey] = new Set();
                        }
                        
                        combinationsMap[combinationKey].add(group.patientId);
                    }
                });

                // Crear resultados
                const results = Object.entries(combinationsMap)
                    .map(([combination, patientIds]) => ({
                        'Combinación': combination,
                        'Número de pacientes': patientIds.size,
                        'Id de los pacientes': Array.from(patientIds).sort((a, b) => a - b).join(', ')
                    }))
                    .sort((a, b) => b['Número de pacientes'] - a['Número de pacientes']);

                return {
                    type: 'combined_treatments',
                    title: 'Tratamientos Combinados',
                    data: results,
                    chartType: 'bar'
                };
            };

            const calculateNewVsRecurringPatients = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] && !isNaN(row['Id'])
                );

                // Encontrar el primer año de cada paciente
                const patientFirstYear = {};
                validData.forEach(row => {
                    const patientId = row['Id'];
                    const year = row['Fecha Dispensación'].getFullYear();
                    if (!patientFirstYear[patientId] || year < patientFirstYear[patientId]) {
                        patientFirstYear[patientId] = year;
                    }
                });

                // Agrupar pacientes por año
                const yearData = {};
                validData.forEach(row => {
                    const year = row['Fecha Dispensación'].getFullYear();
                    const patientId = row['Id'];
                    if (!yearData[year]) {
                        yearData[year] = { nuevos: new Set(), recurrentes: new Set() };
                    }
                    if (patientFirstYear[patientId] === year) {
                        yearData[year].nuevos.add(patientId);
                    } else {
                        yearData[year].recurrentes.add(patientId);
                    }
                });

                const sortedYears = Object.keys(yearData).sort();
                const results = sortedYears.map((year, idx) => {
                    const nuevos = yearData[year].nuevos.size;
                    const recurrentes = yearData[year].recurrentes.size;
                    const total = nuevos + recurrentes;
                    const pctNuevos = total > 0 ? ((nuevos / total) * 100).toFixed(1) : '0.0';

                    // Variación de nuevos respecto al año anterior
                    const prevNuevos = idx > 0 ? yearData[sortedYears[idx-1]].nuevos.size : null;
                    const varNuevos = calculateVariation(nuevos, prevNuevos);
                    const trend = getTrendIcon(varNuevos);

                    return {
                        Periodo: year,
                        Nuevos: nuevos,
                        Recurrentes: recurrentes,

                        '% Nuevos': pctNuevos + '%',

                return {

                };
            };

            const calculateYearComparison = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] && !isNaN(row['Id'])
                );

                // Agrupar datos por año
                const yearData = {};
                validData.forEach(row => {
                    const year = row['Fecha Dispensación'].getFullYear();
                    if (!yearData[year]) {
                        yearData[year] = {
                            ids: new Set(),
                            visitas: new Set(),
                            dispensaciones: 0,

                        };
                    }
                    yearData[year].ids.add(row['Id']);

                    yearData[year].dispensaciones++;
                    yearData[year].coste += parseFloat(row['Coste Dispensación']) || 0;
                });

                const sortedYears = Object.keys(yearData).sort();

                // Crear comparativa entre años consecutivos
                const results = [];
                for (let i = 1; i < sortedYears.length; i++) {
                    const prevYear = sortedYears[i - 1];
                    const currYear = sortedYears[i];

                    const prev = yearData[prevYear];
                    const curr = yearData[currYear];

                    const pacientesDiff = curr.ids.size - prev.ids.size;
                    const pacientesPct = ((pacientesDiff / prev.ids.size) * 100).toFixed(1);
                    const visitasDiff = curr.visitas.size - prev.visitas.size;
                    const visitasPct = ((visitasDiff / prev.visitas.size) * 100).toFixed(1);
                    const costeDiff = curr.coste - prev.coste;
                    const costePct = ((costeDiff / prev.coste) * 100).toFixed(1);

                    results.push({
                        'Comparación': `${prevYear} → ${currYear}`,
                        [`Pac. ${prevYear}`]: prev.ids.size,
                        [`Pac. ${currYear}`]: curr.ids.size,
                        'Dif. Pac.': (pacientesDiff >= 0 ? '+' : '') + pacientesDiff,
                        '% Var. Pac.': (parseFloat(pacientesPct) >= 0 ? '+' : '') + pacientesPct + '%',
                        'Tendencia': parseFloat(pacientesPct) > 2 ? '↑' : (parseFloat(pacientesPct) < -2 ? '↓' : '→'),
                        [`Coste ${prevYear}`]: '€' + prev.coste.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 0}),
                        [`Coste ${currYear}`]: '€' + curr.coste.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 0}),
                        '% Var. Coste': (parseFloat(costePct) >= 0 ? '+' : '') + costePct + '%'
                    });
                }

                return {
                    type: 'year_comparison',
                    title: 'Comparativa Interanual',
                    data: results,
                    chartType: 'grouped_bar'
                };
            };

            const calculateActivityHeatmap = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] && !isNaN(row['Id'])
                );

                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                                    'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

                // Recopilar datos por mes y año
                const heatmapData = {};
                const yearsSet = new Set();

                validData.forEach(row => {
                    const date = row['Fecha Dispensación'];
                    const year = date.getFullYear();
                    const month = date.getMonth();
                    yearsSet.add(year);

                    const key = `${month}_${year}`;
                    if (!heatmapData[key]) {
                        heatmapData[key] = new Set();
                    }
                    heatmapData[key].add(row['Id']);
                });

                const years = Array.from(yearsSet).sort();

                // Calcular min y max para normalización
                let maxPatients = 0;
                Object.values(heatmapData).forEach(ids => {
                    if (ids.size > maxPatients) maxPatients = ids.size;
                });
