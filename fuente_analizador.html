                                                    </div>
                                                </div>
                                                {(persistService || persistPathology) && (
                                                    <p style={{margin: '8px 0 0', fontSize: '0.82em', color: '#475569', fontStyle: 'italic'}}>
                                                        ℹ️ Los filtros se aplican a TODAS las dispensaciones antes del análisis. Los pacientes con tratamientos previos en otros servicios o patologías se considerarán naive porque su historia previa queda fuera del universo seleccionado.
                                                    </p>
                                                )}
                                            </div>

                                            {/* Selección de medicamentos */}
                                            <div style={{marginBottom: '18px'}}>
                                                <label style={{display: 'block', fontWeight: 600, color: '#1a5276', marginBottom: '8px'}}>
                                                    6. Medicamentos a comparar ({persistSelected.size} seleccionados):
                                                </label>
                                                <input type="text" value={persistSearch}
                                                    onChange={(e) => setPersistSearch(e.target.value)}
                                                    placeholder="Buscar medicamento..."
                                                    style={{width: '100%', maxWidth: '400px', padding: '8px 12px', border: '1px solid #cbd5e1', borderRadius: '8px', marginBottom: '10px'}} />
                                                <div style={{maxHeight: '220px', overflowY: 'auto', border: '1px solid #e2e8f0', borderRadius: '8px', padding: '10px', background: '#f8fafc'}}>
                                                    {getPersistMedList()
                                                        .filter(m => m.toLowerCase().includes(persistSearch.toLowerCase()))
                                                        .map(m => (
                                                            <label key={m} style={{display: 'flex', alignItems: 'center', gap: '8px', padding: '4px 6px', cursor: 'pointer', fontSize: '0.9em'}}>
                                                                <input type="checkbox"
                                                                    checked={persistSelected.has(m)}
                                                                    onChange={() => {
                                                                        const ns = new Set(persistSelected);
                                                                        if (ns.has(m)) ns.delete(m); else ns.add(m);
                                                                        setPersistSelected(ns);
                                                                    }} />
                                                                <span>{m}</span>
                                                            </label>
                                                        ))}
                                                </div>
                                            </div>

                                            <button
                                                onClick={calcularPersistencia}
                                                disabled={persistSelected.size === 0 || !persistStartDate}
                                                style={{
                                                    padding: '12px 28px', borderRadius: '8px', border: 'none', fontWeight: 700, fontSize: '1.05em',
                                                    cursor: (persistSelected.size === 0 || !persistStartDate) ? 'not-allowed' : 'pointer',
                                                    background: (persistSelected.size === 0 || !persistStartDate) ? '#ccc' : '#1B4354',
                                                    color: '#fff'
                                                }}>
                                                Calcular persistencia
                                            </button>
                                        </div>

                                        {persistError && (
                                            <div className="alert" style={{background: '#fdecea', border: '1px solid #e74c3c', borderRadius: '10px', padding: '15px', marginBottom: '20px', color: '#a93226'}}>
                                                ⚠️ {persistError}
                                            </div>
                                        )}

                                        {/* Resultados */}
                                        {persistResults && (
                                            <div>
                                                {/* Barra de acciones */}
                                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', flexWrap: 'wrap', gap: '8px'}}>
                                                    <div style={{fontSize: '0.85em', color: '#475569'}}>
                                                        {(persistResults.service || persistResults.pathology) ? (
                                                            <span style={{background: '#eaf2f8', border: '1px solid #aed6f1', borderRadius: '6px', padding: '4px 10px', display: 'inline-block'}}>
                                                                <strong>Filtros aplicados:</strong>
                                                                {persistResults.service ? ` Servicio = ${persistResults.service}` : ''}
                                                                {persistResults.service && persistResults.pathology ? '   ·   ' : ''}
                                                                {persistResults.pathology ? ` Patología = ${persistResults.pathology}` : ''}
                                                            </span>
                                                        ) : (
                                                            <span style={{fontStyle: 'italic', color: '#94a3b8'}}>Sin filtros · análisis sobre todo el dataset</span>
                                                        )}
                                                    </div>
                                                    <button
                                                        onClick={generatePersistenciaPDF}
                                                        style={{
                                                            padding: '10px 22px', borderRadius: '8px', border: 'none', fontWeight: 700,
                                                            cursor: 'pointer', background: '#1B4354', color: '#fff', fontSize: '0.95em'
                                                        }}>
                                                        📄 Exportar a PDF
                                                    </button>
                                                </div>
                                                {/* Gráfica KM */}
                                                <div style={{background: '#fff', border: '1px solid #e2e8f0', borderRadius: '10px', padding: '20px', marginBottom: '24px'}}>
                                                    <div style={{height: '420px'}}>
                                                        <canvas id="kmChart" role="img" aria-label="Curva de persistencia de Kaplan-Meier con intervalo de confianza del 95%"></canvas>
                                                    </div>
                                                    {/* Números en riesgo (estándar en publicaciones Kaplan-Meier) */}
                                                    <div style={{overflowX: 'auto', marginTop: '16px'}}>
                                                        <div style={{fontSize: '0.82em', fontWeight: 600, color: '#1a5276', marginBottom: '6px'}}>Nº de pacientes en riesgo</div>
                                                        <table style={{borderCollapse: 'collapse', fontSize: '0.78em'}}>
                                                            <thead><tr>
                                                                <th style={{padding: '4px 10px', textAlign: 'left', color: '#64748b'}}></th>
                                                                {persistResults.timePoints.map(tp => (
                                                                    <th key={tp.idx} style={{padding: '4px 10px', textAlign: 'center', color: '#64748b', fontWeight: 600}}>{tp.label}</th>
                                                                ))}
                                                            </tr></thead>
                                                            <tbody>
                                                                {persistResults.perMed.map((m, idx) => {
                                                                    const palette = ['#2980b9', '#e74c3c', '#27ae60', '#f39c12', '#8e44ad', '#16a085', '#d35400', '#2c3e50', '#c0392b', '#7f8c8d'];
                                                                    return (
                                                                        <tr key={m.med}>
                                                                            <td style={{padding: '4px 10px', whiteSpace: 'nowrap'}}>
                                                                                <span style={{display: 'inline-block', width: '10px', height: '10px', borderRadius: '2px', background: palette[idx % palette.length], marginRight: '6px'}}></span>
                                                                                {m.med.length > 24 ? m.med.slice(0, 24) + '…' : m.med}
                                                                            </td>
                                                                            {m.points.map(p => (
                                                                                <td key={p.label} style={{padding: '4px 10px', textAlign: 'center', color: p.reliable ? '#334155' : '#e67e22'}}>{p.atRisk}</td>
                                                                            ))}
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>

                                                {/* Por cada medicamento: resumen + tabla */}
                                                {persistResults.perMed.map((m, idx) => (
                                                    <div key={m.med} style={{background: '#fff', border: '1px solid #e2e8f0', borderRadius: '10px', padding: '20px 24px', marginBottom: '20px'}}>
                                                        <h3 style={{color: '#1B4354', marginTop: 0}}>{m.med}</h3>

                                                        {/* Resumen descriptivo de la población */}
                                                        <div style={{background: '#f8fafc', borderRadius: '8px', padding: '14px 18px', marginBottom: '16px'}}>
                                                            <strong style={{color: '#1a5276'}}>
                                                                Población incluida (inicios en el período){persistResults.cohort === 'naive' ? ' — solo naive' : persistResults.cohort === 'noNaive' ? ' — solo no naive' : ''}:
                                                            </strong>
                                                            <ul style={{margin: '8px 0 0', paddingLeft: '20px', fontSize: '0.92em', color: '#334155'}}>
                                                                <li>
                                                                    Total de pacientes analizados: <strong>{m.totalAll}</strong>
                                                                    {m.totalAll > 0 && (
                                                                        <button
                                                                            onClick={() => setPersistDetailMed(m.med)}
                                                                            style={{
                                                                                marginLeft: '10px', padding: '2px 10px', fontSize: '0.82em',
                                                                                border: '1px solid #2980b9', borderRadius: '6px', background: '#eaf2f8',
                                                                                color: '#1a5276', cursor: 'pointer', fontWeight: 600
                                                                            }}>
                                                                            👁️ Ver detalle
                                                                        </button>
                                                                    )}
                                                                </li>
                                                                {persistResults.cohort === 'all' && (
                                                                    <>
                                                                        <li>Naive: <strong>{m.naiveN}</strong> ({m.totalAll ? ((m.naiveN / m.totalAll) * 100).toFixed(1) : 0}%)</li>
                                                                        <li>No naive: <strong>{m.noNaiveN}</strong> ({m.totalAll ? ((m.noNaiveN / m.totalAll) * 100).toFixed(1) : 0}%)</li>
                                                                    </>
                                                                )}
                                                            </ul>
                                                            {persistResults.cohort !== 'naive' && m.prevTreatments.length > 0 && (
                                                                <div style={{marginTop: '10px'}}>
                                                                    <strong style={{color: '#1a5276', fontSize: '0.92em'}}>Tratamientos previos (pacientes no naive):</strong>
                                                                    <table style={{width: '100%', maxWidth: '480px', borderCollapse: 'collapse', marginTop: '6px', fontSize: '0.85em'}}>
                                                                        <thead><tr style={{background: '#e2e8f0'}}>
                                                                            <th style={{textAlign: 'left', padding: '5px 8px'}}>Tratamiento anterior</th>
                                                                            <th style={{textAlign: 'right', padding: '5px 8px'}}>Pacientes</th>
                                                                            <th style={{textAlign: 'right', padding: '5px 8px'}}>%</th>
                                                                        </tr></thead>
                                                                        <tbody>
                                                                            {m.prevTreatments.map(pt => (
                                                                                <tr key={pt.name} style={{borderBottom: '1px solid #eee'}}>
                                                                                    <td style={{padding: '5px 8px'}}>{pt.name}</td>
                                                                                    <td style={{textAlign: 'right', padding: '5px 8px'}}>{pt.n}</td>
                                                                                    <td style={{textAlign: 'right', padding: '5px 8px'}}>{m.noNaiveN ? ((pt.n / m.noNaiveN) * 100).toFixed(1) : 0}%</td>
                                                                                </tr>
                                                                            ))}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            )}
                                                        </div>

                                                        {/* Mediana de persistencia */}
                                                        <div style={{background: '#eef7ff', border: '1px solid #b3d8f5', borderRadius: '8px', padding: '10px 14px', marginBottom: '14px', fontSize: '0.9em', color: '#1a5276'}}>
                                                            <strong>Mediana de persistencia:</strong><InfoTip text="Tiempo (estimado por Kaplan-Meier) en el que la mitad de los pacientes de la cohorte han discontinuado el tratamiento, es decir, cuando la curva de persistencia cruza el 50%. Si la curva no baja del 50% en el periodo observado, la mediana 'no se alcanza'." />{' '}
                                                            {m.km.medianReached
                                                                ? <span>{m.km.median} días (~{(m.km.median / 30.4375).toFixed(1)} meses) — tiempo en el que la persistencia cae al 50%.</span>
                                                                : <span>no alcanzada (la persistencia no desciende por debajo del 50% dentro del período observado).</span>}
                                                        </div>

                                                        {/* Tabla de persistencia por punto temporal */}
                                                        <strong style={{color: '#1a5276', fontSize: '0.92em'}}>Persistencia por punto temporal (cohorte analizada: n={m.cohortN}):</strong>
                                                        <div style={{overflowX: 'auto', marginTop: '8px'}}>
                                                            <table style={{borderCollapse: 'collapse', fontSize: '0.85em', minWidth: '520px'}}>
                                                                <thead><tr style={{background: '#1B4354', color: '#fff'}}>
                                                                    <th style={{padding: '6px 12px', textAlign: 'left'}}>Tiempo</th>
                                                                    <th style={{padding: '6px 12px', textAlign: 'right'}}>En riesgo</th>
                                                                    <th style={{padding: '6px 12px', textAlign: 'right'}}>Persistentes (est.)<InfoTip text="Estimación del número de pacientes que continúan en tratamiento = S(t) × n inicial. Es una estimación de Kaplan-Meier, no un recuento exacto: puede diferir del número real 'en riesgo' por la censura." /></th>
                                                                    <th style={{padding: '6px 12px', textAlign: 'right'}}>Persistencia (%)</th>
                                                                    <th style={{padding: '6px 12px', textAlign: 'right'}}>IC 95%<InfoTip text="Intervalo de confianza del 95% de la persistencia estimada, calculado por transformación log-log (varianza de Greenwood). Indica el margen de incertidumbre: cuanto más estrecho, más fiable la estimación." /></th>
                                                                </tr></thead>
                                                                <tbody>
                                                                    {m.points.map(p => (
                                                                        <tr key={p.label} style={{borderBottom: '1px solid #eee', opacity: p.reliable ? 1 : 0.55}}>
                                                                            <td style={{padding: '5px 12px'}}>{p.label}{!p.reliable && <span title={`Menos de ${m.cohortN >= 0 ? persistResults.minAtRisk : ''} pacientes en riesgo: estimación poco fiable`} style={{color: '#e67e22'}}> ⚠️</span>}</td>
                                                                            <td style={{padding: '5px 12px', textAlign: 'right'}}>{p.atRisk}</td>
                                                                            <td style={{padding: '5px 12px', textAlign: 'right'}}>{p.nPersist}</td>
                                                                            <td style={{padding: '5px 12px', textAlign: 'right', fontWeight: 600}}>{p.pct}%</td>
                                                                            <td style={{padding: '5px 12px', textAlign: 'right', color: '#64748b'}}>{p.ciL}–{p.ciU}%</td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                        <p style={{fontSize: '0.78em', color: '#94a3b8', margin: '6px 0 0'}}>
                                                            ⚠️ = menos de {persistResults.minAtRisk} pacientes en riesgo (cola poco fiable, mostrada en discontinuo en la curva). "Persistentes (est.)" = S(t) × n, es una estimación, no un recuento exacto.
                                                        </p>
                                                    </div>
                                                ))}

                                                <div style={{fontSize: '0.8em', color: '#94a3b8', marginTop: '8px', lineHeight: 1.5}}>
                                                    <strong>Metodología:</strong> Diseño de nuevo usuario (lavado de {persistResults.coverageDays + persistResults.graceDays >= 0 ? '4 meses' : ''} previo). Persistencia estimada por Kaplan-Meier. Fin de persistencia (evento) = discontinuación por falta de reposición (hueco entre dispensaciones &gt; {persistResults.gapDays} días = {persistResults.coverageDays} días de cobertura + {persistResults.graceDays} de margen), fechado al agotarse la cobertura del último envase; o cambio a otro medicamento, lo que ocurra antes. Censura administrativa en el fin de observación para quienes siguen en tratamiento (gap hasta el cierre ≤ {persistResults.gapDays} días). IC 95% por transformación log-log (varianza de Greenwood).
                                                </div>
                                            </div>
                                        )}

                                        {/* MODAL: detalle de pacientes incluidos */}
                                        {persistDetailMed && persistResults && (() => {
                                            const detail = persistResults.perMed.find(x => x.med === persistDetailMed);
                                            if (!detail) return null;
                                            const fmt = (d) => (d instanceof Date && !isNaN(d)) ? d.toLocaleDateString('es-ES') : '—';
                                            const outcomeLabel = { gap: 'Discontinuación (falta de reposición)', switch: 'Cambio de tratamiento', censored: 'En tratamiento al cierre (censurado)' };
                                            const outcomeColor = { gap: '#e67e22', switch: '#c0392b', censored: '#27ae60' };
                                            const rows = [...detail.subjects].sort((a, b) => a.firstDate - b.firstDate);
                                            return (
                                                <div
                                                    onClick={() => setPersistDetailMed(null)}
                                                    style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px'}}>
                                                    <div onClick={(e) => e.stopPropagation()}
                                                        style={{background: '#fff', borderRadius: '12px', maxWidth: '1080px', width: '100%', maxHeight: '85vh', display: 'flex', flexDirection: 'column', boxShadow: '0 10px 40px rgba(0,0,0,0.3)'}}>
                                                        {/* Cabecera del modal */}
                                                        <div style={{padding: '18px 24px', borderBottom: '1px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                            <div>
                                                                <h3 style={{margin: 0, color: '#1B4354'}}>Detalle de pacientes incluidos</h3>
                                                                <p style={{margin: '4px 0 0', color: '#64748b', fontSize: '0.88em'}}>{detail.med} · n = {detail.cohortN}</p>
                                                            </div>
                                                            <button onClick={() => setPersistDetailMed(null)}
                                                                style={{border: 'none', background: '#f1f5f9', borderRadius: '8px', width: '34px', height: '34px', cursor: 'pointer', fontSize: '1.2em', color: '#475569'}}>×</button>
                                                        </div>
                                                        {/* Cuerpo con tabla */}
                                                        <div style={{overflow: 'auto', padding: '0 24px'}}>
                                                            <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '0.82em'}}>
                                                                <thead style={{position: 'sticky', top: 0, background: '#1B4354', color: '#fff'}}>
                                                                    <tr>
                                                                        <th style={{padding: '10px 8px', textAlign: 'left'}}>Id paciente</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'center'}}>Tipo</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'left'}}>Patología</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'left'}}>Tratamiento anterior</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'center'}}>1ª dispensación</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'center'}}>Última dispensación</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'left'}}>Tratamiento posterior</th>
                                                                        <th style={{padding: '10px 8px', textAlign: 'center'}}>Desenlace</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    {rows.map((s, i) => (
                                                                        <tr key={s.id + '_' + i} style={{borderBottom: '1px solid #eee', background: i % 2 ? '#f8fafc' : '#fff'}}>
                                                                            <td style={{padding: '8px', fontFamily: 'monospace'}}>{s.id}</td>
                                                                            <td style={{padding: '8px', textAlign: 'center'}}>
                                                                                <span style={{padding: '2px 8px', borderRadius: '10px', fontSize: '0.85em', background: s.naive ? '#eafaf1' : '#fef5e7', color: s.naive ? '#1e8449' : '#b9770e'}}>
                                                                                    {s.naive ? 'Naive' : 'No naive'}
                                                                                </span>
                                                                            </td>
                                                                            <td style={{padding: '8px'}}>{s.pathology || <span style={{color: '#cbd5e1'}}>—</span>}</td>
                                                                            <td style={{padding: '8px'}}>
                                                                                {s.prevTreatment
                                                                                    ? <span>{s.prevTreatment} <span style={{color: '#94a3b8'}}>({fmt(s.prevTreatmentDate)})</span></span>
                                                                                    : <span style={{color: '#cbd5e1'}}>—</span>}
                                                                            </td>
                                                                            <td style={{padding: '8px', textAlign: 'center'}}>{fmt(s.firstDate)}</td>
                                                                            <td style={{padding: '8px', textAlign: 'center'}}>{fmt(s.lastDate)}</td>
                                                                            <td style={{padding: '8px'}}>
                                                                                {s.nextTreatment
                                                                                    ? <span>{s.nextTreatment} <span style={{color: '#94a3b8'}}>({fmt(s.nextTreatmentDate)})</span></span>
                                                                                    : <span style={{color: '#cbd5e1'}}>—</span>}
                                                                            </td>
                                                                            <td style={{padding: '8px', textAlign: 'center'}}>
                                                                                <span style={{color: outcomeColor[s.outcome] || '#475569', fontWeight: 600}}>{outcomeLabel[s.outcome] || '—'}</span>
                                                                            </td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                        {/* Pie del modal */}
                                                        <div style={{padding: '12px 24px', borderTop: '1px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                            <span style={{fontSize: '0.78em', color: '#94a3b8'}}>
                                                                "Tratamiento anterior/posterior" = dispensación de otro medicamento inmediatamente previa a la 1ª / posterior a la última, dentro del universo filtrado.
                                                            </span>
                                                            <button onClick={() => exportPersistDetailExcel(detail)}
                                                                style={{padding: '8px 16px', borderRadius: '8px', border: 'none', background: '#1e8449', color: '#fff', fontWeight: 600, cursor: 'pointer', fontSize: '0.85em'}}>
                                                                ⬇️ Exportar a Excel
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </>
                                )}
                            </>
                        )}

                        {/* === VISTA INFORMES === */}
                        {viewMode === 'reports' && (
                            <>
                                <div className="alert alert-info" style={{marginBottom: '20px'}}>
                                    ℹ️ <strong>Informes predefinidos:</strong> Genera informes completos en formato PDF para presentar y compartir.
                                </div>

                                <h2 style={{marginBottom: '8px', color: '#1B4354'}}>📄 Informes</h2>
                                <p style={{marginTop: 0, marginBottom: '24px', color: '#64748b', fontSize: '0.9em'}}>
                                    Genera un informe profesional en PDF con los indicadores del periodo. Selecciona el tipo de informe, la granularidad temporal y el formato deseado.
                                </p>

                                <div style={{
                                    background: '#fff',
                                    border: '1px solid #e2e8f0',
                                    borderRadius: '10px',
                                    padding: '20px 24px',
                                    marginBottom: '20px',
                                    boxShadow: '0 1px 3px rgba(0,0,0,0.04)'
                                }}>
                                    {/* Selector 0: Tipo de informe */}
                                    <div style={{marginBottom: '18px'}}>
                                        <div style={{fontSize: '0.78em', fontWeight: 600, color: '#475569', letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: '8px'}}>
                                            Tipo de informe
                                        </div>
                                        <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                            {[
                                                {key: 'seguimiento',  label: '📊 Seguimiento general',     desc: 'Indicadores globales: pacientes, visitas, dispensaciones y coste'},
                                                {key: 'biosimilares', label: '💊 Seguimiento de biosimilares', desc: 'Penetración de biosimilares por PA, evolución y detalle por marca'}
                                            ].map(opt => (
                                                <button
                                                    key={opt.key}
                                                    onClick={() => setReportTopic(opt.key)}
                                                    title={opt.desc}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: reportTopic === opt.key ? '#1B4354' : '#f1f5f9',
                                                        color: reportTopic === opt.key ? 'white' : '#475569',
                                                        border: reportTopic === opt.key ? '1px solid #1B4354' : '1px solid #e2e8f0',
                                                        borderRadius: '6px',
                                                        fontSize: '0.92em',
                                                        fontWeight: reportTopic === opt.key ? 600 : 500,
                                                        cursor: 'pointer',
                                                        transition: 'all 0.15s ease'
                                                    }}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Selector 1: Granularidad */}
                                    <div style={{marginBottom: '18px'}}>
                                        <div style={{fontSize: '0.78em', fontWeight: 600, color: '#475569', letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: '8px'}}>
                                            Mostrar datos por
                                        </div>
                                        <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                            {[
                                                {key: 'years',    label: 'Años'},
                                                {key: 'quarters', label: 'Trimestres'},
                                                {key: 'months',   label: 'Meses'}
                                            ].map(opt => (
                                                <button
                                                    key={opt.key}
                                                    onClick={() => setReportGranularity(opt.key)}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: reportGranularity === opt.key ? '#1B4354' : '#f1f5f9',
                                                        color: reportGranularity === opt.key ? 'white' : '#475569',
                                                        border: reportGranularity === opt.key ? '1px solid #1B4354' : '1px solid #e2e8f0',
                                                        borderRadius: '6px',
                                                        fontSize: '0.92em',
                                                        fontWeight: reportGranularity === opt.key ? 600 : 500,
                                                        cursor: 'pointer',
                                                        transition: 'all 0.15s ease'
                                                    }}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Selector 2: Formato */}
                                    <div style={{marginBottom: '24px'}}>
                                        <div style={{fontSize: '0.78em', fontWeight: 600, color: '#475569', letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: '8px'}}>
                                            Formato del informe
                                        </div>
                                        <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                            {[
                                                {key: 'complete', label: '📄 Completo',  desc: 'Varias páginas con gráficos y tablas detalladas'},
                                                {key: 'compact',  label: '🗂️ Compacto', desc: '1 página horizontal tipo dashboard ejecutivo'}
                                            ].map(opt => (
                                                <button
                                                    key={opt.key}
                                                    onClick={() => setReportFormat(opt.key)}
                                                    title={opt.desc}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: reportFormat === opt.key ? '#1B4354' : '#f1f5f9',
                                                        color: reportFormat === opt.key ? 'white' : '#475569',
                                                        border: reportFormat === opt.key ? '1px solid #1B4354' : '1px solid #e2e8f0',
                                                        borderRadius: '6px',
                                                        fontSize: '0.92em',
                                                        fontWeight: reportFormat === opt.key ? 600 : 500,
                                                        cursor: 'pointer',
                                                        transition: 'all 0.15s ease'
                                                    }}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Resumen de la selección + botón generar */}
                                    <div style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'space-between',
                                        borderTop: '1px solid #f1f5f9',
                                        paddingTop: '18px',
                                        gap: '20px',
                                        flexWrap: 'wrap'
                                    }}>
                                        <div style={{fontSize: '0.88em', color: '#475569'}}>
                                            <span style={{color: '#94a3b8'}}>Vas a generar: </span>
                                            <strong style={{color: '#1B4354'}}>
                                                Informe {reportFormat === 'compact' ? 'compacto' : 'completo'} de {
                                                    reportTopic === 'biosimilares' ? 'biosimilares' : 'seguimiento'
                                                } por {
                                                    reportGranularity === 'years' ? 'años' :
                                                    reportGranularity === 'quarters' ? 'trimestres' : 'meses'
                                                }
                                            </strong>
                                        </div>
                                        <button
                                            onClick={() => generateSeguimientoReport(reportGranularity, reportFormat, reportTopic)}
                                            disabled={!data || reportLoading}
                                            style={{
                                                padding: '12px 28px',
                                                background: (!data || reportLoading) ? '#cbd5e1' : '#1B4354',
                                                color: 'white',
                                                border: 'none',
                                                borderRadius: '8px',
                                                fontSize: '14px',
                                                fontWeight: 'bold',
                                                cursor: (!data || reportLoading) ? 'not-allowed' : 'pointer',
                                                boxShadow: '0 2px 6px rgba(0, 0, 0, 0.12)',
                                                transition: 'all 0.2s ease'
                                            }}
                                        >
                                            {reportLoading ? '⏳ Generando…' : '📄 Generar PDF'}
                                        </button>
                                    </div>
                                </div>

                                {reportLoading && (
                                    <div className="loading" style={{marginTop: '30px'}}>
                                        <div className="spinner"></div>
                                        <p>Generando informe PDF...</p>
                                    </div>
                                )}

                                {reportGenerated && (
                                    <div className="alert alert-success" style={{marginTop: '20px'}}>
                                        ✅ <strong>Informe generado exitosamente</strong>
                                        <p style={{marginTop: '10px', fontSize: '0.9em'}}>
                                            El informe se ha descargado automáticamente. Si no se descargó, verifica la carpeta de descargas de tu navegador.
                                        </p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>

                    {/* Modal de información */}
                    {showInfoModal && (
                        <div className="modal-overlay" onClick={() => setShowInfoModal(false)}>
                            <div className="modal-box" onClick={e => e.stopPropagation()}>
                                <h2>ℹ Acerca de esta aplicación</h2>
                                <p>
                                    <strong>VIGIA-IMID</strong> (<em>Visor de Indicadores de Gestión e Impacto Asistencial en farmacoterapia de patologías inflamatorias inmunomediadas</em>) es una herramienta de análisis cuantitativo de dispensaciones farmacéuticas en patologías inmunomediadas (IMID).
                                </p>
                                <p>
                                    Permite calcular indicadores de pacientes, visitas, dispensaciones y coste, con capacidad de filtrado y agrupación temporal por meses, trimestres y años.
                                </p>
                                <p style={{background: '#fdebd0', borderLeft: '4px solid #e67e22', padding: '0.6rem 0.8rem', borderRadius: '6px', fontSize: '0.82rem'}}>
                                    ⚠️ Esta herramienta es un <strong>apoyo a la gestión</strong> y no debe utilizarse como único criterio para la toma de decisiones clínicas. Los datos se procesan localmente en el navegador y no se envían a ningún servidor externo.
                                </p>
                                <div className="modal-footer">
                                    <span>Aplicación creada por </span>
                                    <a href="https://www.linkedin.com/in/emilio-monte-boquet" target="_blank" rel="noopener">EMB</a>
                                    <span> · Hospital Universitari i Politècnic La Fe · Valencia</span>
                                </div>
                                <button className="btn-close-modal" onClick={() => setShowInfoModal(false)}>Cerrar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Captura cualquier error inesperado de la aplicación y muestra un aviso
        // comprensible en lugar de dejar la pantalla en blanco.
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null }; }
            static getDerivedStateFromError(error) { return { error }; }
            componentDidCatch(error, info) { console.error('Error en la aplicación:', error, info); }
            render() {
                if (!this.state.error) return this.props.children;
                const msg = String(this.state.error && this.state.error.message || this.state.error);
                return (
                    <div style={{ maxWidth: '720px', margin: '3rem auto', padding: '0 1rem', fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' }}>
                        <div style={{ background: '#fff', border: '1px solid var(--gris-borde)', borderTop: '4px solid var(--rojo)', borderRadius: 'var(--radius)', padding: '1.5rem' }}>
                            <h2 style={{ color: 'var(--rojo)', fontSize: '1.15rem', marginBottom: '0.75rem' }}>
                                ⚠️ Se ha producido un error inesperado
                            </h2>
                            <p style={{ color: 'var(--texto)', fontSize: '0.9rem', marginBottom: '0.75rem', lineHeight: 1.6 }}>
                                La aplicación ha encontrado un problema y no ha podido continuar.
                                Tus datos <strong>no se han enviado a ningún sitio</strong>: todo el procesamiento
                                ocurre en este navegador. Vuelve a cargar la página y, si el error se repite,
                                revisa que el Excel tenga las columnas esperadas.
                            </p>
                            <details style={{ marginBottom: '1rem' }}>
                                <summary style={{ cursor: 'pointer', fontSize: '0.82rem', color: 'var(--texto-sec)', fontWeight: 600 }}>
                                    Detalle técnico (útil si necesitas reportarlo)
                                </summary>
                                <pre style={{ marginTop: '0.5rem', padding: '0.6rem', background: 'var(--gris-fondo)', borderRadius: 'var(--radius)', fontSize: '0.75rem', whiteSpace: 'pre-wrap', wordBreak: 'break-word', color: 'var(--texto)' }}>{msg}</pre>
                            </details>
                            <button
                                onClick={() => window.location.reload()}
                                style={{ padding: '0.6rem 1.2rem', background: 'var(--azul)', color: '#fff', border: 'none', borderRadius: 'var(--radius)', fontSize: '0.9rem', fontWeight: 600, cursor: 'pointer' }}
                            >
                                Recargar la aplicación
                            </button>
                        </div>
                    </div>
                );
            }
        }

        ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
    </script>
</body>
</html>
