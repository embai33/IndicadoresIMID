                pdf.text('PERIODO', PAGE_W - M - 56, 6);
                pdf.text('FECHA', PAGE_W - M, 6, { align: 'right' });
                pdf.setFont('helvetica', 'bold');
                pdf.setFontSize(9);
                setText([255, 255, 255]);
                pdf.text(periodoTxt, PAGE_W - M - 56, 10);
                pdf.setFontSize(8);
                pdf.text(fecha, PAGE_W - M, 10, { align: 'right' });

                // Fila inferior derecha: intervalo de fechas de dispensaciones
                if (dateRangeTxt) {
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    setText([200, 215, 222]);
                    pdf.text('DISPENSACIONES', PAGE_W - M, 14.5, { align: 'right' });
                    setText([255, 255, 255]);
                    pdf.setFontSize(7.5);
                    pdf.text(dateRangeTxt, PAGE_W - M, 19, { align: 'right' });
                } else if (activeFilters.length > 0) {
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    setText([200, 215, 222]);
                    const ftxt = 'Filtros: ' + activeFilters.join(' · ');
                    pdf.text(ftxt.length > 70 ? ftxt.substring(0, 70) + '…' : ftxt, PAGE_W - M, 19, { align: 'right' });
                }
                if (dateRangeTxt && activeFilters.length > 0) {
                    // Si hay ambos, los filtros van alineados a la izquierda en la fila inferior
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    setText([200, 215, 222]);
                    const ftxt = 'Filtros: ' + activeFilters.join(' · ');
                    pdf.text(ftxt.length > 55 ? ftxt.substring(0, 55) + '…' : ftxt, M + 24, 19);
                }

                // ===================================================================
                // 2) FILA KPIs — 18mm
                // ===================================================================
                let y = HDR_H + 3;
                const KPI_H = 18;
                const kpiCount = 5;
                const kpiGap = 3;
                const kpiW = (W - kpiGap * (kpiCount - 1)) / kpiCount;

                const kpis = [
                    { label: 'Pacientes',      value: fmtCompact(totals.pacientes),       full: fmtInt(totals.pacientes),       delta: deltaPacientes, accent: COLOR.petrolMd, icon: 'P' },
                    { label: 'Visitas',        value: fmtCompact(totals.visitas),         full: fmtInt(totals.visitas),         delta: deltaVisitas,   accent: COLOR.green,    icon: 'V' },
                    { label: 'Dispensaciones', value: fmtCompact(totals.dispensaciones),  full: fmtInt(totals.dispensaciones),  delta: deltaDisp,      accent: COLOR.petrolMd, icon: 'D' },
                    { label: 'Coste total',    value: fmtCurrencyCompact(totals.coste),   full: fmtCurrency(totals.coste),      delta: deltaCoste,     accent: COLOR.amber,    icon: '€', upIsBad: true },
                    { label: 'Coste/paciente', value: '€' + fmtCompact(lastCp),           full: '€' + Number(lastCp).toLocaleString('es-ES', { maximumFractionDigits: 0 }), delta: deltaCp, accent: COLOR.amber, icon: 'C', upIsBad: true }
                ];

                kpis.forEach((k, i) => {
                    const x = M + i * (kpiW + kpiGap);
                    card(x, y, kpiW, KPI_H, k.accent);
                    setFill(k.accent);
                    pdf.circle(x + 5.5, y + 9, 3, 'F');
                    setText([255, 255, 255]);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9);
                    pdf.text(k.icon, x + 5.5, y + 10.3, { align: 'center' });
                    setText(COLOR.muted);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6);
                    pdf.text(k.label.toUpperCase(), x + 11, y + 5);
                    setText(COLOR.ink);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(12);
                    pdf.text(k.value, x + 11, y + 11);
                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6);
                    pdf.text(k.full, x + 11, y + 15);
                    if (k.delta !== null && !isNaN(k.delta)) {
                        const isUp = k.delta > 0;
                        const isGood = k.upIsBad ? !isUp : isUp;
                        const dColor = isGood ? COLOR.green : COLOR.red;
                        drawTriangle(x + kpiW - 13, y + 13.5, isUp, 1.2, dColor);
                        setText(dColor);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(6.8);
                        pdf.text(`${Math.abs(k.delta).toFixed(1).replace('.', ',')}%`, x + kpiW - 11, y + 14.5);
                    }
                });

                // ===================================================================
                // 3) GRID 2×2 — Balanced Scorecard
                // ===================================================================
                y += KPI_H + 4;
                const BS_H = 78;
                const bsGap = 3;
                const bsW = (W - bsGap) / 2;

                const blockHeader = (x, by, iconChar, iconColor, title, subtitle) => {
                    setFill(iconColor);
                    pdf.circle(x + 6, by + 6.5, 3.2, 'F');
                    setText([255, 255, 255]);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9);
                    pdf.text(iconChar, x + 6, by + 7.8, { align: 'center' });
                    setText(COLOR.ink);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9.5);
                    pdf.text(title, x + 12, by + 6);
                    setText(COLOR.muted);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    pdf.text(subtitle, x + 12, by + 9.5);
                };

                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'fixed';
                tempDiv.style.left = '-9999px';
                tempDiv.style.width = '1600px';
                tempDiv.style.height = '1600px';
                document.body.appendChild(tempDiv);

                // Datos para los gráficos de actividad
                const dataPacByPeriod = allPeriods.map(p => periodData.data.find(r => r.Periodo == p)?.Pacientes || 0);
                const dataVisitasByPeriod = allPeriods.map(p => periodData.data.find(r => r.Periodo == p)?.Visitas || 0);
                const dataDispByPeriod = allPeriods.map(p => periodData.data.find(r => r.Periodo == p)?.Dispensaciones || 0);
                const dataCosteByPeriod = allPeriods.map(p => parseFloat(periodData.data.find(r => r.Periodo == p)?.Coste || 0));

                try {
                    // === BLOQUE 1: ACTIVIDAD ASISTENCIAL ===
                    const b1x = M, b1y = y;
                    card(b1x, b1y, bsW, BS_H, COLOR.petrolMd);
                    blockHeader(b1x, b1y, 'A', COLOR.petrolMd, 'Actividad asistencial',
                                `Pacientes únicos · ${GRAN.descVD}`);

                    const subW = (bsW - 12) / 2;
                    const subTop = b1y + 14;
                    const subH = BS_H - 16;
                    const tickFontSize = granularity === 'months' ? 14 : (granularity === 'quarters' ? 16 : 18);
                    const labelRotation = granularity === 'months' ? 45 : 0;

                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('Pacientes únicos', b1x + 4, subTop - 1);

                    const cA1 = document.createElement('canvas');
                    cA1.width = 600; cA1.height = 500;
                    tempDiv.appendChild(cA1);
                    const chA1 = new Chart(cA1, {
                        type: 'bar',
                        data: {
                            labels: chartLabels,
                            datasets: [{
                                data: dataPacByPeriod,
                                backgroundColor: 'rgba(44, 92, 110, 0.92)',
                                borderRadius: granularity === 'months' ? 1.5 : 3,
                                borderSkipped: false
                            }]
                        },
                        options: {
                            responsive: false, animation: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(226,232,240,0.7)', drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 16 } } },
                                x: { grid: { display: false, drawBorder: false }, ticks: { color: '#475569', font: { size: tickFontSize, weight: '600' }, maxRotation: labelRotation } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 200));
                    pdf.addImage(cA1.toDataURL('image/png', 1.0), 'PNG', b1x + 4, subTop, subW, subH);
                    chA1.destroy();

                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('Visitas y dispensaciones', b1x + 4 + subW + 6, subTop - 1);

                    const cA2 = document.createElement('canvas');
                    cA2.width = 600; cA2.height = 500;
                    tempDiv.appendChild(cA2);
                    const chA2 = new Chart(cA2, {
                        type: 'bar',
                        data: {
                            labels: chartLabels,
                            datasets: [
                                { label: 'Visitas',        data: dataVisitasByPeriod, backgroundColor: 'rgba(16, 168, 122, 0.92)', borderRadius: granularity === 'months' ? 1.5 : 3, borderSkipped: false },
                                { label: 'Dispensaciones', data: dataDispByPeriod,    backgroundColor: 'rgba(232, 168, 56, 0.92)', borderRadius: granularity === 'months' ? 1.5 : 3, borderSkipped: false }
                            ]
                        },
                        options: {
                            responsive: false, animation: false,
                            plugins: {
                                legend: { display: true, position: 'top', align: 'end', labels: { font: { size: 14 }, padding: 6, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded', color: '#475569' } },
                                tooltip: { enabled: false }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(226,232,240,0.7)', drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 16 } } },
                                x: { grid: { display: false, drawBorder: false }, ticks: { color: '#475569', font: { size: tickFontSize, weight: '600' }, maxRotation: labelRotation } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 200));
                    pdf.addImage(cA2.toDataURL('image/png', 1.0), 'PNG', b1x + 4 + subW + 6, subTop, subW, subH);
                    chA2.destroy();

                    // === BLOQUE 2: DISTRIBUCIÓN CLÍNICA — 3 PIES ===
                    const b2x = M + bsW + bsGap, b2y = y;
                    card(b2x, b2y, bsW, BS_H, COLOR.petrol);
                    blockHeader(b2x, b2y, 'S', COLOR.petrol, 'Distribución clínica',
                                'Reparto porcentual por servicio prescriptor');

                    const distByService = (mode) => {
                        const mp = {};
                        dataToProcess.forEach(row => {
                            if (!row['Servicio Prescriptor']) return;
                            const s = row['Servicio Prescriptor'];
                            if (!mp[s]) mp[s] = (mode === 'dispensaciones' ? 0 : new Set());
                            if (mode === 'pacientes') { if (row['Id']) mp[s].add(row['Id']); }
                            else if (mode === 'visitas') {
                                if (row['Id'] && row['Fecha Dispensación']) mp[s].add(row['Id'] + '_' + row['Fecha Dispensación'].toISOString().split('T')[0]);
                            } else mp[s]++;
                        });
                        let arr = Object.keys(mp).map(k => ({
                            name: k,
                            count: (mode === 'dispensaciones') ? mp[k] : mp[k].size
                        })).sort((a, b) => b.count - a.count);
                        if (arr.length > 5) {
                            const top5 = arr.slice(0, 5);
                            const rest = arr.slice(5).reduce((s, x) => s + x.count, 0);
                            if (rest > 0) top5.push({ name: 'Otros', count: rest });
                            arr = top5;
                        }
                        return arr;
                    };
                    const distPac = distByService('pacientes');
                    const distVis = distByService('visitas');
                    const distDisp = distByService('dispensaciones');

                    const pieAreaTop = b2y + 16;
                    const pieAreaH = BS_H - 19;
                    const pieW = (bsW - 12) / 3;
                    const piesData = [
                        { title: 'Pacientes',      data: distPac,  total: distPac.reduce((s, x) => s + x.count, 0) },
                        { title: 'Visitas',        data: distVis,  total: distVis.reduce((s, x) => s + x.count, 0) },
                        { title: 'Dispensaciones', data: distDisp, total: distDisp.reduce((s, x) => s + x.count, 0) }
                    ];

                    const whiteTextIdx = new Set([0, 3, 4, 5]);
                    for (let pi = 0; pi < piesData.length; pi++) {
                        const p = piesData[pi];
                        const pxStart = b2x + 4 + pi * (pieW + 4);
                        setText(COLOR.inkSoft);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(7);
                        pdf.text(p.title, pxStart + pieW / 2, pieAreaTop, { align: 'center' });

                        const cPie = document.createElement('canvas');
                        cPie.width = 500; cPie.height = 500;
                        tempDiv.appendChild(cPie);
                        const chPie = new Chart(cPie, {
                            type: 'doughnut',
                            data: {
                                labels: p.data.map(d => d.name),
                                datasets: [{
                                    data: p.data.map(d => d.count),
                                    backgroundColor: PIE_PALETTE.slice(0, p.data.length),
                                    borderColor: '#ffffff',
                                    borderWidth: 2
                                }]
                            },
                            options: {
                                responsive: false, animation: false,
                                cutout: '55%',
                                plugins: { legend: { display: false }, tooltip: { enabled: false } }
                            }
                        });
                        await new Promise(r => setTimeout(r, 200));
                        const pieSize = Math.min(pieW - 4, pieAreaH - 22);
                        const pieX = pxStart + (pieW - pieSize) / 2;
                        const pieY = pieAreaTop + 2;
                        pdf.addImage(cPie.toDataURL('image/png', 1.0), 'PNG', pieX, pieY, pieSize, pieSize);
                        chPie.destroy();

                        // Etiquetas % dentro de cada slice
                        if (p.data.length > 0 && p.total > 0) {
                            const cx = pieX + pieSize / 2;
                            const cy = pieY + pieSize / 2;
                            const rOut = pieSize / 2 * 0.92;
                            const rIn = rOut * 0.55;
                            const rText = (rOut + rIn) / 2;
                            let cumA = -Math.PI / 2;
                            for (let si = 0; si < p.data.length; si++) {
                                const slice = p.data[si];
                                const fr = slice.count / p.total;
                                const sa = fr * 2 * Math.PI;
                                const mA = cumA + sa / 2;
                                const tx = cx + Math.cos(mA) * rText;
                                const ty = cy + Math.sin(mA) * rText;
                                if (fr >= 0.03) {
                                    const pctTxt = `${(fr * 100).toFixed(0)}%`;
                                    const useWhite = whiteTextIdx.has(si % PIE_PALETTE.length);
                                    setText(useWhite ? [255, 255, 255] : [25, 30, 40]);
                                    pdf.setFont('helvetica', 'bold');
                                    pdf.setFontSize(7.5);
                                    pdf.text(pctTxt, tx, ty + 0.8, { align: 'center' });
                                }
                                cumA += sa;
                            }
                        }
                    }

                    // Leyenda común
                    const legendY = pieAreaTop + pieAreaH - 12;
                    const legendNames = [];
                    piesData.forEach(p => p.data.forEach(d => { if (!legendNames.includes(d.name)) legendNames.push(d.name); }));
                    let lx = b2x + 4;
                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6);
                    for (let li = 0; li < legendNames.length; li++) {
                        const txt = legendNames[li].length > 12 ? legendNames[li].substring(0, 12) + '…' : legendNames[li];
                        const wTxt = pdf.getTextWidth(txt);
                        const chipW = 3 + 1 + wTxt + 4;
                        const col = PIE_PALETTE[li % PIE_PALETTE.length];
                        const mch = col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                        if (mch) setFill([+mch[1], +mch[2], +mch[3]]);
                        pdf.rect(lx, legendY - 2, 2.5, 2.5, 'F');
                        setText(COLOR.inkSoft);
                        pdf.text(txt, lx + 4, legendY);
                        lx += chipW;
                    }

                    // === BLOQUE 3: BIOSIMILARES ===
                    y += BS_H + bsGap;
                    const b3x = M, b3y = y;
                    card(b3x, b3y, bsW, BS_H, COLOR.green);
                    const bioTitleSuffix = granularity === 'years' ? 'anual' : granularity === 'quarters' ? 'trimestral' : 'mensual';
                    blockHeader(b3x, b3y, 'B', COLOR.green, 'Biosimilares',
                                `Penetración ${bioTitleSuffix} sobre PA con alternativa disponible`);

                    const chW3 = bsW * 0.62;
                    const kpiX3 = b3x + chW3 + 4;
                    const c3 = document.createElement('canvas');
                    c3.width = 800; c3.height = 500;
                    tempDiv.appendChild(c3);
                    const biosimCompactLabels = biosimByPeriod.periods.map(p => GRAN.shortLabel(p));
                    const ch3 = new Chart(c3, {
                        type: 'bar',
                        data: {
                            labels: biosimCompactLabels,
                            datasets: [{
                                data: biosimByPeriod.percentages.map(v => parseFloat(v)),
                                backgroundColor: 'rgba(16, 168, 122, 0.92)',
                                borderRadius: 3, borderSkipped: false
                            }]
                        },
                        options: {
                            responsive: false, animation: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            scales: {
                                y: { beginAtZero: true, max: 100, grid: { color: 'rgba(226,232,240,0.7)', drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 18 }, callback: v => v + '%' } },
                                x: { grid: { display: false, drawBorder: false }, ticks: { color: '#475569', font: { size: granularity === 'months' ? 12 : 20, weight: '600' }, maxRotation: granularity === 'months' ? 45 : 0 } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 200));
                    pdf.addImage(c3.toDataURL('image/png', 1.0), 'PNG', b3x + 3, b3y + 13, chW3, BS_H - 16);
                    ch3.destroy();

                    // Top PA con biosim (igual que en Dashboard compacto)
                    const PA_WITH_BIO_LIST = ['ADALIMUMAB', 'ETANERCEPT', 'INFLIXIMAB', 'TOCILIZUMAB', 'USTEKINUMAB', 'OMALIZUMAB', 'GOLIMUMAB'];
                    const paBioStats = {};
                    dataToProcess.forEach(row => {
                        if (!row['Id'] || !row['Descripción Principio Activo']) return;
                        const pa = String(row['Descripción Principio Activo']).toUpperCase();
                        const paKey = PA_WITH_BIO_LIST.find(p => pa.includes(p));
                        if (!paKey) return;
                        if (!paBioStats[paKey]) paBioStats[paKey] = { total: new Set(), bio: new Set() };
                        paBioStats[paKey].total.add(row['Id']);
                        const prod = String(row['Descripción Producto Dispensado'] || '').toUpperCase();
                        if (BIOSIMILARES.some(b => prod.includes(b))) paBioStats[paKey].bio.add(row['Id']);
                    });
                    const top3Bio = Object.keys(paBioStats)
                        .map(p => ({ name: p, bio: paBioStats[p].bio.size, total: paBioStats[p].total.size }))
                        .filter(x => x.bio > 0)
                        .sort((a, b) => b.bio - a.bio)
                        .slice(0, 3);
                    const lastBioPct = biosimByPeriod.percentages && biosimByPeriod.percentages.length > 0
                        ? parseFloat(biosimByPeriod.percentages[biosimByPeriod.percentages.length - 1]) : 0;
                    const lastBioPeriodLabel = biosimByPeriod.periods && biosimByPeriod.periods.length > 0
                        ? GRAN.shortLabel(biosimByPeriod.periods[biosimByPeriod.periods.length - 1]) : '';
                    const prevBioPct = biosimByPeriod.percentages && biosimByPeriod.percentages.length > 1
                        ? parseFloat(biosimByPeriod.percentages[biosimByPeriod.percentages.length - 2]) : null;
                    const prevBioPeriodLabel = biosimByPeriod.periods && biosimByPeriod.periods.length > 1
                        ? GRAN.shortLabel(biosimByPeriod.periods[biosimByPeriod.periods.length - 2]) : '';
                    const deltaBioPct = prevBioPct !== null ? (lastBioPct - prevBioPct) : null;
                    const varLabel = deltaBioPct !== null
                        ? `${deltaBioPct > 0 ? '+' : ''}${deltaBioPct.toFixed(1).replace('.', ',')} pp${prevBioPeriodLabel ? ' vs ' + prevBioPeriodLabel : ''}`
                        : '—';

                    const miniKpiList = (kx, ky0, items) => {
                        let ky = ky0;
                        items.forEach(([label, val]) => {
                            setText(COLOR.muted);
                            pdf.setFont('helvetica', 'normal');
                            pdf.setFontSize(6);
                            pdf.text(label.toUpperCase(), kx, ky);
                            setText(COLOR.ink);
                            pdf.setFont('helvetica', 'bold');
                            pdf.setFontSize(8.5);
                            pdf.text(val, kx, ky + 3.8);
                            ky += 8.5;
                        });
                    };

                    const penetracionLabel = lastBioPeriodLabel ? `Penet. ${lastBioPeriodLabel}` : 'Penetración';
                    const varInterLabel = granularity === 'years' ? 'Var. interanual' : granularity === 'quarters' ? 'Var. intertrimestral' : 'Var. intermensual';
                    miniKpiList(kpiX3, b3y + 16, [
                        [penetracionLabel,  `${lastBioPct.toFixed(1).replace('.', ',')}%`],
                        [varInterLabel,     varLabel],
                        ['Top PA biosim',       top3Bio[0] ? (top3Bio[0].name.charAt(0) + top3Bio[0].name.slice(1).toLowerCase()) : '—'],
                        ['Pac. con biosim',     top3Bio[0] ? `${fmtInt(top3Bio[0].bio)} / ${fmtInt(top3Bio[0].total)}` : '—'],
                        ['2.º PA biosim',       top3Bio[1] ? (top3Bio[1].name.charAt(0) + top3Bio[1].name.slice(1).toLowerCase()) : '—'],
                        ['3.er PA biosim',      top3Bio[2] ? (top3Bio[2].name.charAt(0) + top3Bio[2].name.slice(1).toLowerCase()) : '—']
                    ]);

                    // === BLOQUE 4: COSTE Y EFICIENCIA ===
                    const b4x = M + bsW + bsGap, b4y = y;
                    card(b4x, b4y, bsW, BS_H, COLOR.amber);
                    blockHeader(b4x, b4y, '€', COLOR.amber, 'Coste y eficiencia', GRAN.descCost);

                    const subW2 = (bsW - 12) / 2;
                    const subTop2 = b4y + 14;
                    const subH2 = BS_H - 16;

                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('Coste total', b4x + 4, subTop2 - 1);

                    const cC1 = document.createElement('canvas');
                    cC1.width = 600; cC1.height = 500;
                    tempDiv.appendChild(cC1);
                    const chC1 = new Chart(cC1, {
                        type: 'bar',
                        data: {
                            labels: chartLabels,
                            datasets: [{
                                data: dataCosteByPeriod,
                                backgroundColor: 'rgba(232, 168, 56, 0.92)',
                                borderRadius: granularity === 'months' ? 1.5 : 3,
                                borderSkipped: false
                            }]
                        },
                        options: {
                            responsive: false, animation: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(226,232,240,0.7)', drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 16 }, callback: v => '€' + (v >= 1_000_000 ? (v / 1_000_000).toFixed(1) + 'M' : (v >= 1000 ? (v / 1000).toFixed(0) + 'K' : v)) } },
                                x: { grid: { display: false, drawBorder: false }, ticks: { color: '#475569', font: { size: tickFontSize, weight: '600' }, maxRotation: labelRotation } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 200));
                    pdf.addImage(cC1.toDataURL('image/png', 1.0), 'PNG', b4x + 4, subTop2, subW2, subH2);
                    chC1.destroy();

                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('Coste por paciente', b4x + 4 + subW2 + 6, subTop2 - 1);

                    const cC2 = document.createElement('canvas');
                    cC2.width = 600; cC2.height = 500;
                    tempDiv.appendChild(cC2);
                    const chC2 = new Chart(cC2, {
                        type: 'bar',
                        data: {

            const getChartOptions = (title, showLegend = false) => ({

            const calculateRacingBarData = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] && row['Servicio Prescriptor']
                );

                // Agrupar por mes y servicio
                const monthlyData = {};
                validData.forEach(row => {
                    const date = row['Fecha Dispensación'];
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const key = `${year}-${month}`;
                    const service = row['Servicio Prescriptor'];

                    if (!monthlyData[key]) monthlyData[key] = {};
                    if (!monthlyData[key][service]) {
                        monthlyData[key][service] = { pacientes: new Set(), visitas: new Set(), dispensaciones: 0, coste: 0 };
                    }

                    monthlyData[key][service].pacientes.add(row['Id']);
                    monthlyData[key][service].visitas.add(`${row['Id']}_${key}`);
                    monthlyData[key][service].dispensaciones += 1;
                    monthlyData[key][service].coste += parseNumES(row['Coste Dispensación']);
                });

                const months = Object.keys(monthlyData).sort();
                const allServices = [...new Set(validData.map(r => r['Servicio Prescriptor']))];
                const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

                // Acumuladores por servicio: pacientes y visitas usan Sets globales para no duplicar
                const cumulative = {};
                allServices.forEach(s => {
                    cumulative[s] = { pacientes: new Set(), visitas: new Set(), dispensaciones: 0, coste: 0 };
                });

                // Construir frames acumulados
                const frames = months.map(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const label = `${monthNames[parseInt(month)-1]} ${year}`;

                    // Sumar el mes actual al acumulado de cada servicio
                    allServices.forEach(service => {
                        const d = monthlyData[monthKey]?.[service];
                        if (d) {
                            d.pacientes.forEach(id => cumulative[service].pacientes.add(id));
                            d.visitas.forEach(v => cumulative[service].visitas.add(v));
                            cumulative[service].dispensaciones += d.dispensaciones;
                            cumulative[service].coste += d.coste;
                        }
                    });

                    const services = allServices.map(service => ({
                        service,
                        pacientes: cumulative[service].pacientes.size,
                        visitas: cumulative[service].visitas.size,
                        dispensaciones: cumulative[service].dispensaciones,
                        coste: cumulative[service].coste
                    }));

                    return { monthKey, label, services };
                });

                return {
                    type: 'racing',
                    title: 'Evolución acumulada por servicio',
                    data: frames,
                    services: allServices
                };
            };
            const calculateRacingBarDataByPA = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] && row['Descripción Principio Activo']
                );

                const monthlyData = {};
                validData.forEach(row => {
                    const date = row['Fecha Dispensación'];
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const key = `${year}-${month}`;
                    const pa = row['Descripción Principio Activo'];

                    if (!monthlyData[key]) monthlyData[key] = {};
                    if (!monthlyData[key][pa]) {
                        monthlyData[key][pa] = { pacientes: new Set(), coste: 0 };
                    }

                    monthlyData[key][pa].pacientes.add(row['Id']);
                    monthlyData[key][pa].coste += parseNumES(row['Coste Dispensación']);
                });

                const months = Object.keys(monthlyData).sort();
                const allPA = [...new Set(validData.map(r => r['Descripción Principio Activo']))].sort();
                const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

                // Acumuladores
                const cumulative = {};
                allPA.forEach(pa => { cumulative[pa] = { pacientes: new Set(), coste: 0 }; });

                const frames = months.map(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const label = `${monthNames[parseInt(month)-1]} ${year}`;

                    allPA.forEach(pa => {
                        const d = monthlyData[monthKey]?.[pa];
                        if (d) {
                            d.pacientes.forEach(id => cumulative[pa].pacientes.add(id));
                            cumulative[pa].coste += d.coste;
                        }
                    });

                    const paValues = allPA.map(pa => ({
                        pa,
                        pacientes: cumulative[pa].pacientes.size,
                        coste: cumulative[pa].coste
                    }));

                    return { monthKey, label, paValues };
                });

                return {
                    type: 'racing-pa',
                    title: 'Evolución acumulada por principio activo',
                    data: frames,
                    allPA
                };
            };

            // Distribución poblacional de adherencia (MPR) — misma metodología que el histórico por paciente
            const calculateAdherenceDistribution = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] != null && String(row['Id']).trim() !== ''
                );
                // Agrupar dispensaciones por paciente
                const byPatient = new Map();
                validData.forEach(row => {
                    const id = String(row['Id']).trim();
                    if (!byPatient.has(id)) byPatient.set(id, []);
                    byPatient.get(id).push(row);
                });

                const mprValues = [];      // MPR de cada tratamiento evaluable
                let noEvaluables = 0;      // tratamientos con <2 disp. o posología no interpretable

                byPatient.forEach(rows => {
                    // Ordenar cronológicamente (y por medicamento en empate)
                    const sorted = rows.filter(r => (parseInt(r['Cantidad']) || 0) > 0).sort((a, b) => {
                        const da = a['Fecha Dispensación'].getTime(), db = b['Fecha Dispensación'].getTime();
                        if (da !== db) return da - db;
                        return (a['Descripción Producto Dispensado'] || '').localeCompare(b['Descripción Producto Dispensado'] || '');
                    });
                    // Agrupar en episodios contiguos por principio activo
                    const tratamientos = [];
                    let cur = null;
                    sorted.forEach(row => {
                        const pa = (row['Descripción Principio Activo'] || 'DESCONOCIDO').trim();
                        if (!cur || cur.pa !== pa) { if (cur) tratamientos.push(cur); cur = { pa, disps: [] }; }
                        cur.disps.push(row);
                    });
                    if (cur) tratamientos.push(cur);

                    tratamientos.forEach(tto => {
                        const disps = tto.disps;
                        if (disps.length < 2) { noEvaluables++; return; }
                        const first = disps[0]['Fecha Dispensación'], last = disps[disps.length - 1]['Fecha Dispensación'];
                        const diasTotales = Math.round((last.getTime() - first.getTime()) / 86400000);
                        if (diasTotales <= 0) { noEvaluables++; return; }
                        let diasCubiertos = 0, noParse = 0;
                        disps.slice(0, -1).forEach(row => {
                            const dias = calcularDiasCubiertos(parseInt(row['Cantidad']) || 0, row['Posología (Según Prescripción)'] || '');
                            if (dias !== null) diasCubiertos += dias; else noParse++;
                        });
                        if (noParse > 0) { noEvaluables++; return; }
                        mprValues.push(diasCubiertos / diasTotales * 100);
                    });
                });

                // Histograma por tramos
                const bins = [
                    { label: '0–20%', min: 0,   max: 20,  color: 'rgba(192,57,43,0.85)' },
                    { label: '20–40%', min: 20,  max: 40,  color: 'rgba(231,76,60,0.8)' },
                    { label: '40–60%', min: 40,  max: 60,  color: 'rgba(230,126,34,0.8)' },
                    { label: '60–80%', min: 60,  max: 80,  color: 'rgba(241,196,15,0.85)' },
                    { label: '80–100%', min: 80, max: 100.0001, color: 'rgba(39,174,96,0.85)' },
                    { label: '>100% (acúmulo)', min: 100.0001, max: Infinity, color: 'rgba(41,128,185,0.8)' }
                ];
                const counts = bins.map(() => 0);
                mprValues.forEach(v => {
                    for (let i = 0; i < bins.length; i++) {
                        if (v >= bins[i].min && v < bins[i].max) { counts[i]++; break; }
                    }
                });

                const n = mprValues.length;
                const sorted = [...mprValues].sort((a, b) => a - b);
                const mediana = n ? (n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2) : 0;
                const media = n ? mprValues.reduce((s, v) => s + v, 0) / n : 0;
                const pctAlta = n ? mprValues.filter(v => v >= 80).length / n * 100 : 0;
                const fmtPct1 = (x) => x.toFixed(1).replace('.', ',') + '%';

                const data = bins.map((b, i) => ({
                    'Tramo de adherencia': b.label,
                    'Tratamientos': counts[i],
                    '% del total': n ? fmtPct1(counts[i] / n * 100) : '0,0%'
                }));

                return {
                    type: 'histogram',
                    title: `Distribución de adherencia (MPR) · ${n} tratamientos evaluables · mediana ${fmtPct1(mediana)} · ${fmtPct1(pctAlta)} con MPR≥80%`,
                    chartData: {
                        labels: bins.map(b => b.label),
                        counts,
                        colors: bins.map(b => b.color),
                        xTitle: 'Tramo de adherencia (MPR)',
                        yTitle: 'Nº de tratamientos'
                    },
                    summary: { n, mediana, media, pctAlta, noEvaluables },
                    data,
                    columnOrder: ['Tramo de adherencia', 'Tratamientos', '% del total'],
                    note: `Un "tratamiento" = episodio contiguo de un mismo principio activo en un paciente. Se excluyen ${noEvaluables} tratamientos no evaluables (menos de 2 dispensaciones, mismo día, o posología no interpretable). MPR = días cubiertos / días entre primera y última dispensación.`
                };
            };

            // Flujos de cambio de tratamiento (switching) entre principios activos
            // selectedSources: Set de fármacos de ORIGEN (A) a incluir. null = todos.
            //   Las trayectorias se calculan SIEMPRE con todas las dispensaciones activas;
            //   el filtro solo restringe qué flujos (aquellos cuyo origen A está seleccionado) se muestran.
            const calculateSwitching = (dataToProcess, selectedSources) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] != null && String(row['Id']).trim() !== '' && row['Descripción Principio Activo']
                );
                const byPatient = new Map();
                validData.forEach(row => {
                    const id = String(row['Id']).trim();
                    if (!byPatient.has(id)) byPatient.set(id, []);
                    byPatient.get(id).push(row);
                });

                const transitions = {};              // "from→to" -> nº ocurrencias
                const patientsBySource = new Map();  // origen A -> Set(idPaciente)

                byPatient.forEach((rows, id) => {
                    const sorted = rows.filter(r => (parseInt(r['Cantidad']) || 0) > 0).sort((a, b) => {
                        const da = a['Fecha Dispensación'].getTime(), db = b['Fecha Dispensación'].getTime();
                        if (da !== db) return da - db;
                        return (a['Descripción Producto Dispensado'] || '').localeCompare(b['Descripción Producto Dispensado'] || '');
                    });
                    // Secuencia de PA en episodios contiguos
                    const seq = [];
                    sorted.forEach(row => {
                        const pa = (row['Descripción Principio Activo'] || 'DESCONOCIDO').trim();
                        if (seq.length === 0 || seq[seq.length - 1] !== pa) seq.push(pa);
                    });
                    for (let i = 0; i < seq.length - 1; i++) {
                        const from = seq[i], to = seq[i + 1];
                        transitions[from + '→' + to] = (transitions[from + '→' + to] || 0) + 1;
                        if (!patientsBySource.has(from)) patientsBySource.set(from, new Set());
                        patientsBySource.get(from).add(id);
                    }
                });

                const allEntries = Object.entries(transitions)
                    .map(([k, v]) => { const [from, to] = k.split('→'); return { from, to, count: v }; })
                    .sort((a, b) => b.count - a.count);

                // Lista de fármacos de ORIGEN disponibles para el menú (los que actúan como A en alguna transición)
                const allSources = [...new Set(allEntries.map(e => e.from))].sort((a, b) => a.localeCompare(b, 'es'));

                // Filtro por fármaco de ORIGEN (A). null => todos los orígenes
                const sel = selectedSources || null;
                const entries = sel ? allEntries.filter(e => sel.has(e.from)) : allEntries;

                // Estadísticas del subconjunto mostrado
                const shownPatients = new Set();
                if (sel) {
                    sel.forEach(s => { const set = patientsBySource.get(s); if (set) set.forEach(id => shownPatients.add(id)); });
                } else {
                    patientsBySource.forEach(set => set.forEach(id => shownPatients.add(id)));
                }
                const shownCambios = entries.reduce((s, e) => s + e.count, 0);

                // Tabla (todos los flujos mostrados)
                const data = entries.map(e => ({
                    'Desde': e.from,
                    'Hacia': e.to,
                    'Pacientes': e.count
                }));

                // Datos para el Sankey (bipartito: nodos origen vs destino para evitar ciclos), top 30 flujos
                const top = entries.slice(0, 30);
                const flows = top.map(e => ({ from: 'src:' + e.from, to: 'dst:' + e.to, flow: e.count }));
                const labels = {};
                top.forEach(e => { labels['src:' + e.from] = e.from; labels['dst:' + e.to] = e.to; });

                const filtroActivo = !!sel;
                const tituloBase = `Cambios de tratamiento · ${shownPatients.size} pacientes cambian · ${shownCambios} cambios · ${entries.length} transiciones distintas`;

                return {
                    type: 'sankey',
                    title: filtroActivo ? tituloBase + ` · filtrado a ${sel.size} fármaco(s) de origen` : tituloBase,
                    sankeyData: { flows, labels },
                    data,
                    columnOrder: ['Desde', 'Hacia', 'Pacientes'],
                    allSources,                          // para poblar el menú de selección de origen
                    sourceFilterCount: sel ? sel.size : 0,
                    note: `Cada flujo representa pacientes que pasaron de un principio activo (izquierda, "origen") a otro (derecha, "destino") en episodios consecutivos de tratamiento. Las trayectorias se calculan con TODAS las dispensaciones activas; el menú "Fármacos de origen (A)" solo restringe qué flujos se muestran (aquellos cuyo origen A está seleccionado), sin alterar el cálculo. El destino B puede ser cualquier fármaco. El diagrama muestra los ${Math.min(30, entries.length)} flujos más frecuentes; la tabla incluye todos los mostrados.`
                };
            };

            const calculatePatientList = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] != null && String(row['Id']).trim() !== ''
                );

                // Agrupar filas por paciente en una sola pasada (evita O(pacientes×filas))
                const rowsById = new Map();
                validData.forEach(row => {
                    const id = row['Id'];
                    if (!rowsById.has(id)) rowsById.set(id, []);
                    rowsById.get(id).push(row);
                });

                // Obtener IDs únicos de pacientes
                const patientIds = [...rowsById.keys()].sort((a, b) => (Number(a) - Number(b)) || String(a).localeCompare(String(b)));

                // Construir descripción de filtros activos
                const activeFilters = [];
                if (filters.year) activeFilters.push(`Año: ${filters.year}`);
                if (filters.service) activeFilters.push(`Servicio: ${filters.service}`);
                if (filters.pathology) activeFilters.push(`Patología: ${filters.pathology}`);
                if (filters.activeIngredient) activeFilters.push(`Principio activo: ${filters.activeIngredient}`);
                    if (paFilterMode === 'selection' && selectedPASet.size > 0) activeFilters.push(`PA seleccionados: ${selectedPASet.size}`);
                if (filters.dateFrom) activeFilters.push(`Desde: ${filters.dateFrom}`);
                if (filters.dateTo) activeFilters.push(`Hasta: ${filters.dateTo}`);
                const filterDesc = activeFilters.length > 0 ? activeFilters.join(' | ') : 'Sin filtros (todos los registros)';

                // Crear datos de tabla: cada fila es un paciente con su resumen
                const tableData = patientIds.map(id => {
                    const patientRows = rowsById.get(id);
                    const dispensaciones = patientRows.length;
                    const costeTotal = patientRows.reduce((sum, row) => sum + (parseNumES(row['Coste Dispensación'])), 0);
                    const principiosActivos = [...new Set(patientRows.map(row => row['Descripción Principio Activo']).filter(Boolean))].join(', ');
                    const servicios = [...new Set(patientRows.map(row => row['Servicio Prescriptor']).filter(Boolean))].join(', ');
                    const fechas = patientRows.map(row => row['Fecha Dispensación']).filter(Boolean).sort((a, b) => a - b);
                    const primeraFecha = fechas.length > 0 ? fechas[0].toLocaleDateString('es-ES') : '-';
                    const ultimaFecha = fechas.length > 0 ? fechas[fechas.length - 1].toLocaleDateString('es-ES') : '-';

                    return {
                        'Id Paciente': id,
                        'Dispensaciones': dispensaciones,
                        'Coste Total': Math.round(costeTotal * 100) / 100,
                        'Principios Activos': principiosActivos,
                        'Servicios': servicios,
                        'Primera Disp.': primeraFecha,
                        'Última Disp.': ultimaFecha
                    };
                });

                return {
                    type: 'patientList',
                    title: `Listado de pacientes (${patientIds.length}) — ${filterDesc}`,
                    data: tableData,
                    headers: ['Id Paciente', 'Dispensaciones', 'Coste Total', 'Principios Activos', 'Servicios', 'Primera Disp.', 'Última Disp.']
                };
            };

            const processOption = (concept) => {
                if (!data) {
                    alert('Por favor, carga un archivo Excel primero');
                    return;
                }

                setLoading(true);
                setSelectedOption(concept);

                setTimeout(() => {
                    const dataToProcess = applyFilters() || data;
                    let result;
                    const g = analysisGranularity;

                    switch(concept) {
                        case 'global':
                            if (g === 'years')         result = calculateByYears(dataToProcess);
                            else if (g === 'quarters') result = calculateByQuarters(dataToProcess);
                            else if (g === 'months')   result = calculateByMonths(dataToProcess);
                            else                       result = calculateTotals(dataToProcess);
                            break;
                        case 'pa':
                            if (g === 'years')         result = calculatePatientsByActiveIngredientByYear(dataToProcess);
                            else if (g === 'quarters') result = calculatePatientsByActiveIngredientByQuarter(dataToProcess);
                            else if (g === 'months')   result = calculatePatientsByActiveIngredientByMonth(dataToProcess);
                            else                       result = calculatePatientsByActiveIngredientTotal(dataToProcess);
                            break;
                        case 'biosim':
                            if (g === 'years')         result = calculateBiosimilarPatientsByYear(dataToProcess);
                            else if (g === 'quarters') result = calculateBiosimilarPatientsByQuarter(dataToProcess);
                            else if (g === 'months')   result = calculateBiosimilarPatientsByMonth(dataToProcess);
                            else                       result = calculateBiosimilarPatientsTotal(dataToProcess);
                            break;
                        case 'consumo':
                            if (g === 'years')         result = calculateUnitsAndCostByProductByYear(dataToProcess);
                            else if (g === 'quarters') result = calculateUnitsAndCostByProductByQuarter(dataToProcess);
                            else if (g === 'months')   result = calculateUnitsAndCostByProductByMonth(dataToProcess);
                            else                       result = calculateUnitsAndCostByProductTotal(dataToProcess);
                            break;
                        case 'coste':
                            if (g === 'years')         result = calculateCostPerPatientByYear(dataToProcess);
                            else if (g === 'quarters') result = calculateCostPerPatientByQuarter(dataToProcess);
                            else if (g === 'months')   result = calculateCostPerPatientByMonth(dataToProcess);
                            else                       result = calculateCostPerPatientTotal(dataToProcess);
                            break;
                        case 'pareto-coste':
                            result = calculateCostPareto(dataToProcess);
                            break;
                        case 'adherencia':
                            result = calculateAdherenceDistribution(dataToProcess);
                            break;
                        case 'switching':
                            result = calculateSwitching(dataToProcess, sankeySrcSet);
                            break;
                        case 'pathways': {
                            let sd = pathStartDate;
                            if (!sd) { sd = defaultPathStart(dataToProcess); if (sd) setPathStartDate(sd); }
                            result = calculatePathways(dataToProcess, { startDate: sd, cohort: pathCohort, nLines: pathLines, sources: pathSrcSet });
                            break;
                        }
                        case 'combinados':
                            result = calculateCombinedTreatments(dataToProcess);
                            break;
                        case 'nuevos':
                            result = calculateNewVsRecurringPatients(dataToProcess);
                            break;
                        case 'interanual':
                            result = calculateYearComparison(dataToProcess);
                            break;
                        case 'heatmap':
                            result = calculateActivityHeatmap(dataToProcess);
                            break;
                        case 'pacientes':
                            result = calculatePatientList(dataToProcess);
                            break;
                        case 'racing':
                            result = calculateRacingBarData(dataToProcess);
                            break;
                        case 'racing-pa':
                            result = calculateRacingBarDataByPA(dataToProcess);
                            break;
                        default:
                            result = { type: 'custom', data: [], title: 'Análisis Personalizado' };
                    }

                    setResults(result);
                    setLoading(false);

                    setTimeout(() => {
                        const canvas = document.getElementById('analysisChart');
                        if (canvas && result && result.data && result.data.length > 0) {
                            createAnalysisChart(result, 'analysisChart');
                        }
                    }, 600);
                }, 500);
            };

            // Recalcula y redibuja el Sankey de switching con un nuevo conjunto de fármacos de origen (A).
            // nextSet: Set de orígenes seleccionados, o null = todos. Las trayectorias no se alteran.
            const recomputeSankey = (nextSet) => {
                setSankeySrcSet(nextSet);
                if (!data) return;
                const dataToProcess = applyFilters() || data;
                const result = calculateSwitching(dataToProcess, nextSet);
                setResults(result);
                setTimeout(() => {
                    if (document.getElementById('analysisChart')) {
                        createAnalysisChart(result, 'analysisChart');
                    }
                }, 80);
            };

            // Primera fecha de dispensación válida de un dataset cualquiera
            const firstDateOf = (arr) => {
                let m = null;
                (arr || []).forEach(r => {
                    const d = r['Fecha Dispensación'];
                    if (d instanceof Date && !isNaN(d)) { if (!m || d < m) m = d; }
                });
                return m;
            };

            // Fecha de inicio por defecto para el criterio naïve = primera dispensación activa + lavado (4 meses)
            const defaultPathStart = (dataToProcess) => {
                const first = firstDateOf(dataToProcess);
                if (!first) return '';
                const d = new Date(first);
                d.setMonth(d.getMonth() + PERSIST_WASHOUT_MONTHS);
                // Formato YYYY-MM-DD con componentes locales (evita desfase por zona horaria)
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${d.getFullYear()}-${mm}-${dd}`;
            };

            // Esquemas de tratamiento a lo largo del tiempo (Sankey multinivel por línea).
            // Las trayectorias usan TODAS las dispensaciones activas. El nodo de entrada distingue
            // naïve (1ª dispensación >= fecha de inicio, con lookback) de prevalente (ya en tto).
            // params: { startDate:'YYYY-MM-DD', cohort:'all'|'naive'|'noNaive', nLines:number, sources:Set|null }
            //   sources = fármacos de ORIGEN (L1) a incluir; solo se dibujan trayectorias cuyo
            //   primer tratamiento (L1) está en la selección. Las líneas siguientes pueden ser cualquiera.
            const calculatePathways = (dataToProcess, params) => {
                const f = 'Descripción Principio Activo';
                const N = Math.max(2, Math.min(8, parseInt(params.nLines) || 4));
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] instanceof Date && !isNaN(row['Fecha Dispensación']) &&
                    row['Id'] != null && String(row['Id']).trim() !== '' && row[f]
                );

                const startStr = params.startDate || defaultPathStart(validData);
                const startDate = startStr ? new Date(startStr + 'T00:00:00') : null;

                const byPatient = new Map();
                validData.forEach(row => {
                    if ((parseInt(row['Cantidad']) || 0) <= 0) return; // ignorar devoluciones
                    const id = String(row['Id']).trim();
                    if (!byPatient.has(id)) byPatient.set(id, []);
                    byPatient.get(id).push(row);
                });

                const flowMap = new Map();   // "from|||to" -> nº pacientes
                const labels = {};           // nodeId -> etiqueta visible
                const columns = {};          // nodeId -> índice de columna
                const sourceSet = new Set(); // fármacos de origen (L1) disponibles para el menú
                const addFlow = (from, to) => { const k = from + '|||' + to; flowMap.set(k, (flowMap.get(k) || 0) + 1); };
                const reg = (id, col, label) => { columns[id] = col; labels[id] = label; };

                const selSrc = params.sources || null; // null = todos los orígenes; Set (aunque vacío) = solo los seleccionados

                let nPacientes = 0, nNaive = 0, nPrev = 0, nBeyond = 0;

                byPatient.forEach((rows) => {
                    rows.sort((a, b) => {
                        const da = a['Fecha Dispensación'].getTime(), db = b['Fecha Dispensación'].getTime();
                        if (da !== db) return da - db;
                        return (a['Descripción Producto Dispensado'] || '').localeCompare(b['Descripción Producto Dispensado'] || '');
                    });
                    // Secuencia de PA en episodios contiguos
                    const seq = [];
                    rows.forEach(row => {
                        const pa = (row[f] || 'DESCONOCIDO').trim();
                        if (seq.length === 0 || seq[seq.length - 1] !== pa) seq.push(pa);
                    });
                    if (seq.length === 0) return;

                    // Fármaco de origen (L1) del paciente — disponible en el menú independientemente de los filtros
                    sourceSet.add(seq[0]);

                    const firstDisp = rows[0]['Fecha Dispensación'];
                    const naive = startDate ? (firstDisp >= startDate) : true;

                    if (params.cohort === 'naive' && !naive) return;
                    if (params.cohort === 'noNaive' && naive) return;

                    // Filtro por fármaco de ORIGEN (L1): solo trayectorias cuyo primer tratamiento está seleccionado
                    if (selSrc && !selSrc.has(seq[0])) return;

                    nPacientes++; if (naive) nNaive++; else nPrev++;

                    const entryLabel = naive ? 'Naïve' : 'Prevalente';
                    const entryId = 'c0|' + entryLabel;
                    reg(entryId, 0, entryLabel);

                    // Entrada → L1
                    const l1Id = 'c1|' + seq[0];
                    reg(l1Id, 1, seq[0]);
                    addFlow(entryId, l1Id);

                    // L1 → L2 → … hasta N columnas de fármaco
                    const lim = Math.min(N, seq.length);
                    for (let j = 1; j < lim; j++) {
                        const aId = 'c' + j + '|' + seq[j - 1];
                        const bId = 'c' + (j + 1) + '|' + seq[j];
                        reg(aId, j, seq[j - 1]);
                        reg(bId, j + 1, seq[j]);
                        addFlow(aId, bId);
                    }

                    // Cambios más allá de la última línea mostrada → nodo agrupado
                    if (seq.length > N) {
                        nBeyond++;
                        const aId = 'c' + N + '|' + seq[N - 1];
                        const postId = 'c' + (N + 1) + '|posteriores';
                        reg(aId, N, seq[N - 1]);
                        reg(postId, N + 1, '⋯ posteriores');
                        addFlow(aId, postId);
                    }
                });

                const flows = [...flowMap.entries()]
                    .map(([k, v]) => { const [from, to] = k.split('|||'); return { from, to, flow: v }; })
                    .sort((a, b) => b.flow - a.flow);

                // Tabla legible
                const colName = (c) => c === 0 ? 'Inicio' : (c === N + 1 ? 'Posteriores' : 'L' + c);
                const dataTable = flows.map(fl => ({
                    'Etapa desde': colName(columns[fl.from]),
                    'Desde': labels[fl.from],
                    'Etapa hacia': colName(columns[fl.to]),
                    'Hacia': labels[fl.to],
                    'Pacientes': fl.flow
                }));

                const cohLabel = params.cohort === 'naive' ? 'solo naïve' : (params.cohort === 'noNaive' ? 'solo no-naïve' : 'naïve + prevalentes');
                const fechaTxt = startDate ? startDate.toLocaleDateString('es-ES') : '—';
                const allSources = [...sourceSet].sort((a, b) => a.localeCompare(b, 'es'));
                const srcTxt = selSrc ? ` · origen (L1) filtrado a ${selSrc.size} fármaco(s)` : '';

                return {
                    type: 'pathway',
                    title: `Esquemas de tratamiento · ${nPacientes} pacientes (${nNaive} naïve / ${nPrev} prevalentes) · ${N} líneas · ${cohLabel}${srcTxt}`,
                    sankeyData: { flows, labels, columns },
                    data: dataTable,
                    columnOrder: ['Etapa desde', 'Desde', 'Etapa hacia', 'Hacia', 'Pacientes'],
                    allSources,                          // fármacos de inicio (L1) para el menú de origen
                    sourceFilterCount: selSrc ? selSrc.size : 0,
                    note: `Cada trayectoria se construye con TODAS las dispensaciones activas: L1 = primer tratamiento observado, L2 = tras el 1.er cambio, y así sucesivamente (se muestran ${N} líneas; los cambios posteriores se agrupan en "posteriores", ${nBeyond} pacientes). El nodo de entrada distingue "Naïve" (primera dispensación ≥ ${fechaTxt}, con ≥${PERSIST_WASHOUT_MONTHS} meses de lookback, criterio del bloque de persistencia) de "Prevalente" (ya en tratamiento al inicio de la ventana). El menú "Fármacos de origen (L1)" restringe qué trayectorias se muestran según su primer tratamiento; las líneas posteriores pueden ser cualquier fármaco. Cada flujo = nº de pacientes que siguen esa transición entre líneas.`
                };
            };

            // Recalcula y redibuja el Sankey de esquemas de tratamiento con nuevos parámetros.
            const recomputePathway = (ov = {}) => {
                const startDate = ov.startDate !== undefined ? ov.startDate : pathStartDate;
                const cohort = ov.cohort !== undefined ? ov.cohort : pathCohort;
                const nLines = ov.nLines !== undefined ? ov.nLines : pathLines;
                const sources = ov.sources !== undefined ? ov.sources : pathSrcSet;
                if (ov.startDate !== undefined) setPathStartDate(ov.startDate);
                if (ov.cohort !== undefined) setPathCohort(ov.cohort);
                if (ov.nLines !== undefined) setPathLines(ov.nLines);
                if (ov.sources !== undefined) setPathSrcSet(ov.sources);
                if (!data) return;

                );

                const dispensationsByPatientDate = {};
                
                validData.forEach(row => {
                    const patientId = row['Id'];
                    const dateStr = row['Fecha Dispensación'].toISOString().split('T')[0];
                    const key = `${patientId}_${dateStr}`;
                    const principioActivo = row['Descripción Principio Activo'];
                    
                    if (!dispensationsByPatientDate[key]) {
                        dispensationsByPatientDate[key] = {
                            patientId: patientId,
                            date: dateStr,

                        };
                    }
                    
                    dispensationsByPatientDate[key].principiosActivos.add(principioActivo);
                    dispensationsByPatientDate[key].rows.push(row);
                });

                // Identificar combinaciones (pacientes con más de 1 principio activo en la misma fecha)
                const combinationsMap = {};
                
                Object.values(dispensationsByPatientDate).forEach(group => {
                    if (group.principiosActivos.size > 1) {
                        // Crear clave de combinación ordenada alfabéticamente
                        const paArray = Array.from(group.principiosActivos).sort();
                        const combinationKey = paArray.join(' + ');
                        
                        if (!combinationsMap[combinationKey]) {
                            combinationsMap[combinationKey] = new Set();

            const calculateNewVsRecurringPatients = (dataToProcess) => {

                );

                // Encontrar el primer año de cada paciente
                const patientFirstYear = {};
                validData.forEach(row => {

                    if (!patientFirstYear[patientId] || year < patientFirstYear[patientId]) {

                    const patientId = row['Id'];
                    if (!yearData[year]) {
                        yearData[year] = { nuevos: new Set(), recurrentes: new Set() };
                    }
                    if (patientFirstYear[patientId] === year) {
                        yearData[year].nuevos.add(patientId);
                    } else {
                        yearData[year].recurrentes.add(patientId);
                    }
                });

                const sortedYears = Object.keys(yearData).sort();

                    const nuevos = yearData[year].nuevos.size;
                    const recurrentes = yearData[year].recurrentes.size;
                    const total = nuevos + recurrentes;
                    const pctNuevos = total > 0 ? ((nuevos / total) * 100).toFixed(1) : '0.0';

                    // Variación de nuevos respecto al año anterior
                    const prevNuevos = idx > 0 ? yearData[sortedYears[idx-1]].nuevos.size : null;
                    const varNuevos = calculateVariation(nuevos, prevNuevos);

            const calculateYearComparison = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] != null && String(row['Id']).trim() !== ''
                );

                // Agrupar datos por año
                const yearData = {};
                validData.forEach(row => {
                    const year = row['Fecha Dispensación'].getFullYear();
                    if (!yearData[year]) {
                        yearData[year] = {
                            ids: new Set(),
                            visitas: new Set(),
                            dispensaciones: 0,
                            coste: 0
                        };
                    }
                    yearData[year].ids.add(row['Id']);
                    yearData[year].visitas.add(`${row['Id']}_${row['Fecha Dispensación'].toISOString().split('T')[0]}`);
                    yearData[year].dispensaciones++;
                    yearData[year].coste += parseNumES(row['Coste Dispensación']);
                });

                const sortedYears = Object.keys(yearData).sort();

                // Crear comparativa entre años consecutivos
                const results = [];
                for (let i = 1; i < sortedYears.length; i++) {
                    const prevYear = sortedYears[i - 1];
                    const currYear = sortedYears[i];

                    const prev = yearData[prevYear];
                    const curr = yearData[currYear];

                    // Variación porcentual segura: null si el periodo previo es 0 (evita Infinity/NaN)
                    const pct = (diff, base) => base > 0 ? (diff / base * 100) : null;
                    const fmtPct = (n) => n === null ? '—' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
                    const trend = (n) => n === null ? '→' : (n > 2 ? '↑' : (n < -2 ? '↓' : '→'));

                    const pacientesDiff = curr.ids.size - prev.ids.size;
                    const pacientesPctN = pct(pacientesDiff, prev.ids.size);
                    const costeDiff = curr.coste - prev.coste;
                    const costePctN = pct(costeDiff, prev.coste);

                    results.push({
                        'Comparación': `${prevYear} → ${currYear}`,
                        [`Pac. ${prevYear}`]: prev.ids.size,
                        [`Pac. ${currYear}`]: curr.ids.size,
                        'Dif. Pac.': (pacientesDiff >= 0 ? '+' : '') + pacientesDiff,
                        '% Var. Pac.': fmtPct(pacientesPctN),
                        'Tendencia': trend(pacientesPctN),
                        [`Coste ${prevYear}`]: '€' + prev.coste.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 0}),
                        [`Coste ${currYear}`]: '€' + curr.coste.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 0}),
                        '% Var. Coste': fmtPct(costePctN)
                    });
                }

                return {
                    type: 'year_comparison',
                    title: 'Comparativa Interanual',
                    data: results,
                    chartType: 'grouped_bar'
                };
            };

            const calculateBiosimilarPatientsTotal = (dataToProcess) => {
                const validData = dataToProcess.filter(row =>
                    row['Fecha Dispensación'] && row['Id'] && row['Descripción Producto Dispensado']
                );

                const paConBiosimilar = new Set(Object.values(BIOSIMILAR_PA_MAP));
                const paPatsBio   = {}; const paPatsTotal = {};
                const paCosBio    = {}; const paCosTotal  = {}; // coste bio / coste total PA
                const bioData     = {}; // producto → { pats: Set, coste }

                validData.forEach(row => {
                    const coste  = parseNumES(row['Coste Dispensación']);
                    const bioKey = getBiosimilarKey(row['Descripción Producto Dispensado']);
                    const paCanon = bioKey
                        ? BIOSIMILAR_PA_MAP[bioKey]
                        : (() => {
                            const paRaw = (row['Descripción Principio Activo'] || '').toUpperCase();
                            for (const pa of paConBiosimilar) {
                                if (paRaw.includes(pa.toUpperCase()) || pa.toUpperCase().includes(paRaw)) return pa;
                            }
                            return null;
                        })();

                    if (paCanon) {
                        if (!paPatsTotal[paCanon]) paPatsTotal[paCanon] = new Set();
                        paPatsTotal[paCanon].add(row['Id']);
                        paCosTotal[paCanon] = (paCosTotal[paCanon] || 0) + coste;
                    }

                    if (bioKey) {
                        const pa = BIOSIMILAR_PA_MAP[bioKey];
                        if (!paPatsBio[pa]) paPatsBio[pa] = new Set();
                        paPatsBio[pa].add(row['Id']);
                        paCosBio[pa] = (paCosBio[pa] || 0) + coste;
                        const prod = row['Descripción Producto Dispensado'];
                        if (!bioData[prod]) bioData[prod] = { pats: new Set(), coste: 0 };
                        bioData[prod].pats.add(row['Id']);
                        bioData[prod].coste += coste;
                    }
                });

                const fmt2 = v => v.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';

                const byProduct = Object.keys(bioData)

                        'Coste (€)': fmt2(bioData[p].coste)
                    }))
                    .sort((a, b) => bioData[b['Biosimilar']].coste - bioData[a['Biosimilar']].coste);

                const byPA = Object.keys(paPatsBio).map(pa => {
                    const conBio  = paPatsBio[pa].size;
                    const total   = paPatsTotal[pa] ? paPatsTotal[pa].size : conBio;
                    const cosBio  = paCosBio[pa]    || 0;
                    const cosTot  = paCosTotal[pa]  || cosBio;
                    return {
                        'Principio Activo':  pa,
                        'Pac. biosimilar':   conBio,
                        'Pac. total PA':     total,
                        'Penetración (%)':   total > 0 ? ((conBio / total) * 100).toFixed(1) : '0.0',

                const productData = {};

                    if (!productData[producto]) productData[producto] = 0;
                    productData[producto] += parseNumES(row['Coste Dispensación']);
                });
                const sorted = Object.entries(productData)
                    .filter(([, c]) => c > 0)
                    .sort((a, b) => b[1] - a[1]);
                const totalCoste = sorted.reduce((s, [, c]) => s + c, 0);

                const fmtEuro = (n) => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
                const fmtPct = (n) => n.toFixed(1).replace('.', ',') + '%';

                let acumulado = 0;
                let umbral80 = null; // nº de productos que acumulan el 80% del gasto
                const data = sorted.map(([producto, coste], i) => {
                    acumulado += coste;
                    const pctAcum = totalCoste > 0 ? (acumulado / totalCoste * 100) : 0;
                    if (umbral80 === null && pctAcum >= 80) umbral80 = i + 1;
                    return {
                        'Producto': producto,
                        'Coste (€)': fmtEuro(coste),
                        '% del total': fmtPct(totalCoste > 0 ? coste / totalCoste * 100 : 0),
                        '% acumulado': fmtPct(pctAcum),
                        'Clase ABC': pctAcum <= 80 ? 'A' : (pctAcum <= 95 ? 'B' : 'C')
                    };

                // Datos crudos para el gráfico (limitado a los primeros 20 para legibilidad)
                const topN = sorted.slice(0, 20);

                const chartData = {

                };

                return {
                    type: 'pareto',

                    data,

                        const cTot = paCosTotal[pa]?.[m] || 0;
                        row[`${m} Bio`]     = bio; row[`${m} Total`]  = tot;
                        row[`${m} %Pac`]    = tot  > 0 ? ((bio/tot)*100).toFixed(1)+'%'   : '–';
                        row[`${m} € Bio`]  = fmt2(cBio); row[`${m} € Tot`]  = fmt2(cTot);
                        row[`${m} %€`] = cTot > 0 ? ((cBio/cTot)*100).toFixed(1)+'%' : '–';
                        if (paDataBio[pa]?.[m])   paDataBio[pa][m].forEach(id => totBioPats.add(id));
                        if (paDataTotal[pa]?.[m]) paDataTotal[pa][m].forEach(id => totAllPats.add(id));
                        totBioCos += cBio; totAllCos += cTot;
                    });
                    row['Total Bio']      = totBioPats.size; row['Total Pac.']    = totAllPats.size;
                    row['% Pac Global']   = totAllPats.size > 0 ? ((totBioPats.size/totAllPats.size)*100).toFixed(1)+'%' : '–';
                    row['€ Bio']     = fmt2(totBioCos);  row['€ Total']  = fmt2(totAllCos);
                    row['% € Global'] = totAllCos > 0 ? ((totBioCos/totAllCos)*100).toFixed(1)+'%' : '–';
                    return row;
                }).sort((a, b) => b['Total Bio'] - a['Total Bio']);

            const calculateUnitsAndCostByProductByYear = (dataToProcess) => {

                            grouped = true;
                            break;
                        }

                    const year = row['Fecha Dispensación'].getFullYear();
                    
                    if (!productData[producto]) {
                        productData[producto] = {};
                    }
                    if (!productData[producto][year]) {
                        productData[producto][year] = {
                            unidades: 0,
                            coste: 0
                        };
                    }
                    
                    productData[producto][year].unidades += parseInt(row['Cantidad']) || 0;
                    productData[producto][year].coste += parseNumES(row['Coste Dispensación']);
                });

                const years = [...new Set(validData.map(row => 
                    row['Fecha Dispensación'].getFullYear()
                ))].sort();
