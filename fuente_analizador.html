            const calculateServiceDistribution = (dataToProcess) => {
                console.log('🔍 Calculando distribución');
                console.log('Total filas:', dataToProcess.length);
                
                if (dataToProcess.length === 0) {
                    return { services: [] };
                }
                
                // Detectar columna (Patología primero, luego Servicio Prescriptor)
                const firstRow = dataToProcess[0];
                let column = null;
                
                const possibleColumns = [
                    'Servicio Prescriptor', 'SERVICIO_PRESCRIPTOR',
                    'SERVICIO', 'Servicio', 'servicio',
                    'Patología', 'PATOLOGIA', 'patologia'
                ];
                
                for (let col of possibleColumns) {
                    if (firstRow.hasOwnProperty(col)) {
                        column = col;
                        console.log('✅ Usando columna:', column);
                        break;
                    }
                }
                
                if (!column) {
                    console.error('❌ No se encontró columna');
                    return { services: [] };
                }
                
                const validData = dataToProcess.filter(row => 
                    row['Fecha Dispensación'] && row[column] && row['Id']
                );
                
                console.log('Filas válidas:', validData.length);
                
                // Contar pacientes únicos
                const categoryPatients = {};
                validData.forEach(row => {
                    const cat = row[column];
                    if (cat) {
                        if (!categoryPatients[cat]) {
                            categoryPatients[cat] = new Set();
                        }
                        categoryPatients[cat].add(row['Id']);
                    }
                });
                
                const services = Object.keys(categoryPatients)
                    .map(cat => ({
                        service: cat,
                        count: categoryPatients[cat].size
                    }))
                    .sort((a, b) => b.count - a.count);
                
                console.log('📊 Total categorías:', services.length);
                console.log('Top 3:', services.slice(0, 3));
                
                return { services };
            };

            // Función para añadir encabezado con logo a los PDFs
            const addPDFHeader = (pdf, title, pageNum = 1) => {
                const pageWidth = 210;
                const margin = 15;
                let hasLogo = false;

                // Si hay logo, añadirlo en la esquina superior izquierda
                if (HOSPITAL_LOGO_BASE64) {
                    try {
                        pdf.addImage(HOSPITAL_LOGO_BASE64, 'PNG', margin, 6, 28, 14);
                        hasLogo = true;
                    } catch (e) {
                        hasLogo = false;
                    }
                }

                // Título principal
                pdf.setFontSize(16);
                pdf.setFont('helvetica', 'bold');
                pdf.setTextColor(102, 126, 234);
                const titleX = hasLogo ? pageWidth / 2 + 12 : pageWidth / 2;
                pdf.text(title, titleX, 13, { align: 'center' });

                // Subtítulo hospital
                pdf.setFontSize(10);
                pdf.setFont('helvetica', 'normal');
                pdf.setTextColor(80, 80, 80);
                pdf.text('VIGIA-IMID · Hospital Universitari i Politècnic La Fe', titleX, 20, { align: 'center' });

                // Línea decorativa bajo el encabezado
                pdf.setDrawColor(102, 126, 234);
                pdf.setLineWidth(0.5);
                pdf.line(margin, 26, pageWidth - margin, 26);

                pdf.setTextColor(0, 0, 0);
            };

            // Función para generar resumen ejecutivo
            const generateExecutiveSummary = (dataToProcess) => {
                const totals = calculateGlobalTotals(dataToProcess);
                const yearData = calculateByYears(dataToProcess);
                const paData = calculatePatientsByActiveIngredientByYear(dataToProcess);
                const bioData = calculateBiosimilarPenetration(dataToProcess);

                const insights = [];

                // Métricas principales
                insights.push(`Total de ${totals.pacientes.toLocaleString('es-ES')} pacientes atendidos con ${totals.dispensaciones.toLocaleString('es-ES')} dispensaciones.`);
                insights.push(`Coste total acumulado: €${totals.coste.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 0})}.`);

                // Tendencia de pacientes
                if (yearData.data && yearData.data.length >= 2) {
                    const lastYear = yearData.data[yearData.data.length - 1];
                    const prevYear = yearData.data[yearData.data.length - 2];
                    const change = ((lastYear.Pacientes - prevYear.Pacientes) / prevYear.Pacientes * 100).toFixed(1);
                    if (parseFloat(change) > 0) {
                        insights.push(`Incremento del ${change}% en pacientes respecto al período anterior.`);
                    } else if (parseFloat(change) < 0) {
                        insights.push(`Reducción del ${Math.abs(change)}% en pacientes respecto al período anterior.`);
                    }
                }

                // Top principio activo
                if (paData.data && paData.data.length > 0) {
                    const topPA = paData.data[0];
                    insights.push(`Principio activo más prescrito: ${topPA['Principio Activo']} (${topPA.TOTAL} pacientes).`);
                }

                // Penetración de biosimilares
                if (bioData.percentages && bioData.percentages.length > 0) {
                    const lastBioPercentage = Number(bioData.percentages[bioData.percentages.length - 1]) || 0;
                    insights.push(`Penetración actual de biosimilares: ${lastBioPercentage.toFixed(1).replace('.', ',')}%.`);
                }

                return insights;
            };

            // Función para añadir resumen ejecutivo al PDF
            const addExecutiveSummaryToPDF = (pdf, dataToProcess, yStart) => {
                const margin = 15;
                const insights = generateExecutiveSummary(dataToProcess);
                let y = yStart;

                pdf.setFillColor(245, 247, 250);
                pdf.roundedRect(margin, y, 180, 6 + (insights.length * 5), 3, 3, 'F');

                y += 5;
                pdf.setFontSize(9);
                pdf.setFont('helvetica', 'bold');
                pdf.setTextColor(102, 126, 234);
                pdf.text('Resumen ejecutivo', margin + 3, y);

                y += 5;
                pdf.setFontSize(8);
                pdf.setFont('helvetica', 'normal');
                pdf.setTextColor(60, 60, 60);
                insights.forEach((insight, i) => {
                    pdf.text('• ' + insight, margin + 3, y);
                    y += 5;
                });

                pdf.setTextColor(0, 0, 0);
                return y + 3;
            };

            // Función para añadir pie de página profesional a todos los PDFs
            const addPDFFooter = (pdf) => {
                const totalPages = pdf.internal.getNumberOfPages();
                const fecha = new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });

                for (let i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);

                    // Línea separadora
                    pdf.setDrawColor(200, 200, 200);
                    pdf.setLineWidth(0.3);
                    pdf.line(15, 282, 195, 282);

                    // Pie de página izquierdo - Institución
                    pdf.setFontSize(7);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setTextColor(120, 120, 120);
                    pdf.text('Hospital Universitari i Politècnic La Fe', 15, 287);
                    pdf.text('Servicio de Farmacia Hospitalaria', 15, 291);

                    // Pie de página centro - Fecha
                    pdf.text(`Generado: ${fecha}`, 105, 287, { align: 'center' });

                    // Pie de página derecho - Número de página
                    pdf.text(`Página ${i} de ${totalPages}`, 195, 287, { align: 'right' });

                    // Disclaimer
                    pdf.setFontSize(6);
                    pdf.setTextColor(150, 150, 150);
                    pdf.text('Documento generado automáticamente. Los datos son de uso interno y confidencial.', 105, 294, { align: 'center' });

                    pdf.setTextColor(0, 0, 0);
                }
            };

            // ============================================================
            // INFORME INDIVIDUAL DE PACIENTE — PDF
            // ============================================================
            const generatePatientReportPDF = async (patient, activeFilters) => {
                if (!patient || !patient.found) {
                    alert('No hay datos del paciente para generar el informe.');
                    return;
                }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = 210;
                const pageHeight = 297;
                const M = 15;                  // margen lateral
                const contentW = pageWidth - 2 * M;
                const BOTTOM_LIMIT = 275;      // por encima del footer

                // Color institucional (mismo violeta/azul del resto de PDFs)
                const C_PRIM = [102, 126, 234];        // azul-violeta primario
                const C_DARK = [27, 67, 84];           // azul oscuro
                const C_GREEN = [40, 167, 69];
                const C_ORANGE = [230, 126, 34];
                const C_RED = [192, 57, 43];
                const C_GREY_BG = [245, 247, 250];
                const C_GREY_LINE = [220, 225, 232];
                const C_TEXT = [44, 62, 80];
                const C_TEXT_SOFT = [93, 109, 126];

                // Helper para asegurar espacio antes de pintar un bloque
                const ensureSpace = (currentY, needed) => {
                    if (currentY + needed > BOTTOM_LIMIT) {
                        pdf.addPage();
                        addPDFHeader(pdf, 'Informe individual de paciente');
                        return 35;
                    }
                    return currentY;
                };

                // ── Cabecera de la primera página ──
                addPDFHeader(pdf, 'Informe individual de paciente');
                let y = 35;

                // ── Bandera con ID del paciente ──
                pdf.setFillColor(...C_PRIM);
                pdf.roundedRect(M, y, contentW, 16, 3, 3, 'F');
                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(9);
                pdf.setFont('helvetica', 'normal');
                pdf.text('PACIENTE', M + 4, y + 6);
                pdf.setFontSize(15);
                pdf.setFont('helvetica', 'bold');
                pdf.text(`ID ${patient.id}`, M + 4, y + 13);
                // Datos a la derecha de la bandera
                pdf.setFontSize(8);
                pdf.setFont('helvetica', 'normal');
                pdf.text(`${patient.dispensaciones.length} dispensaciones`, pageWidth - M - 4, y + 6, { align: 'right' });
                pdf.text(`${patient.tratamientos.length} tratamiento${patient.tratamientos.length !== 1 ? 's' : ''}`, pageWidth - M - 4, y + 11, { align: 'right' });
                if (patient.devoluciones) {
                    pdf.text(`${patient.devoluciones.length} devoluci${patient.devoluciones.length !== 1 ? 'ones' : 'ón'}`, pageWidth - M - 4, y + 14, { align: 'right' });
                }
                y += 22;

                // ── Filtros activos (si los hay) ──
                const filterChips = [];
                if (activeFilters) {
                    if (activeFilters.year) filterChips.push(`Año: ${activeFilters.year}`);
                    if (activeFilters.service) filterChips.push(`Servicio: ${activeFilters.service}`);
                    if (activeFilters.pathology) filterChips.push(`Patología: ${activeFilters.pathology}`);
                    if (activeFilters.activeIngredient) filterChips.push(`PA: ${activeFilters.activeIngredient}`);
                    if (activeFilters.dateFrom) filterChips.push(`Desde: ${activeFilters.dateFrom}`);
                    if (activeFilters.dateTo) filterChips.push(`Hasta: ${activeFilters.dateTo}`);
                }
                if (filterChips.length > 0) {
                    pdf.setFillColor(234, 242, 248);
                    pdf.roundedRect(M, y, contentW, 10, 2, 2, 'F');
                    pdf.setTextColor(...C_DARK);
                    pdf.setFontSize(7);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text('FILTROS APLICADOS', M + 3, y + 4);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(8);
                    pdf.text(filterChips.join('  ·  '), M + 3, y + 8);
                    y += 14;
                } else {
                    pdf.setFontSize(7);
                    pdf.setTextColor(...C_TEXT_SOFT);
                    pdf.setFont('helvetica', 'italic');
                    pdf.text('Informe sin filtros aplicados · todo el histórico disponible del paciente', M, y + 3);
                    y += 8;
                }

                // ── KPIs principales (4 tarjetas) ──
                const kpiH = 18;
                const kpiW = (contentW - 3 * 3) / 4;
                const kpis = [
                    ['Dispensaciones', patient.dispensaciones.length.toLocaleString('es-ES'), C_PRIM],
                    ['Unidades totales', patient.totalUnidades.toLocaleString('es-ES'), C_GREEN],
                    ['Coste total', `${patient.totalCoste.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})} €`, C_ORANGE],
                    ['Tratamientos', patient.tratamientos.length.toString(), C_DARK],
                ];
                kpis.forEach((kpi, i) => {
                    const kx = M + i * (kpiW + 3);
                    pdf.setFillColor(...C_GREY_BG);
                    pdf.roundedRect(kx, y, kpiW, kpiH, 2, 2, 'F');
                    // barra superior coloreada
                    pdf.setFillColor(...kpi[2]);
                    pdf.rect(kx, y, kpiW, 1.5, 'F');
                    // etiqueta
                    pdf.setTextColor(...C_TEXT_SOFT);
                    pdf.setFontSize(7);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text(kpi[0].toUpperCase(), kx + kpiW / 2, y + 6, { align: 'center' });
                    // valor
                    pdf.setTextColor(...kpi[2]);
                    pdf.setFontSize(12);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text(kpi[1], kx + kpiW / 2, y + 13.5, { align: 'center' });
                });
                y += kpiH + 8;

                // ── Cabecera "Detalle por tratamiento" ──
                y = ensureSpace(y, 12);
                pdf.setTextColor(...C_PRIM);
                pdf.setFontSize(11);
                pdf.setFont('helvetica', 'bold');
                pdf.text('Detalle por tratamiento', M, y);
                pdf.setDrawColor(...C_PRIM);
                pdf.setLineWidth(0.5);
                pdf.line(M, y + 1.5, M + 50, y + 1.5);
                y += 8;

                // ── Bucle de tratamientos ──
                patient.tratamientos.forEach((tto, ttoIdx) => {
                    // calcular cuánto espacio aproximado se necesita
                    const tableMinHeight = 30 + Math.min(tto.dispensaciones.length, 5) * 6;
                    y = ensureSpace(y, tableMinHeight);

                    // Banner del tratamiento
                    pdf.setFillColor(240, 230, 255);
                    pdf.setDrawColor(118, 75, 162);
                    pdf.setLineWidth(0.8);
                    pdf.roundedRect(M, y, contentW, 9, 2, 2, 'FD');
                    // línea de acento
                    pdf.setFillColor(118, 75, 162);
                    pdf.rect(M, y, 1.5, 9, 'F');
                    pdf.setTextColor(118, 75, 162);
                    pdf.setFontSize(10);
                    pdf.setFont('helvetica', 'bold');
                    const ttoLabel = patient.multipleTratamientos
                        ? `Tratamiento ${ttoIdx + 1}: ${tto.principioActivo}`
                        : tto.principioActivo;
                    pdf.text(ttoLabel, M + 4, y + 6);
                    // mini cifras a la derecha
                    pdf.setFontSize(8);
                    pdf.setTextColor(...C_TEXT_SOFT);
                    pdf.setFont('helvetica', 'normal');
                    pdf.text(`${tto.dispensaciones.length} disp.`, pageWidth - M - 4, y + 6, { align: 'right' });
                    y += 12;

                    // Sub-KPIs del tratamiento (3 tarjetas más pequeñas)
                    const sk_h = 14;
                    const sk_w = (contentW - 2 * 3) / 3;
                    const adhColor = tto.adherencia === null ? C_TEXT_SOFT
                                    : tto.adherencia >= 80 ? C_GREEN
                                    : tto.adherencia >= 50 ? C_ORANGE
                                    : C_RED;
                    const adhValue = tto.adherencia === null
                        ? 'No calculable'
                        : `${tto.adherencia.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})}%`;
                    const subKpis = [
                        ['Unidades', tto.totalUnidades.toLocaleString('es-ES'), C_DARK],
                        ['Coste', `${tto.totalCoste.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})} €`, C_ORANGE],
                        ['Adherencia (MPR)', adhValue, adhColor],
                    ];
                    subKpis.forEach((kpi, i) => {
                        const kx = M + i * (sk_w + 3);
                        pdf.setFillColor(250, 250, 252);
                        pdf.setDrawColor(...C_GREY_LINE);
                        pdf.setLineWidth(0.3);
                        pdf.roundedRect(kx, y, sk_w, sk_h, 1.5, 1.5, 'FD');
                        pdf.setTextColor(...C_TEXT_SOFT);
                        pdf.setFontSize(7);
                        pdf.setFont('helvetica', 'normal');
                        pdf.text(kpi[0], kx + 2.5, y + 4.5);
                        pdf.setTextColor(...kpi[2]);
                        pdf.setFontSize(10);
                        pdf.setFont('helvetica', 'bold');
                        pdf.text(kpi[1], kx + 2.5, y + 10);
                    });
                    y += sk_h + 1;

                    // Nota MPR si no es calculable o si tiene warning
                    if (tto.adherencia === null && tto.adherenciaMotivo) {
                        pdf.setTextColor(...C_TEXT_SOFT);
                        pdf.setFontSize(7);
                        pdf.setFont('helvetica', 'italic');
                        const motivoLines = pdf.splitTextToSize(`Adherencia: ${tto.adherenciaMotivo}`, contentW);
                        pdf.text(motivoLines, M, y + 3);
                        y += 3 + motivoLines.length * 3;
                    } else if (tto.adherencia !== null) {
                        pdf.setTextColor(...C_TEXT_SOFT);
                        pdf.setFontSize(7);
                        pdf.setFont('helvetica', 'italic');
                        pdf.text(`${tto.diasCubiertos} días cubiertos / ${tto.diasTotales} días totales`, M, y + 3);
                        y += 5;
                    }

                    // Tabla de dispensaciones del tratamiento
                    // Reparto de columnas (ancho útil = 180 mm):
                    //   Fecha 18 · Medicamento 58 · Cant. 10 · Coste 18 · Servicio 30 · Patología 35
                    const colDefs = [
                        { x: M + 1,                                            w: 18, label: 'Fecha',       align: 'left',  wrap: false },
                        { x: M + 20,                                           w: 58, label: 'Medicamento', align: 'left',  wrap: true  },
                        { x: M + 80,                                           w: 10, label: 'Cant.',       align: 'right', wrap: false },
                        { x: M + 92,                                           w: 18, label: 'Coste',       align: 'right', wrap: false },
                        { x: M + 112,                                          w: 30, label: 'Servicio',    align: 'left',  wrap: true  },
                        { x: M + 144,                                          w: 35, label: 'Patología',   align: 'left',  wrap: true  },
                    ];
                    const MAX_LINES = 3;        // tope de líneas por celda con wrap
                    const LINE_H    = 3.2;      // alto de línea de texto a 7 pt
                    const ROW_PAD_V = 1.5;      // padding vertical dentro de la fila

                    const drawTableHeader = (yPos, customLabel = null) => {
                        pdf.setFillColor(...C_DARK);
                        pdf.rect(M, yPos, contentW, 7, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.setFontSize(7.5);
                        pdf.setFont('helvetica', 'bold');
                        colDefs.forEach((col, i) => {
                            const label = (i === 1 && customLabel) ? customLabel : col.label;
                            const tx = col.align === 'right' ? col.x + col.w - 1 : col.x;
                            pdf.text(label, tx, yPos + 5, { align: col.align });
                        });
                        return yPos + 7;
                    };

                    // Trunca un texto con elipsis para que quepa exactamente en `maxLines` líneas
                    // dentro del ancho dado, usando la fuente actualmente seleccionada.
                    const wrapWithLimit = (text, width, maxLines) => {
                        const lines = pdf.splitTextToSize(text, width);
                        if (lines.length <= maxLines) return lines;
                        // Tomamos las maxLines primeras; en la última recortamos y añadimos elipsis
                        const trimmed = lines.slice(0, maxLines);
                        let last = trimmed[maxLines - 1];
                        // Ir recortando carácteres hasta que con "…" entre dentro del ancho
                        while (last.length > 0 && pdf.getStringUnitWidth(last + '…') * 7 / pdf.internal.scaleFactor > width) {
                            last = last.slice(0, -1);
                        }
                        trimmed[maxLines - 1] = (last.replace(/[\s,.;:]+$/, '') + '…');
                        return trimmed;
                    };

                    y = ensureSpace(y, 14);
                    y = drawTableHeader(y);

                    // filas
                    pdf.setFontSize(7);
                    pdf.setFont('helvetica', 'normal');
                    tto.dispensaciones.forEach((row) => {
                        const fecha = row['Fecha Dispensación']
                            ? row['Fecha Dispensación'].toLocaleDateString('es-ES')
                            : '-';
                        const med       = (row['Descripción Producto Dispensado'] || '-');
                        const cant      = (row['Cantidad'] !== undefined && row['Cantidad'] !== null) ? row['Cantidad'].toString() : '-';
                        const coste     = `${(parseNumES(row['Coste Dispensación'])).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})} €`;
                        const servicio  = (row['Servicio Prescriptor'] || '-');
                        const patologia = (row['Patología'] || '-');

                        // Asegurar que pdf usa la fuente correcta antes de medir
                        pdf.setFontSize(7);
                        pdf.setFont('helvetica', 'normal');

                        // Calcular wrap de las celdas que lo necesitan
                        const padW = 1; // pequeño padding lateral interno
                        const medLines = wrapWithLimit(med,       colDefs[1].w - padW, MAX_LINES);
                        const srvLines = wrapWithLimit(servicio,  colDefs[4].w - padW, MAX_LINES);
                        const patLines = wrapWithLimit(patologia, colDefs[5].w - padW, MAX_LINES);

                        const maxLines = Math.max(1, medLines.length, srvLines.length, patLines.length);
                        const rowH = Math.max(6, ROW_PAD_V * 2 + maxLines * LINE_H);

                        // Si la fila no cabe en la página actual, saltamos y reimprimimos cabecera
                        if (y + rowH > BOTTOM_LIMIT) {
                            pdf.addPage();
                            addPDFHeader(pdf, 'Informe individual de paciente');
                            y = 35;
                            y = drawTableHeader(y, `Medicamento (cont. — ${ttoLabel})`);
                            pdf.setFontSize(7);
                            pdf.setFont('helvetica', 'normal');
                        }

                        // Fondo alterno (alternancia local por índice de fila ya dibujada en esta página)
                        // — para mantener la legibilidad usamos el índice "global" en el array
                        // (no hace falta perfección, basta con alternar)
                        const idxLocal = tto.dispensaciones.indexOf(row);
                        if (idxLocal % 2 === 0) {
                            pdf.setFillColor(...C_GREY_BG);
                            pdf.rect(M, y, contentW, rowH, 'F');
                        }
                        pdf.setTextColor(...C_TEXT);

                        // Línea base del texto (top de la primera línea)
                        const textBaseY = y + ROW_PAD_V + 2.4;

                        // Fecha (no wrap)
                        pdf.text(fecha, colDefs[0].x, textBaseY);
                        // Medicamento (multi-línea)
                        pdf.text(medLines, colDefs[1].x, textBaseY);
                        // Cantidad
                        pdf.text(cant, colDefs[2].x + colDefs[2].w - 1, textBaseY, { align: 'right' });
                        // Coste
                        pdf.text(coste, colDefs[3].x + colDefs[3].w - 1, textBaseY, { align: 'right' });
                        // Servicio (multi-línea si hace falta)
                        pdf.text(srvLines, colDefs[4].x, textBaseY);
                        // Patología (multi-línea si hace falta)
                        pdf.text(patLines, colDefs[5].x, textBaseY);

                        y += rowH;
                    });
                    y += 8; // separación entre tratamientos
                });

                // ── Devoluciones (si las hay) ──
                if (patient.devoluciones && patient.devoluciones.length > 0) {
                    y = ensureSpace(y, 30);
                    // Banner naranja
                    pdf.setFillColor(254, 245, 231);
                    pdf.setDrawColor(...C_ORANGE);
                    pdf.setLineWidth(0.8);
                    pdf.roundedRect(M, y, contentW, 10, 2, 2, 'FD');
                    pdf.setFillColor(...C_ORANGE);
                    pdf.rect(M, y, 1.5, 10, 'F');
                    pdf.setTextColor(...C_ORANGE);
                    pdf.setFontSize(10);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text(`Devoluciones registradas (${patient.devoluciones.length})`, M + 4, y + 6.5);
                    y += 13;

                    pdf.setTextColor(...C_TEXT_SOFT);
                    pdf.setFontSize(7);
                    pdf.setFont('helvetica', 'italic');
                    const noteLines = pdf.splitTextToSize(
                        'Las siguientes dispensaciones con cantidad negativa NO se han incluido en los cálculos anteriores ni en el MPR.',
                        contentW
                    );
                    pdf.text(noteLines, M, y);
                    y += noteLines.length * 3 + 2;

                    // Tabla de devoluciones
                    // Reparto (ancho útil = 180 mm): Fecha 20 · Medicamento 120 · Cant. 14 · Coste 26
                    const dColDefs = [
                        { x: M + 1,                                w: 18,  label: 'Fecha',       align: 'left',  wrap: false },
                        { x: M + 20,                               w: 118, label: 'Medicamento', align: 'left',  wrap: true  },
                        { x: M + 140,                              w: 12,  label: 'Cant.',       align: 'right', wrap: false },
                        { x: M + 153,                              w: 26,  label: 'Coste',       align: 'right', wrap: false },
                    ];
                    const D_MAX_LINES = 3;

                    const drawDevHeader = (yPos) => {
                        pdf.setFillColor(...C_ORANGE);
                        pdf.rect(M, yPos, contentW, 7, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.setFontSize(7.5);
                        pdf.setFont('helvetica', 'bold');
                        dColDefs.forEach((col) => {
                            const tx = col.align === 'right' ? col.x + col.w - 1 : col.x;
                            pdf.text(col.label, tx, yPos + 5, { align: col.align });
                        });
                        return yPos + 7;
                    };
                    y = drawDevHeader(y);

                    pdf.setFontSize(7);
                    pdf.setFont('helvetica', 'normal');
                    patient.devoluciones.forEach((row, idx) => {
                        const fecha = row['Fecha Dispensación']
                            ? row['Fecha Dispensación'].toLocaleDateString('es-ES')
                            : '-';
                        const med   = (row['Descripción Producto Dispensado'] || '-');
                        const cant  = (row['Cantidad'] !== undefined && row['Cantidad'] !== null) ? row['Cantidad'].toString() : '-';
                        const coste = `${(parseNumES(row['Coste Dispensación'])).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})} €`;

                        pdf.setFontSize(7);
                        pdf.setFont('helvetica', 'normal');

                        const medLines = wrapWithLimit(med, dColDefs[1].w - 1, D_MAX_LINES);
                        const maxLines = Math.max(1, medLines.length);
                        const rowH = Math.max(6, ROW_PAD_V * 2 + maxLines * LINE_H);

                        if (y + rowH > BOTTOM_LIMIT) {
                            pdf.addPage();
                            addPDFHeader(pdf, 'Informe individual de paciente');
                            y = 35;
                            y = drawDevHeader(y);
                            pdf.setFontSize(7);
                            pdf.setFont('helvetica', 'normal');
                        }

                        if (idx % 2 === 0) {
                            pdf.setFillColor(255, 248, 240);
                            pdf.rect(M, y, contentW, rowH, 'F');
                        }
                        pdf.setTextColor(...C_RED);
                        const textBaseY = y + ROW_PAD_V + 2.4;

                        pdf.text(fecha,    dColDefs[0].x, textBaseY);
                        pdf.text(medLines, dColDefs[1].x, textBaseY);
                        pdf.text(cant,     dColDefs[2].x + dColDefs[2].w - 1, textBaseY, { align: 'right' });
                        pdf.text(coste,    dColDefs[3].x + dColDefs[3].w - 1, textBaseY, { align: 'right' });
                        y += rowH;
                    });
                }

                // ── Footer común ──
                addPDFFooter(pdf);

                // ── Guardado ──
                const fechaFile = new Date().toISOString().slice(0, 10);
                pdf.save(`Informe_paciente_${patient.id}_${fechaFile}.pdf`);
            };

            // ============================================================
            // INFORME DE PERSISTENCIA (Kaplan-Meier) — PDF
            // ============================================================
            const generatePersistenciaPDF = async () => {
                if (!persistResults) { alert('Primero calcula la persistencia.'); return; }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = 210, M = 15, contentW = pageWidth - 2 * M;
                const BOTTOM_LIMIT = 275;

                const C_PRIM = [102, 126, 234];
                const C_DARK = [27, 67, 84];
                const C_GREY_BG = [245, 247, 250];
                const C_TEXT_SOFT = [93, 109, 126];
                const palette = [[41,128,185],[231,76,60],[39,174,96],[243,156,18],[142,68,173],[22,160,133],[211,84,0],[44,62,80],[192,57,43],[127,140,141]];

                const ensureSpace = (currentY, needed) => {
                    if (currentY + needed > BOTTOM_LIMIT) {
                        pdf.addPage();
                        addPDFHeader(pdf, 'Persistencia al tratamiento');
                        return 35;
                    }
                    return currentY;
                };

                addPDFHeader(pdf, 'Persistencia al tratamiento');
                let y = 35;

                // ── Banner de configuración ──
                const modoTxt = persistResults.mode === 'pa' ? 'Principios activos' : 'Presentaciones comerciales';
                const cohorteTxt = persistResults.cohort === 'all' ? 'Todos (naive + cambios)' : persistResults.cohort === 'naive' ? 'Solo naive' : 'Solo no naive';
                const granTxt = persistResults.granularity === 'months' ? 'Mensual' : persistResults.granularity === 'quarters' ? 'Trimestral' : 'Anual';
                const filtrosTxt = [];
                if (persistResults.service) filtrosTxt.push(`Servicio: ${persistResults.service}`);
                if (persistResults.pathology) filtrosTxt.push(`Patología: ${persistResults.pathology}`);
                const hasFilters = filtrosTxt.length > 0;
                const bannerH = hasFilters ? 34 : 28;

                pdf.setFillColor(...C_PRIM);
                pdf.roundedRect(M, y, contentW, bannerH, 3, 3, 'F');
                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(9); pdf.setFont('helvetica', 'bold');
                pdf.text('ANÁLISIS DE PERSISTENCIA', M + 4, y + 6);
                pdf.setFontSize(8); pdf.setFont('helvetica', 'normal');
                pdf.text(`Trabajando con: ${modoTxt}`, M + 4, y + 12);
                pdf.text(`Población: ${cohorteTxt}     ·     Granularidad: ${granTxt}`, M + 4, y + 17);
                pdf.text(`Ventana: inicio ${persistResults.startDate.toLocaleDateString('es-ES')}  ·  fin inclusión ${persistResults.inclusionEnd.toLocaleDateString('es-ES')}  ·  fin observación ${persistResults.obsEnd.toLocaleDateString('es-ES')}`, M + 4, y + 22);
                if (hasFilters) {
                    pdf.setFont('helvetica', 'bold');
                    pdf.text(`Filtros aplicados:`, M + 4, y + 28);
                    pdf.setFont('helvetica', 'normal');
                    pdf.text(filtrosTxt.join('     ·     '), M + 32, y + 28);
                }
                y += bannerH + 6;

                // ── Curva Kaplan-Meier (capturada de canvas oculto) ──
                y = ensureSpace(y, 95);
                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'fixed'; tempDiv.style.left = '-9999px';
                tempDiv.style.width = '1200px'; tempDiv.style.height = '760px';
                document.body.appendChild(tempDiv);
                try {
                    const cv = document.createElement('canvas');
                    cv.width = 1200; cv.height = 760;
                    tempDiv.appendChild(cv);

                    const datasets = persistResults.perMed.map((m, idx) => {
                        const col = palette[idx % palette.length];
                        const rgb = `rgb(${col[0]},${col[1]},${col[2]})`;
                        return {
                            label: `${m.med.length > 26 ? m.med.slice(0, 26) + '…' : m.med} (n=${m.cohortN})`,
                            data: persistResults.timePoints.map(tp => ({ x: tp.idx, y: Math.round(survAt(m.km.steps, tp.t) * 1000) / 10 })),
                            borderColor: rgb, backgroundColor: rgb,
                            stepped: true, fill: false, tension: 0, pointRadius: 2, borderWidth: 3
                        };
                    });
                    const ch = new Chart(cv, {
                        type: 'line',
                        data: { labels: persistResults.timePoints.map(tp => tp.label), datasets },
                        options: {
                            responsive: false, animation: false,
                            plugins: {
                                title: { display: true, text: 'Curva de persistencia (Kaplan-Meier)', font: { size: 26, weight: 'bold' }, color: '#1B4354' },
                                legend: { position: 'bottom', labels: { font: { size: 18 }, boxWidth: 16, padding: 10 } }
                            },
                            scales: {
                                y: { min: 0, max: 100, title: { display: true, text: '% de pacientes persistentes', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: (v) => v + '%' } },
                                x: { title: { display: true, text: granTxt === 'Mensual' ? 'Meses' : granTxt === 'Trimestral' ? 'Trimestres' : 'Años', font: { size: 18 } }, ticks: { font: { size: 16 } } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 350));
                    const imgW = contentW, imgH = contentW * 760 / 1200;
                    pdf.addImage(cv.toDataURL('image/png', 1.0), 'PNG', M, y, imgW, imgH);
                    ch.destroy();
                    y += imgH + 8;
                } finally {
                    document.body.removeChild(tempDiv);
                }

                // ── Sección por cada medicamento ──
                persistResults.perMed.forEach((m, idx) => {
                    y = ensureSpace(y, 40);

                    // Título medicamento con marca de color
                    const col = palette[idx % palette.length];
                    pdf.setFillColor(col[0], col[1], col[2]);
                    pdf.rect(M, y, 3, 7, 'F');
                    pdf.setFontSize(11); pdf.setFont('helvetica', 'bold');
                    pdf.setTextColor(...C_DARK);
                    const medTitle = m.med.length > 70 ? m.med.slice(0, 70) + '…' : m.med;
                    pdf.text(medTitle, M + 6, y + 5);
                    y += 11;

                    // Resumen de población
                    const resumenLines = [`Total de pacientes analizados: ${m.totalAll}`];
                    if (persistResults.cohort === 'all') {
                        resumenLines.push(`Naive: ${m.naiveN} (${m.totalAll ? ((m.naiveN / m.totalAll) * 100).toFixed(1) : 0}%)   ·   No naive: ${m.noNaiveN} (${m.totalAll ? ((m.noNaiveN / m.totalAll) * 100).toFixed(1) : 0}%)`);
                    }
                    resumenLines.push(m.km.medianReached
                        ? `Mediana de persistencia: ${m.km.median} días (~${(m.km.median / 30.4375).toFixed(1)} meses)`
                        : `Mediana de persistencia: no alcanzada (no baja del 50% en el periodo observado)`);
                    const boxH = 6 + resumenLines.length * 5;
                    pdf.setFillColor(...C_GREY_BG);
                    pdf.roundedRect(M, y, contentW, boxH, 2, 2, 'F');
                    pdf.setFontSize(8); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...C_DARK);
                    pdf.text('Población incluida', M + 3, y + 5);
                    pdf.setFont('helvetica', 'normal'); pdf.setTextColor(60, 60, 60);
                    let yy = y + 5;
                    resumenLines.forEach(l => { yy += 5; pdf.text(l, M + 3, yy); });
                    y += boxH + 4;

                    // Tabla de tratamientos previos (solo si procede)
                    if (persistResults.cohort !== 'naive' && m.prevTreatments.length > 0) {

                ];

                // ===== HELPERS =====
                const setFill = c => pdf.setFillColor(c[0], c[1], c[2]);
                const setText = c => pdf.setTextColor(c[0], c[1], c[2]);
                const setDraw = c => pdf.setDrawColor(c[0], c[1], c[2]);
                const fmtInt = n => Number(n || 0).toLocaleString('es-ES');
                const fmtCurrency = n => '€' + Number(n || 0).toLocaleString('es-ES', { maximumFractionDigits: 0 });
                const fmtCompact = (n) => {
                    n = Number(n || 0);
                    if (n >= 1_000_000) return (n / 1_000_000).toFixed(2).replace('.', ',') + 'M';
                    if (n >= 1_000)     return (n / 1_000).toFixed(1).replace('.', ',') + 'K';
                    return n.toLocaleString('es-ES');
                };
                const fmtCurrencyCompact = (n) => '€' + fmtCompact(n);
                const drawTriangle = (cx, cy, isUp, sz = 1.3, color = COLOR.green) => {
                    setFill(color);
                    if (isUp) pdf.triangle(cx - sz, cy + sz * 0.6, cx, cy - sz, cx + sz, cy + sz * 0.6, 'F');
                    else      pdf.triangle(cx - sz, cy - sz * 0.6, cx, cy + sz, cx + sz, cy - sz * 0.6, 'F');
                };

                const card = (x, y, w, h, accent = null) => {
                    setFill(COLOR.cardBg);
                    pdf.roundedRect(x, y, w, h, 2, 2, 'F');
                    setDraw(COLOR.line);
                    pdf.setLineWidth(0.2);
                    pdf.roundedRect(x, y, w, h, 2, 2, 'S');
                    if (accent) {
                        setFill(accent);
                        pdf.rect(x, y, w, 0.9, 'F');
                    }
                };

                // ===== DATOS =====
                const totals = calculateGlobalTotals(dataToProcess);
                const yearData = calculateByYears(dataToProcess);
                const evolutionData = calculateEvolutionByYear(dataToProcess);
                const topPA = calculateTopPrincipiosActivos(dataToProcess, 5);
                const biosimData = calculateBiosimilarPenetration(dataToProcess);
                const cpData = calculateCostPerPatientByYear(dataToProcess);

                // Periodo
                let periodoTxt = 'Todos los datos';
                if (yearData.data && yearData.data.length > 0) {
                    const ys = yearData.data.map(r => Number(r.Periodo));
                    const yMin = Math.min(...ys), yMax = Math.max(...ys);
                    periodoTxt = (yMin === yMax) ? `${yMin}` : `${yMin} — ${yMax}`;
                }
                const fecha = new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                // Intervalo de fechas real de las dispensaciones
                const validDates_dc = dataToProcess.map(r => r['Fecha Dispensación']).filter(d => d instanceof Date && !isNaN(d));
                const minDate_dc = validDates_dc.length > 0 ? new Date(Math.min(...validDates_dc.map(d => d.getTime()))) : null;
                const maxDate_dc = validDates_dc.length > 0 ? new Date(Math.max(...validDates_dc.map(d => d.getTime()))) : null;
                const fmtDateDc = d => d ? d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
                const dateRangeTxt = minDate_dc && maxDate_dc ? `${fmtDateDc(minDate_dc)} – ${fmtDateDc(maxDate_dc)}` : '';

                const activeFilters = [];
                if (filters.year) activeFilters.push(`Año ${filters.year}`);
                if (filters.service) activeFilters.push(filters.service);
                if (filters.pathology) activeFilters.push(filters.pathology);
                if (filters.activeIngredient) activeFilters.push(filters.activeIngredient);
                if (paFilterMode === 'selection' && selectedPASet.size > 0) activeFilters.push(`${selectedPASet.size} PA`);
                const lastY = yearData.data.length > 0 ? yearData.data[yearData.data.length - 1] : null;
                const prevY = yearData.data.length > 1 ? yearData.data[yearData.data.length - 2] : null;
                const calcDelta = (curr, prev) => (prev > 0 ? ((curr - prev) / prev * 100) : null);
                const deltaPacientes = lastY && prevY ? calcDelta(lastY.Pacientes, prevY.Pacientes) : null;
                const deltaVisitas = lastY && prevY ? calcDelta(lastY.Visitas, prevY.Visitas) : null;
                const deltaDisp = lastY && prevY ? calcDelta(lastY.Dispensaciones, prevY.Dispensaciones) : null;
                const deltaCoste = lastY && prevY ? calcDelta(parseFloat(lastY.Coste), parseFloat(prevY.Coste)) : null;
                const lastCp = cpData.data.length > 0 ? parseFloat(cpData.data[cpData.data.length - 1]['Coste/Paciente']) : 0;
                const prevCp = cpData.data.length > 1 ? parseFloat(cpData.data[cpData.data.length - 2]['Coste/Paciente']) : null;
                const deltaCp = (lastCp && prevCp) ? calcDelta(lastCp, prevCp) : null;

                // ===================================================================
                // 1) CABECERA (banda azul petróleo) — 18mm
                // ===================================================================
                const HDR_H = 18;
                setFill(COLOR.petrol);
                pdf.rect(0, 0, PAGE_W, HDR_H, 'F');

                if (HOSPITAL_LOGO_BASE64) {
                    try { pdf.addImage(HOSPITAL_LOGO_BASE64, 'PNG', M, 4, 18, 9); } catch (e) {}
                }
                pdf.setFont('helvetica', 'bold');
                pdf.setFontSize(13);
                setText([255, 255, 255]);
                pdf.text('VIGIA-IMID · DASHBOARD EJECUTIVO', M + 24, 9);
                pdf.setFont('helvetica', 'normal');
                pdf.setFontSize(7.5);
                setText(COLOR.amber);
                pdf.text('Indicadores de gestión farmacéutica · Hospital Universitari i Politècnic La Fe', M + 24, 13.5);

                // Metadatos derecha
                pdf.setFont('helvetica', 'normal');
                pdf.setFontSize(6.5);
                setText([200, 215, 222]);
                pdf.text('PERIODO', PAGE_W - M - 80, 6.5);
                pdf.text('DISPENSACIONES', PAGE_W - M - 38, 6.5);
                pdf.text('FECHA', PAGE_W - M, 6.5, { align: 'right' });
                pdf.setFont('helvetica', 'bold');
                pdf.setFontSize(9);
                setText([255, 255, 255]);
                pdf.text(periodoTxt, PAGE_W - M - 80, 10.5);
                pdf.setFont('helvetica', 'normal');
                pdf.setFontSize(7.5);
                setText([200, 215, 222]);
                if (dateRangeTxt) pdf.text(dateRangeTxt, PAGE_W - M - 38, 10.5);
                pdf.setFont('helvetica', 'bold');
                pdf.setFontSize(8);
                setText([255, 255, 255]);
                pdf.text(fecha, PAGE_W - M, 10.5, { align: 'right' });
                if (activeFilters.length > 0) {
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    setText([200, 215, 222]);
                    const ftxt = 'Filtros: ' + activeFilters.join(' · ');
                    pdf.text(ftxt.length > 70 ? ftxt.substring(0, 70) + '…' : ftxt, PAGE_W - M, 15, { align: 'right' });
                }

                // ===================================================================
                // 2) FILA KPIs — altura reducida 18mm
                // ===================================================================
                let y = HDR_H + 3;       // y = 21
                const KPI_H = 18;
                const kpiCount = 5;
                const kpiGap = 3;
                const kpiW = (W - kpiGap * (kpiCount - 1)) / kpiCount;

                const kpis = [
                    { label: 'Pacientes',      value: fmtCompact(totals.pacientes),       full: fmtInt(totals.pacientes),                                                                  delta: deltaPacientes, accent: COLOR.petrolMd, icon: 'P' },
                    { label: 'Visitas',        value: fmtCompact(totals.visitas),         full: fmtInt(totals.visitas),                                                                     delta: deltaVisitas,   accent: COLOR.green,    icon: 'V' },
                    { label: 'Dispensaciones', value: fmtCompact(totals.dispensaciones),  full: fmtInt(totals.dispensaciones),                                                              delta: deltaDisp,      accent: COLOR.petrolMd, icon: 'D' },
                    { label: 'Coste total',    value: fmtCurrencyCompact(totals.coste),   full: fmtCurrency(totals.coste),                                                                  delta: deltaCoste,     accent: COLOR.amber,    icon: '€', upIsBad: true },
                    { label: 'Coste/paciente', value: '€' + fmtCompact(lastCp),           full: '€' + Number(lastCp).toLocaleString('es-ES', { maximumFractionDigits: 0 }),                  delta: deltaCp,        accent: COLOR.amber,    icon: 'C', upIsBad: true }
                ];

                kpis.forEach((k, i) => {
                    const x = M + i * (kpiW + kpiGap);
                    card(x, y, kpiW, KPI_H, k.accent);
                    // Icono circular
                    setFill(k.accent);
                    pdf.circle(x + 5.5, y + 9, 3, 'F');
                    setText([255, 255, 255]);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9);
                    pdf.text(k.icon, x + 5.5, y + 10.3, { align: 'center' });
                    // Etiqueta
                    setText(COLOR.muted);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6);
                    pdf.text(k.label.toUpperCase(), x + 11, y + 5);
                    // Valor compacto
                    setText(COLOR.ink);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(12);
                    pdf.text(k.value, x + 11, y + 11);
                    // Valor completo
                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6);
                    pdf.text(k.full, x + 11, y + 15);
                    // Delta
                    if (k.delta !== null && !isNaN(k.delta)) {
                        const isUp = k.delta > 0;
                        const isGood = k.upIsBad ? !isUp : isUp;
                        const deltaColor = isGood ? COLOR.green : COLOR.red;
                        drawTriangle(x + kpiW - 13, y + 13.5, isUp, 1.2, deltaColor);
                        setText(deltaColor);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(6.8);
                        pdf.text(`${Math.abs(k.delta).toFixed(1).replace('.', ',')}%`, x + kpiW - 11, y + 14.5);
                    }
                });

                // ===================================================================
                // 3) GRID 2×2 — Scorecard
                // Cálculo de alturas:
                //   HDR_H 18 + gap 3 + KPI_H 18 + gap 4 = 43  → arranque scorecard
                //   PAGE_H 210 - 8 (footer) = 202 fin scorecard
                //   202 - 43 = 159 dispone para 2 filas + 1 gap → 2 filas de 78 mm
                // ===================================================================
                y += KPI_H + 4;            // y = 43
                const BS_H = 78;
                const bsGap = 3;
                const bsW = (W - bsGap) / 2;

                // Helper para crear el header de cada bloque scorecard
                const blockHeader = (x, by, iconChar, iconColor, title, subtitle) => {
                    setFill(iconColor);
                    pdf.circle(x + 6, by + 6.5, 3.2, 'F');
                    setText([255, 255, 255]);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9);
                    pdf.text(iconChar, x + 6, by + 7.8, { align: 'center' });
                    setText(COLOR.ink);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9.5);
                    pdf.text(title, x + 12, by + 6);
                    setText(COLOR.muted);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    pdf.text(subtitle, x + 12, by + 9.5);
                };

                const miniKpiList = (kx, ky0, items) => {
                    let ky = ky0;
                    items.forEach(([label, val]) => {
                        setText(COLOR.muted);
                        pdf.setFont('helvetica', 'normal');
                        pdf.setFontSize(6);
                        pdf.text(label.toUpperCase(), kx, ky);
                        setText(COLOR.ink);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(8.5);
                        pdf.text(val, kx, ky + 3.8);
                        ky += 8.5;
                    });
                };

                // Crear contenedor temporal para charts
                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'fixed';
                tempDiv.style.left = '-9999px';
                tempDiv.style.width = '1600px';
                tempDiv.style.height = '1600px';
                document.body.appendChild(tempDiv);

                try {
                    // === BLOQUE 1 (fila 1, izq): ACTIVIDAD ASISTENCIAL ===
                    // Layout interno: dos sub-gráficos uno sobre otro, etiquetas pequeñas.
                    const b1x = M, b1y = y;
                    card(b1x, b1y, bsW, BS_H, COLOR.petrolMd);
                    blockHeader(b1x, b1y, 'A', COLOR.petrolMd, 'Actividad asistencial',
                                'Pacientes únicos · Visitas y dispensaciones por año');

                    // Sub-gráfico 1: Pacientes únicos (izquierda)
                    // Sub-gráfico 2: Visitas + Dispensaciones (derecha)
                    const subW = (bsW - 12) / 2;       // 6mm de margen lateral + 6mm de separador
                    const subTop = b1y + 14;
                    const subH = BS_H - 16;

                    // Sub-título 1
                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('Pacientes únicos', b1x + 4, subTop - 1);

                    const cA1 = document.createElement('canvas');
                    cA1.width = 600; cA1.height = 500;
                    tempDiv.appendChild(cA1);
                    const chA1 = new Chart(cA1, {
                        type: 'bar',
                        data: {
                            labels: evolutionData.years,
                            datasets: [{
                                data: evolutionData.pacientes,
                                backgroundColor: 'rgba(44, 92, 110, 0.92)',
                                borderRadius: 3, borderSkipped: false
                            }]
                        },
                        options: {
                            responsive: false, animation: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(226,232,240,0.7)', drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 18 } } },
                                x: { grid: { display: false, drawBorder: false }, ticks: { color: '#475569', font: { size: 20, weight: '600' } } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 200));
                    pdf.addImage(cA1.toDataURL('image/png', 1.0), 'PNG', b1x + 4, subTop, subW, subH);
                    chA1.destroy();

                    // Sub-título 2
                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('Visitas y dispensaciones', b1x + 4 + subW + 6, subTop - 1);

                    const cA2 = document.createElement('canvas');
                    cA2.width = 600; cA2.height = 500;
                    tempDiv.appendChild(cA2);
                    const chA2 = new Chart(cA2, {
                        type: 'bar',
                        data: {
                            labels: evolutionData.years,
                            datasets: [
                                { label: 'Visitas',        data: evolutionData.visitas,        backgroundColor: 'rgba(16, 168, 122, 0.92)',  borderRadius: 3, borderSkipped: false },
                                { label: 'Dispensaciones', data: evolutionData.dispensaciones, backgroundColor: 'rgba(232, 168, 56, 0.92)',  borderRadius: 3, borderSkipped: false }
                            ]
                        },
                        options: {
                            responsive: false, animation: false,
                            plugins: {
                                legend: { display: true, position: 'top', align: 'end', labels: { font: { size: 16 }, padding: 6, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded', color: '#475569' } },
                                tooltip: { enabled: false }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(226,232,240,0.7)', drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 18 } } },
                                x: { grid: { display: false, drawBorder: false }, ticks: { color: '#475569', font: { size: 20, weight: '600' } } }
                            }
                        }
                    });
                    await new Promise(r => setTimeout(r, 200));
                    pdf.addImage(cA2.toDataURL('image/png', 1.0), 'PNG', b1x + 4 + subW + 6, subTop, subW, subH);
                    chA2.destroy();

                    // === BLOQUE 2 (fila 1, der): DISTRIBUCIÓN CLÍNICA — 3 PIES ===
                    const b2x = M + bsW + bsGap, b2y = y;
                    card(b2x, b2y, bsW, BS_H, COLOR.petrol);
                    blockHeader(b2x, b2y, 'S', COLOR.petrol, 'Distribución clínica',
                                'Reparto porcentual por servicio prescriptor');

                    // Calcular distribución por servicio para pacientes / visitas / dispensaciones
                    const distByService = (mode) => {
                        // mode: 'pacientes' (Set Ids), 'visitas' (Set Id+fecha), 'dispensaciones' (count)
                        const m = {};
                        dataToProcess.forEach(row => {
                            if (!row['Servicio Prescriptor']) return;
                            const s = row['Servicio Prescriptor'];
                            if (!m[s]) m[s] = (mode === 'dispensaciones' ? 0 : new Set());
                            if (mode === 'pacientes') {
                                if (row['Id']) m[s].add(row['Id']);
                            } else if (mode === 'visitas') {
                                if (row['Id'] && row['Fecha Dispensación']) {
                                    m[s].add(row['Id'] + '_' + row['Fecha Dispensación'].toISOString().split('T')[0]);
                                }
                            } else {
                                m[s]++;
                            }
                        });
                        let arr = Object.keys(m).map(k => ({
                            name: k,
                            count: (mode === 'dispensaciones') ? m[k] : m[k].size
                        })).sort((a, b) => b.count - a.count);
                        // Agrupar top 5 + "Otros"
                        if (arr.length > 5) {
                            const top5 = arr.slice(0, 5);
                            const rest = arr.slice(5).reduce((s, x) => s + x.count, 0);
                            if (rest > 0) top5.push({ name: 'Otros', count: rest });
                            arr = top5;
                        }
                        return arr;
                    };
                    const distPac = distByService('pacientes');
                    const distVis = distByService('visitas');
                    const distDisp = distByService('dispensaciones');

                    // Layout 3 pies horizontales
                    const pieAreaTop = b2y + 16;
                    const pieAreaH = BS_H - 19;            // alto disponible
                    const pieW = (bsW - 12) / 3;           // ancho de cada slot
                    const piesData = [
                        { title: 'Pacientes',      data: distPac,  total: distPac.reduce((s, x) => s + x.count, 0) },
                        { title: 'Visitas',        data: distVis,  total: distVis.reduce((s, x) => s + x.count, 0) },
                        { title: 'Dispensaciones', data: distDisp, total: distDisp.reduce((s, x) => s + x.count, 0) }
                    ];

                    // Renderizar los 3 pies + leyendas
                    const pieIndexLeyenda = [];          // guardamos data del primero para hacer la leyenda común
                    for (let pi = 0; pi < piesData.length; pi++) {
                        const p = piesData[pi];
                        const pxStart = b2x + 4 + pi * (pieW + 4);
                        // Título del pie
                        setText(COLOR.inkSoft);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(7);
                        pdf.text(p.title, pxStart + pieW / 2, pieAreaTop, { align: 'center' });

                        // Dibujar pie
                        const cPie = document.createElement('canvas');
                        cPie.width = 500; cPie.height = 500;
                        tempDiv.appendChild(cPie);
                        const chPie = new Chart(cPie, {
                            type: 'doughnut',
                            data: {
                                labels: p.data.map(d => d.name),
                                datasets: [{
                                    data: p.data.map(d => d.count),
                                    backgroundColor: PIE_PALETTE.slice(0, p.data.length),
                                    borderColor: '#ffffff',
                                    borderWidth: 2
                                }]
                            },
                            options: {
                                responsive: false, animation: false,
                                cutout: '55%',
                                plugins: { legend: { display: false }, tooltip: { enabled: false } }
                            }
                        });
                        await new Promise(r => setTimeout(r, 200));
                        // El pie ocupa la zona central del slot
                        const pieSize = Math.min(pieW - 4, pieAreaH - 22);
                        const pieX = pxStart + (pieW - pieSize) / 2;
                        const pieY = pieAreaTop + 2;
                        pdf.addImage(cPie.toDataURL('image/png', 1.0), 'PNG', pieX, pieY, pieSize, pieSize);
                        chPie.destroy();

                        // === Etiquetas de porcentaje DENTRO de cada slice ===
                        // Chart.js dibuja doughnuts empezando arriba (-π/2) en sentido horario.
                        // Para cada slice calculamos su ángulo central y posicionamos el texto
                        // a un radio intermedio (entre el cutout interno y el borde externo).
                        // Color de texto: negro para fondos claros (verde, ámbar), blanco para
                        // fondos oscuros (azul petróleo, petrol medio, coral, gris).
                        // Índices de la paleta con texto BLANCO: 0 (petrol), 3 (petrolMd), 4 (coral), 5 (gris)
                        // Índices con texto NEGRO: 1 (verde), 2 (ámbar)
                        const whiteTextIdx = new Set([0, 3, 4, 5]);
                        if (p.data.length > 0 && p.total > 0) {
                            const cx = pieX + pieSize / 2;
                            const cy = pieY + pieSize / 2;
                            // Radio externo del donut (Chart.js usa el 95% aprox del canvas)
                            // Lo medimos en mm: el pie ocupa pieSize mm de lado en el PDF.
                            const rOut = pieSize / 2 * 0.92;
                            const rIn = rOut * 0.55;          // cutout 55%
                            const rText = (rOut + rIn) / 2;
                            let cumAngle = -Math.PI / 2;       // empezar arriba
                            for (let si = 0; si < p.data.length; si++) {
                                const slice = p.data[si];
                                const sliceFrac = slice.count / p.total;
                                const sliceAngle = sliceFrac * 2 * Math.PI;
                                const midAngle = cumAngle + sliceAngle / 2;
                                const tx = cx + Math.cos(midAngle) * rText;
                                const ty = cy + Math.sin(midAngle) * rText;
                                // Texto: si el slice es muy pequeño (<3%), omitimos para no saturar
                                if (sliceFrac >= 0.03) {
                                    const pctTxt = `${(sliceFrac * 100).toFixed(0)}%`;
                                    const useWhite = whiteTextIdx.has(si % PIE_PALETTE.length);
                                    setText(useWhite ? [255, 255, 255] : [25, 30, 40]);
                                    pdf.setFont('helvetica', 'bold');
                                    pdf.setFontSize(7.5);
                                    // align center, baseline approximate (sumamos 0.6mm para alinear visualmente)
                                    pdf.text(pctTxt, tx, ty + 0.8, { align: 'center' });
                                }
                                cumAngle += sliceAngle;
                            }
                        }
                    }

                    // Leyenda común debajo de los 3 pies (todos los pies usan la misma paleta y el mismo orden de servicios top)
                    // Usamos los servicios del primero como referencia (suelen ser los mismos top + Otros)
                    const legendY = pieAreaTop + pieAreaH - 12;
                    // Recopilar nombres únicos en orden
                    const legendNames = [];
                    piesData.forEach(p => p.data.forEach(d => { if (!legendNames.includes(d.name)) legendNames.push(d.name); }));
                    // Renderizar pequeños chips lado a lado
                    let lx = b2x + 4;
                    const maxLegendX = b2x + bsW - 4;
                    setText(COLOR.inkSoft);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6);
                    for (let li = 0; li < legendNames.length; li++) {
                        const txt = legendNames[li].length > 12 ? legendNames[li].substring(0, 12) + '…' : legendNames[li];
                        const wTxt = pdf.getTextWidth(txt);
                        const chipW = 3 + 1 + wTxt + 4;
                        if (lx + chipW > maxLegendX) {
                            lx = b2x + 4;
                            // si no cabe, mover a una segunda línea (pero no debería pasar con max 6)
                        }
                        // cuadrito de color
                        const col = PIE_PALETTE[li % PIE_PALETTE.length];
                        // Parsear rgba
                        const mch = col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                        if (mch) setFill([+mch[1], +mch[2], +mch[3]]);
                        pdf.rect(lx, legendY - 2, 2.5, 2.5, 'F');
                        setText(COLOR.inkSoft);
                        pdf.text(txt, lx + 4, legendY);
                        lx += chipW;
                    }

                    // === BLOQUE 3 (fila 2, izq): BIOSIMILARES ===
                    y += BS_H + bsGap;     // y = 124
                    const b3x = M, b3y = y;
                    card(b3x, b3y, bsW, BS_H, COLOR.green);
                    blockHeader(b3x, b3y, 'B', COLOR.green, 'Biosimilares',
                                'Penetración anual sobre PA con alternativa disponible');

                    const chW3 = bsW * 0.62;

            // INFORME DE SEGUIMIENTO — FUNCIÓN GENÉRICA PARAMETRIZABLE
            // Genera el informe completo en 5 páginas A4 vertical con estilo
            // Dashboard ejecutivo + tablas detalladas, para las granularidades:

                    } else {  // years (default)

                ];

                const setFill = c => pdf.setFillColor(c[0], c[1], c[2]);

                const fmtInt = n => Number(n || 0).toLocaleString('es-ES');
                const fmtCurrency = n => '€' + Number(n || 0).toLocaleString('es-ES', { maximumFractionDigits: 0 });
                const fmtCompact = (n) => {
                    n = Number(n || 0);

                    if (n >= 1_000)     return (n / 1_000).toFixed(1).replace('.', ',') + 'K';
                    return n.toLocaleString('es-ES');
                };
                const fmtCurrencyCompact = (n) => '€' + fmtCompact(n);
                const drawTriangle = (cx, cy, isUp, sz = 1.5, color = COLOR.green) => {

                };
                const card = (x, y, w, h, accent = null, fill = COLOR.cardBg) => {

                const cpData = GRAN.calcCostPP(dataToProcess);

                // Para el gráfico de evolución global usamos siempre años (más legible

                const evolutionData = calculateEvolutionByYear(dataToProcess);

                const dateRangeTxt = minDate && maxDate ? `${fmtDate(minDate)} – ${fmtDate(maxDate)}` : '';

                // Periodo descripción y filtros
                let periodoTxt = 'Todos los datos';
                if (allPeriods.length > 0) {

                // Deltas último periodo vs anterior

                const calcDelta = (curr, prev) => (prev > 0 ? ((curr - prev) / prev * 100) : null);
                const deltaPacientes = lastP && prevP ? calcDelta(lastP.Pacientes, prevP.Pacientes) : null;
                const deltaVisitas = lastP && prevP ? calcDelta(lastP.Visitas, prevP.Visitas) : null;
                const deltaDisp = lastP && prevP ? calcDelta(lastP.Dispensaciones, prevP.Dispensaciones) : null;
                const deltaCoste = lastP && prevP ? calcDelta(parseFloat(lastP.Coste), parseFloat(prevP.Coste)) : null;

                try {

                    { label: 'Coste total',    value: fmtCurrencyCompact(totals.coste),   full: fmtCurrency(totals.coste),                                                                  delta: deltaCoste,     accent: COLOR.red,     icon: '€', upIsBad: true }
                ];
                kpis.forEach((k, i) => {
                    const x = M + i * (kpiW + kpiGap);
                    card(x, y, kpiW, KPI_H, k.accent);

                    pdf.text(k.value, x + 5, y + 18);
                    setText(COLOR.inkSoft);
