                    const row = { 'Producto': producto };
                    let totalUnidades = 0;
                    let totalCoste = 0;
                    
                    years.forEach(year => {
                        if (productData[producto][year]) {
                            row[`${year} Unidades`] = productData[producto][year].unidades;
                            row[`${year} Coste`] = productData[producto][year].coste.toFixed(2);
                            totalUnidades += productData[producto][year].unidades;
                            totalCoste += productData[producto][year].coste;
                        } else {
                            row[`${year} Unidades`] = 0;
                            row[`${year} Coste`] = '0.00';
                        }
                    });
                    
                    row['TOTAL Unidades'] = totalUnidades;
                    row['TOTAL Coste'] = totalCoste.toFixed(2);
                    return row;
                }).sort((a, b) => b['TOTAL Coste'] - a['TOTAL Coste']);

                return {
                    type: 'product',
                    title: 'Unidades y Coste por Medicamento por Años',
                    data: results,
                    years: years
                };

            const calculateUnitsAndCostByProductByQuarter = (dataToProcess) => {

            const calculateUnitsAndCostByProductByMonth = (dataToProcess) => {

            // Devuelve un array de hojas [{ name, rows }] según el tipo de resultado
            const getExportSheets = () => {
                if (!results) return [];
                // Tabla simple
                if (Array.isArray(results.data) && results.data.length > 0 && typeof results.data[0] === 'object'

                    return sheets;

                // Racing por servicio → aplanar fotogramas a filas
                if (results.type === 'racing' && Array.isArray(results.data)) {

                sheets.forEach(sh => {

                const csvParts = sheets.map(sh => {

                    return head + XLSX.utils.sheet_to_csv(ws, { FS: ';' });
                });
                const csv = '﻿' + csvParts.join('\n\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');

                const tmp = document.createElement('canvas');

                c.fillStyle = '#ffffff';
                c.fillRect(0, 0, tmp.width, tmp.height);

                const a = document.createElement('a');

                                    return <RacingPA />;
                                })()}

                                {/* ══ STANDARD chart + table ══ */}
                                {!['racing','racing-pa','biosim-dual'].includes(results.type) && (
                                    <>
                                {/* ══ Menú de fármacos de ORIGEN (A) para el Sankey ══ */}
                                {results.type === 'sankey' && results.allSources && (() => {
                                    const total = results.allSources.length;
                                    const nSel = sankeySrcSet === null ? total : sankeySrcSet.size;
                                    const isChecked = (s) => sankeySrcSet === null ? true : sankeySrcSet.has(s);
                                    const toggle = (s) => {
                                        const base = sankeySrcSet === null ? new Set(results.allSources) : new Set(sankeySrcSet);
                                        if (base.has(s)) base.delete(s); else base.add(s);
                                        recomputeSankey(base);
                                    };
                                    const q = sankeySrcSearch.trim().toLowerCase();
                                    const visibles = q ? results.allSources.filter(s => s.toLowerCase().includes(q)) : results.allSources;
                                    return (
                                        <div style={{ background: 'var(--blanco)', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)', marginBottom: '16px', overflow: 'hidden' }}>
                                            <div style={{ padding: '0.6rem 0.8rem', borderBottom: '1px solid var(--gris-borde)', display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                                                <strong style={{ fontSize: '0.9rem', color: 'var(--azul)' }}>Fármacos de origen (A) a incluir</strong>
                                                <InfoTip text="Las trayectorias de cada paciente se calculan con TODAS las dispensaciones activas. Aquí solo eliges qué fármacos de ORIGEN (A) se muestran: se dibuja el flujo A→B únicamente si A está seleccionado. El destino B puede ser cualquier fármaco, esté o no seleccionado." />
                                                <span style={{ fontSize: '0.78rem', color: 'var(--texto-sec)', marginLeft: 'auto' }}>
                                                    {sankeySrcSet === null ? `Todos (${total})` : `${nSel} de ${total} seleccionados`}
                                                </span>
                                            </div>
                                            <div style={{ padding: '0.5rem 0.8rem', borderBottom: '1px solid var(--gris-borde)', display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                                                <input
                                                    type="text"
                                                    placeholder="🔍 Buscar fármaco de origen..."
                                                    value={sankeySrcSearch}
                                                    onChange={e => setSankeySrcSearch(e.target.value)}
                                                    style={{ width: '100%', padding: '0.4rem 0.5rem', fontSize: '0.82rem', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)' }}
                                                />
                                                <div style={{ display: 'flex', gap: '0.4rem' }}>
                                                    <button
                                                        onClick={() => recomputeSankey(null)}
                                                        style={{ flex: 1, padding: '0.3rem', fontSize: '0.75rem', fontWeight: '600', borderRadius: 'var(--radius)', border: '1px solid var(--verde)', background: 'var(--blanco)', color: 'var(--verde)', cursor: 'pointer' }}
                                                    >Todos</button>
                                                    <button
                                                        onClick={() => recomputeSankey(new Set())}
                                                        style={{ flex: 1, padding: '0.3rem', fontSize: '0.75rem', fontWeight: '600', borderRadius: 'var(--radius)', border: '1px solid var(--gris-borde)', background: 'var(--blanco)', color: 'var(--texto-sec)', cursor: 'pointer' }}
                                                    >Ninguno</button>
                                                </div>
                                            </div>
                                            <div style={{ maxHeight: '180px', overflowY: 'auto', padding: '0.4rem 0.8rem' }}>

                                                    <div style={{ fontSize: '0.8rem', color: 'var(--texto-sec)', padding: '0.4rem 0' }}>Sin coincidencias.</div>

                                                {visibles.map(s => (
                                                    <label key={s} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.2rem 0', fontSize: '0.82rem', cursor: 'pointer' }}>
                                                        <input type="checkbox" checked={isChecked(s)} onChange={() => toggle(s)} />
                                                        <span>{s}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}

                                {/* ══ Controles del Sankey de esquemas de tratamiento ══ */}
                                {results.type === 'pathway' && (
                                    <div style={{ background: 'var(--blanco)', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)', marginBottom: '16px', padding: '0.7rem 0.9rem', display: 'flex', flexWrap: 'wrap', gap: '1.2rem', alignItems: 'flex-end' }}>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem' }}>
                                            <label style={{ fontSize: '0.75rem', fontWeight: '600', color: 'var(--texto-sec)', display: 'flex', alignItems: 'center', gap: '0.3rem' }}>
                                                Fecha de inicio (naïve)
                                                <InfoTip text="Umbral del criterio naïve (bloque de persistencia): un paciente es naïve si su PRIMERA dispensación es igual o posterior a esta fecha, garantizando un período de lookback previo. Antes de esta fecha se consideran prevalentes (ya en tratamiento). Por defecto = primera dispensación activa + 4 meses de lavado." />
                                            </label>
                                            <input
                                                type="date"
                                                value={pathStartDate}
                                                onChange={(e) => recomputePathway({ startDate: e.target.value })}
                                                style={{ padding: '0.4rem 0.5rem', fontSize: '0.85rem', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)' }}
                                            />
                                        </div>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem' }}>
                                            <label style={{ fontSize: '0.75rem', fontWeight: '600', color: 'var(--texto-sec)' }}>Cohorte</label>
                                            <select
                                                value={pathCohort}
                                                onChange={(e) => recomputePathway({ cohort: e.target.value })}
                                                style={{ padding: '0.4rem 0.5rem', fontSize: '0.85rem', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)' }}
                                            >
                                                <option value="all">Todos (naïve + prevalentes)</option>
                                                <option value="naive">Solo naïve</option>
                                                <option value="noNaive">Solo no-naïve (prevalentes)</option>
                                            </select>
                                        </div>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem' }}>

                                            <select
                                                value={pathLines}
                                                onChange={(e) => recomputePathway({ nLines: parseInt(e.target.value) })}
                                                style={{ padding: '0.4rem 0.5rem', fontSize: '0.85rem', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)' }}
                                            >
                                                {[2, 3, 4, 5, 6, 7, 8].map(n => (
                                                    <option key={n} value={n}>{n} líneas (L1–L{n})</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                )}

                                {/* ══ Menú de fármacos de ORIGEN (L1) para el esquema de tratamiento ══ */}
                                {results.type === 'pathway' && results.allSources && (() => {
                                    const total = results.allSources.length;
                                    const nSel = pathSrcSet === null ? total : pathSrcSet.size;
                                    const isChecked = (s) => pathSrcSet === null ? true : pathSrcSet.has(s);
                                    const toggle = (s) => {
                                        const base = pathSrcSet === null ? new Set(results.allSources) : new Set(pathSrcSet);
                                        if (base.has(s)) base.delete(s); else base.add(s);
                                        recomputePathway({ sources: base });
                                    };
                                    const q = pathSrcSearch.trim().toLowerCase();
                                    const visibles = q ? results.allSources.filter(s => s.toLowerCase().includes(q)) : results.allSources;
                                    return (
                                        <div style={{ background: 'var(--blanco)', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)', marginBottom: '16px', overflow: 'hidden' }}>
                                            <div style={{ padding: '0.6rem 0.8rem', borderBottom: '1px solid var(--gris-borde)', display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                                                <strong style={{ fontSize: '0.9rem', color: 'var(--azul)' }}>Fármacos de origen (L1) a incluir</strong>
                                                <InfoTip text="Restringe qué trayectorias se muestran según su PRIMER tratamiento (L1). Se dibuja la trayectoria completa de un paciente solo si su fármaco de inicio (L1) está seleccionado; las líneas posteriores (L2, L3…) pueden ser cualquier fármaco. Las trayectorias se calculan siempre con todas las dispensaciones activas." />
                                                <span style={{ fontSize: '0.78rem', color: 'var(--texto-sec)', marginLeft: 'auto' }}>
                                                    {pathSrcSet === null ? `Todos (${total})` : `${nSel} de ${total} seleccionados`}
                                                </span>
                                            </div>
                                            <div style={{ padding: '0.5rem 0.8rem', borderBottom: '1px solid var(--gris-borde)', display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                                                <input
                                                    type="text"
                                                    placeholder="🔍 Buscar fármaco de origen (L1)..."
                                                    value={pathSrcSearch}
                                                    onChange={e => setPathSrcSearch(e.target.value)}
                                                    style={{ width: '100%', padding: '0.4rem 0.5rem', fontSize: '0.82rem', border: '1px solid var(--gris-borde)', borderRadius: 'var(--radius)' }}
                                                />
                                                <div style={{ display: 'flex', gap: '0.4rem' }}>
                                                    <button
                                                        onClick={() => recomputePathway({ sources: null })}
                                                        style={{ flex: 1, padding: '0.3rem', fontSize: '0.75rem', fontWeight: '600', borderRadius: 'var(--radius)', border: '1px solid var(--verde)', background: 'var(--blanco)', color: 'var(--verde)', cursor: 'pointer' }}
                                                    >Todos</button>
                                                    <button
                                                        onClick={() => recomputePathway({ sources: new Set() })}
                                                        style={{ flex: 1, padding: '0.3rem', fontSize: '0.75rem', fontWeight: '600', borderRadius: 'var(--radius)', border: '1px solid var(--gris-borde)', background: 'var(--blanco)', color: 'var(--texto-sec)', cursor: 'pointer' }}
                                                    >Ninguno</button>
                                                </div>
                                            </div>
                                            <div style={{ maxHeight: '180px', overflowY: 'auto', padding: '0.4rem 0.8rem' }}>
                                                {visibles.length === 0 && (
                                                    <div style={{ fontSize: '0.8rem', color: 'var(--texto-sec)', padding: '0.4rem 0' }}>Sin coincidencias.</div>
                                                )}
                                                {visibles.map(s => (
                                                    <label key={s} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.2rem 0', fontSize: '0.82rem', cursor: 'pointer' }}>
                                                        <input type="checkbox" checked={isChecked(s)} onChange={() => toggle(s)} />
                                                        <span>{s}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}

                                {/* Gráfico del análisis */}
                                <div className="analysis-chart-container">
                                    <canvas id="analysisChart" role="img" aria-label="Gráfico del análisis seleccionado"></canvas>
                                </div>
                                
                                <div className="table-container">
                                    <table>
                                        <thead>
                                            <tr>
                                                {(results.columnOrder || Object.keys(results.data[0] || {})).map(key => (
                                                    <th
                                                        key={key}
                                                        onClick={() => {
                                                            setSortConfig(prev => ({
                                                                key: key,
                                                                direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
                                                            }));
                                                        }}
                                                        style={{ cursor: 'pointer', userSelect: 'none' }}
                                                    >
                                                        {key}
                                                        {sortConfig.key === key && (
                                                            <span style={{ marginLeft: '5px' }}>
                                                                {sortConfig.direction === 'asc' ? '▲' : '▼'}
                                                            </span>
                                                        )}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {(() => {
                                                const sortedData = [...results.data].sort((a, b) => {
                                                    if (!sortConfig.key) return 0;
                                                    let aVal = a[sortConfig.key];
                                                    let bVal = b[sortConfig.key];

                                                    // Convertir a número solo si la celda es realmente numérica (admite formato ES/EN)
                                                    const toNum = (v) => {
                                                        if (typeof v === 'number') return v;
                                                        if (typeof v === 'string') {
                                                            const s = v.trim().replace(/[€%\s]/g, '');
                                                            if (/\d/.test(s) && /^[+-]?[\d.,]+$/.test(s)) return parseNumES(v);
                                                        }
                                                        return NaN;
                                                    };
                                                    const aNum = toNum(aVal);
                                                    const bNum = toNum(bVal);

                                                    if (!isNaN(aNum) && !isNaN(bNum)) {
                                                        return sortConfig.direction === 'asc' ? aNum - bNum : bNum - aNum;
                                                    }

                                                    // Ordenar como texto
                                                    const aStr = String(aVal || '').toLowerCase();
                                                    const bStr = String(bVal || '').toLowerCase();
                                                    if (aStr < bStr) return sortConfig.direction === 'asc' ? -1 : 1;
                                                    if (aStr > bStr) return sortConfig.direction === 'asc' ? 1 : -1;
                                                    return 0;
                                                });

                                                return sortedData.map((row, idx) => {
                                                    const cols = results.columnOrder || Object.keys(row);
                                                    // Key compuesta única: evita colisiones cuando la 1ª columna se repite
                                                    // (p. ej. "Etapa desde" en el Sankey de esquemas), que provocaban filas duplicadas.
                                                    const rowKey = cols.map(c => row[c]).join('¦') + '#' + idx;
                                                    return (
                                                    <tr key={rowKey}>
                                                        {cols.map((key, i) => {
                                                            const value = row[key];
                                                            const isFirstColumn = i === 0;
                                                            const isPatientIdColumn = key === 'Id de los pacientes';
                                                            const isTrendColumn = key === 'Tendencia';
                                                            const isVarColumn = key === 'Var%';
                                                            const isHeatmap = results.type === 'heatmap';
                                                            const isNumber = typeof value === 'number' ||
                                                                            (!isNaN(parseFloat(value)) && isFinite(value) && key !== 'Periodo' && !isPatientIdColumn && !isTrendColumn);

                                                            // Color para tendencia
                                                            let trendColor = 'inherit';
                                                            if (isTrendColumn) {
                                                                if (value === '↑') trendColor = '#27ae60';
                                                                else if (value === '↓') trendColor = '#e74c3c';
                                                                else if (value === '→') trendColor = '#7f8c8d';
                                                            }

                                                            // Color para variación
                                                            let varColor = 'inherit';
                                                            if (isVarColumn && value !== '-') {
                                                                const varNum = parseFloat(value);
                                                                if (varNum > 2) varColor = '#27ae60';
                                                                else if (varNum < -2) varColor = '#e74c3c';
                                                                else varColor = '#7f8c8d';
                                                            }

                                                            // Color para heatmap
                                                            let heatmapStyle = {};
                                                            if (isHeatmap && !isFirstColumn && typeof value === 'number' && results.maxValue > 0) {
                                                                const intensity = value / results.maxValue;
                                                                const r = Math.round(255 - (intensity * 155));
                                                                const g = Math.round(255 - (intensity * 55));
                                                                const b = Math.round(255 - (intensity * 155));
                                                                heatmapStyle = {
                                                                    backgroundColor: `rgb(${r}, ${g}, ${b})`,
                                                                    color: intensity > 0.5 ? 'white' : 'inherit',
                                                                    fontWeight: 'bold'
                                                                };
                                                            }

                                                            return (
                                                                <td
                                                                    key={i}
                                                                    style={{
                                                                        textAlign: isTrendColumn ? 'center' : (isFirstColumn ? 'left' : 'right'),
                                                                        fontWeight: isNumber || isTrendColumn ? '600' : 'normal',
                                                                        color: isTrendColumn ? trendColor : (isVarColumn ? varColor : 'inherit'),
                                                                        fontSize: isTrendColumn ? '18px' : 'inherit',
                                                                        ...heatmapStyle
                                                                    }}
                                                                >
                                                                    {isNumber && !isFirstColumn
                                                                        ? parseFloat(value).toLocaleString('es-ES', {
                                                                            minimumFractionDigits: key.includes('Coste') ? 2 : 0,
                                                                            maximumFractionDigits: key.includes('Coste') ? 2 : 0
                                                                        })
                                                                        : value}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                    );
                                                });
                                            })()}
                                        </tbody>
                                    </table>
                                </div>
                                    </>
                                )}
                            </div>
                        )}
                            </>
                        )}

                        {/* === VISTA ANÁLISIS POR PACIENTE === */}
                        {viewMode === 'patient' && (
                            <>
                                <div className="alert alert-info" style={{marginBottom: '20px'}}>
